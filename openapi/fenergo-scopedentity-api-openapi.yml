openapi: 3.2.0
info:
  title: Fenergo Scoped Entity API
  version: '1.0'
  description: 'Operations tagged ScopedEntity across 7 of this provider''s published API definitions: fenergo-screeningcommand-v1-0-openapi.json, fenergo-screeningcommand-v2-0-openapi.json, fenergo-screeningcommand-v3-0-openapi.json, fenergo-screeningquery-v1-0-openapi.json, fenergo-screeningquery-v2-0-openapi.json, fenergo-screeningquery-v3-0-openapi.json, fenergo-screeningquery-v4-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
