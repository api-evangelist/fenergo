      additionalProperties: false
    EmailFooterDto:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether the email footer is included.
        text:
          type:
          - string
          - 'null'
          description: Footer text content.
      additionalProperties: false
      description: Configuration for the footer block appended to report notification emails.
    ConfigureReportBrandingDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/ConfigureReportBrandingDto'
          description: Request payload for configuring tenant-level report branding.
      additionalProperties: false
    LogoDto:
      type: object
      properties:
        s3Key:
          type:
          - string
          - 'null'
          description: S3 object key for the stored logo file.
        filename:
          type:
          - string
          - 'null'
          description: Original filename of the uploaded logo.
        sizeBytes:
          type:
          - integer
          - 'null'
          description: Size of the logo file in bytes.
          format: int64
        mimeType:
          type:
          - string
          - 'null'
          description: MIME type of the logo file (e.g. "image/png").
      additionalProperties: false
      description: Represents the logo asset associated with tenant report branding.
    ObjectServiceResponse:
