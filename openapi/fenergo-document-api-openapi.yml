  /api/v1/document/{extractionId}/{documentId}/download:
    get:
      tags:
      - Document
      summary: Download Policy Document
      description: Get a presigned URL to download the uploaded policy document
      parameters:
      - name: extractionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
