        senderDisplayName:
          type:
          - string
          - 'null'
          description: Display name shown in the From field of outgoing report emails.
        subjectLine:
          type:
          - string
          - 'null'
          description: Subject line for outgoing report emails.
        body:
          type:
          - string
          - 'null'
          description: Body content of outgoing report emails.
        footer:
          allOf:
          - $ref: '#/components/schemas/EmailFooterDto'
          description: Footer settings for outgoing report emails.
        showLogo:
          type: boolean
          description: Whether the tenant logo is displayed in the email.
      additionalProperties: false
      description: Email-specific branding configuration applied to report notification emails.
    GuidServiceResponse:
      type: object
      properties:
