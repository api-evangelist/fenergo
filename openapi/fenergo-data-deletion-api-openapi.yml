openapi: 3.2.0
info:
  title: Fenergo Data Deletion API
  version: '1.0'
  description: 'Operations tagged DataDeletion across 2 of this provider''s published API definitions: fenergo-dataprotectioncommand-v1-0-openapi.json, fenergo-productcommand-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /dataprotectioncommand
- url: /productcommand
