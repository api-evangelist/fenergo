openapi: 3.2.0
info:
  title: Fenergo Nebula CreditScreening Command Manual Credit…
  description: '**CreditScreening Command API**:


    Credit Screening Command API provides both configurational and operational methods related to the client''s credit screenings.'
  version: '1.0'
servers:
- url: /creditscreeningcommand
security:
- Bearer: []
tags:
- name: ManualCreditScreeningBatch
paths:
  /api/manual/batch/update:
    put:
      tags:
      - ManualCreditScreeningBatch
      summary: Update a batch of manual credit screening version
      description: 'This method updates a batch of existing Manual Credit Screening Version.


        Only Manual Credit Screening Version with "Draft" status can be updated.


        Required permissions:

        Following permissions are required: ManualCreditScreeningEdit'
      operationId: UpdateBatch
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Batch of Manual Credit Screening Version data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualCreditScreeningVersionDtoIEnumerableServiceRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ManualCreditScreeningVersionDtoIEnumerableServiceRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ManualCreditScreeningVersionDtoIEnumerableServiceRequest'
      responses:
        '202':
          description: Accepted for processing
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/BatchResultDtoServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResultDtoServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/BatchResultDtoServiceResponse'
        '400':
          description: Invalid request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not Found. Manual Credit Screening Set with given id does not exist
                  type: Error
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
  /api/manual/batch/complete:
    put:
      tags:
      - ManualCreditScreeningBatch
      summary: Complete a batch of manual credit screening version
      description: 'This method completes a batch of existing Manual Credit Screening Version.


        Only Manual Credit Screening Version with "Draft" status can be updated.


        Required permissions:

        Following permissions are required: ManualCreditScreeningEdit'
      operationId: CompleteBatch
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Batch of Manual Credit Screening Version data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCompleteDtoServiceRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/BatchCompleteDtoServiceRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/BatchCompleteDtoServiceRequest'
      responses:
        '202':
          description: Accepted for processing
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/BatchResultDtoServiceResponse'
            application/json:
              schema:
