openapi: 3.2.0
info:
  title: Fenergo Document Model API
  version: '1.0'
  description: 'Operations tagged DocumentModel across 3 of this provider''s published API definitions: fenergo-documentmanagementcommand-v1-0-openapi.json, fenergo-documentmanagementcommand-v2-0-openapi.json, fenergo-documentmanagementquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /documentmanagementcommand
- url: /documentmanagementquery
security:
- Bearer: []
tags:
- name: Document Model
paths:
  /api/documentmanagement:
    post:
      tags:
      - Document Model
      summary: Upload a document
      description: 'This method will upload the file in the AWS S3 bucket and publish an event to store the metadata related with the document.


        The method will return an object with some basic information to show the result to the user in the UI like status,

        document requirement and document type. The Id as well can be used in the query api to get the URL signed to show the document.


        Required permissions:

        Following permissions are required: DocumentManagementCreate'
      operationId: UploadDocumentModel
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - Data.EntityId
              - Data.File
              type: object
              properties:
                Data.File:
                  type: string
                  description: File to be saved in the S3 storage
                  format: binary
                Data.EntityId:
                  type: string
                  description: Entity Id from FenX to link the document with the entity
                  example: e1809731-77df-4e72-98e7-0d314b7a5151
                Data.JourneyId:
                  type: string
                  description: Journey Id from FenX to link the document with the journey
                  example: 61413fc2-0381-48f5-825b-225692f4d793
                Data.DocumentType:
                  type: string
                  description: The type of the document
                  example: Driver license
                Data.FriendlyName:
                  type: string
                  description: The friendly name of the document
                Data.DocumentRequirementIds:
                  uniqueItems: true
                  type: array
                  items:
                    type: string
                  description: Hash Set of Document Requirement Ids from FenX to link the document to document requirements
                Data.DocumentDataKey:
                  type: string
                  description: The unique identifier of the document requirement that the document is linked to
                  example: identificationDocuments
                Data.Properties:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/PropertyDto'
                  description: Custom document properties.
                  example:
                    firstName:
                      type: Single
                      value: Tom
                    dateOfBirth:
                      type: Single
                      value: '2021-07-15'
                    address:
                      type: Collection
                      dataGroupId: dfde9f06-040a-4127-b9a0-2c802a6502fc
                      collections:
                        54a25d24-1a4b-45c6-a5b4-980e5d3a1df5:
                          properties:
                            country: Ireland
                            city: Dublin
                            street: Mayor Street
                        47010265-3b85-4407-be61-90d04525f020:
                          properties:
                            country: Ireland
                            city: Dublin
                            street: E Wall Rd
            encoding:
              Data.File:
                style: form
              Data.EntityId:
                style: form
              Data.JourneyId:
                style: form
              Data.DocumentType:
                style: form
              Data.FriendlyName:
                style: form
              Data.DocumentRequirementIds:
                style: form
              Data.DocumentDataKey:
                style: form
              Data.Properties:
                style: form
      responses:
        '202':
          description: An instance of the Fenergo.Nebula.DocumentManagement.Command.Application.DTO.UploadDocumentResponseDto class with some metadata that represent the file uploaded
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UploadDocumentResponseDtoServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/UploadDocumentResponseDtoServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/UploadDocumentResponseDtoServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
