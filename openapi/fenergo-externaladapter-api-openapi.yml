  /api/external-adapter/suggestions/{providerId}:
    get:
      tags:
      - ExternalAdapter
      summary: Get suggestions from external provider
      description: 'Returns suggestions based on the specified parameters.


        Required permissions:

        At least one of the following permissions is required: PolicyConfigurationAccess, PolicySearch'
      operationId: GetSuggestions
      parameters:
      - name: providerId
        in: path
        description: The ID of the provider.
        required: true
        schema:
          type: string
          format: uuid
      - name: fieldName
        in: query
        description: The name of the field.
        required: true
        schema:
          type: string
      - name: fieldValue
        in: query
        description: The value of the field.
        required: true
        schema:
          type: string
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
