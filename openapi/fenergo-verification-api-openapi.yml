        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/InitiateVerificationDtoServiceRequest'
              description: Service request data
          text/json:
            schema:
