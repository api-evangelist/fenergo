  /api/record-reference-ingestion:
    post:
      tags:
      - Migration
      summary: Creates an ingestion process that allows users to create or overwrite record…
      description: 'Using the response pre-signed url, please add a csv format file. The file should contain the following headers: ''tableName'', ''alternateId'' and ''fenxId''.


        The options for tableName are "Company", "Individual", "Entity Group", "Product" or "Association".


        This endpoint bypasses original DataMigration restrictions and should be used with caution.


        The tenant id is mandatory and should be included as the header X-TENANT-ID.


        Required permissions:

        Following permissions are required: DataMigrationAdministrator'
