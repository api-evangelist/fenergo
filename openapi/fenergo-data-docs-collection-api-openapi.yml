          example: INTERNAL_SERVER_ERROR
      additionalProperties: false
      description: The message associated to the service response
    DataDocsHeaderDto:
      required:
      - journeyId
      - taskId
      type: object
      properties:
        taskId:
          minLength: 1
          type: string
          description: ID of the journey task
          example: 300e2046-f78c-49d2-b326-afba28dc301c
        fields:
          allOf:
          - $ref: '#/components/schemas/DataDocsResultDto'
          description: List of Fields, currently only aggregated fields supported
        journeyId:
          minLength: 1
          type: string
          description: ID of the journey
          format: uuid
          example: 300e2046-f78c-49d2-b326-afba28dc301c
      additionalProperties: false
      description: Class to represent deduplication statuses for all Associations
    ProcessDataDocsSummarisationDto:
      required:
      - journeyId
      - taskId
      type: object
      properties:
        taskId:
          minLength: 1
          type: string
          description: ID of the journey task
          format: uuid
          example: 300e2046-f78c-49d2-b326-afba28dc301c
        journeyId:
          minLength: 1
          type: string
          description: ID of the journey
          format: uuid
          example: 400e3046-f78c-49d2-b326-afba28dc301d
