openapi: 3.2.0
info:
  title: Fenergo Nebula Localisation Command Localisation Context API
  description: '**Localisation Command API**:


    Localisation Command API provides both configurational and operational methods related to the client localisations.'
  version: '1.0'
servers:
- url: /localisationcommand
security:
- Bearer: []
tags:
- name: LocalisationContext
paths:
  /api/localisationcontext/{localisationId}/version/{versionNumber}:
    post:
      tags:
      - LocalisationContext
      summary: Create a new Localisation Context
      description: 'This method creates new Localisation Context to an existing Localisation


        Please be awared only context with name Default will work for localisation


        Context is a logical area which groups fen-x pages or features


        For example Default context is the generic context which is used by all fen-x components.


        Required permissions:

        Following permissions are required: LocalisationEdit'
      operationId: CreateLocalisationContext
      parameters:
      - name: localisationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: versionNumber
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalisationContextDtoServiceRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/LocalisationContextDtoServiceRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/LocalisationContextDtoServiceRequest'
      responses:
        '202':
          description: Accepted for processing
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LocalisationContextDtoServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/LocalisationContextDtoServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/LocalisationContextDtoServiceResponse'
        '400':
          description: Invalid request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Localisation with given ID does not exists
                  type: Error
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
