info:
  title: Fenergo Schema API
  version: '1.0'
  description: 'Operations tagged Schema across 2 of this provider''s published API definitions: fenergo-reportsquery-v1-0-openapi.json, fenergo-reportsquery-v2-0-openapi.json. Each path carries the servers of the definition it was published in.'
