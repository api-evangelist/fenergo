            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    UpdateLocalisationContextDto:
      required:
      - values
      type: object
      properties:
        description:
          type:
          - string
          - 'null'
          description: Description of the context
          example: Translation for Chinese
        values:
          type: object
          additionalProperties: {}
          description: Localisation file for current context
        displayName:
          type:
          - string
          - 'null'
          description: User desired name to display of the file
          example: ThaiTranslation
      additionalProperties: false
      description: Defines the context of the localisation file
    ValidateContextAndRefreshCacheDtoServiceResponse:
