  /api/product-requirements-in-scope/evaluation-definitions:
    post:
      tags:
      - ProductRequirementsInScope
      summary: Get evaluation definitions
      description: 'Returns the versioned requirement sets matching the supplied pinned version IDs, plus the

        active version of any set that has activation conditions. Requirements are optionally

        filtered by type.


        Required permissions:

        At least one of the following permissions is required: ProductConfigurationSearch, ProductConfigurationAccess'
      operationId: GetEvaluationDefinitions
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Pinned jurisdictions and optional requirement type filter
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/GetEvaluationDefinitionsRequestDtoServiceRequest'
      responses:
        '200':
