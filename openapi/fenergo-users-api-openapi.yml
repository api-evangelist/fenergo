openapi: 3.2.0
info:
  title: Fenergo Users API
  version: '1.0'
  description: 'Operations tagged Users across 3 of this provider''s published API definitions: fenergo-identity-scim-v1-openapi.json, fenergo-identitymanagementcommand-v1-0-openapi.json, fenergo-identitymanagementquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /scim
- url: /identitymanagementcommand
- url: /identitymanagementquery
security:
- Bearer: []
tags:
- name: Users
paths:
  /Users:
    get:
      tags:
      - Users
      summary: Gets all users. Accepts filters and sorting
      description: 'Check out the following sections of the SCIM RFC for more information about how to use the search parameters:


        Definition of the search attributes: RFC 7644 Section 3.4.3


        The format of the ''attributes'' and the ''excludedAttributes'' properties: RFC 7644 Section 3.10


        Supported operators for filtering: RFC 7644 Section 3.4.2.2


        Groups with many members could make endpoint timeout, make sure members attribute is added to the list of excludedAttributes. For groups with many members, prefer /Groups/{id} endpoint.'
      operationId: GetAllUsers
      parameters:
      - name: attributes
        in: query
        description: A multi-valued list of strings indicating the names of resource attributes to return in the response
        schema:
          type: array
          items:
            type: string
      - name: excludedAttributes
        in: query
        description: A multi-valued list of strings indicating the names of resource attributes to be removed from the default set of attributes to return
        schema:
          type: array
          items:
            type: string
      - name: sortBy
        in: query
        description: A string indicating the attribute whose value shall be used to order the returned responses
        schema:
          type: string
      - name: sortOrder
        in: query
        description: 'An integer indicating the order in which the "sortBy" parameter is applied. Sort order: 0 ''Ascending'' or 1 ''Descending''.'
        schema:
          $ref: '#/components/schemas/SearchSCIMRepresentationOrders'
      - name: startIndex
        in: query
        description: An integer indicating the 1-based index of the first query result.
        schema:
          type: integer
          format: int32
      - name: count
        in: query
        description: An integer indicating the desired maximum number of query results per page
        schema:
          type: integer
          format: int32
      - name: filter
        in: query
        description: Filter expression from the SCIM 2.0 specification <a href="https://www.rfc-editor.org/rfc/rfc7644#section-3.4.2.2">(RFC 7644)</a> (case in-sensitive).
        schema:
          type: string
        examples:
          No filter:
            value: ''
          UserName equals 'peter':
            value: userName Eq "peter"
          UserName starts with 'pe' and displayName attribute is present (has value):
            value: userName sw "pe" and displayName pr
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponseDto'
              example:
                schemas:
                - urn:ietf:params:scim:api:messages:2.0:ListResponse
                totalResults: 2
                itemsPerPage: 100
                startIndex: 1
                Resources:
                - id: 12345678-1234-1234-1234-123456789011
                  name:
                    givenName: John
                    familyName: Smith
                  userName: John.Smith
                  x509Certificates: []
                  phoneNumbers: []
                  entitlements: []
                  emails: []
                  ims: []
                  addresses: []
                  photos: []
                  roles: []
                  groups: []
                  meta:
                    resourceType: User
                    created: '2022-02-02T12:59:59.123456'
                    lastModified: '2022-02-02T12:59:59.123456'
                    version: 0
                    location: https://company.com/scim/Users/12345678-1234-1234-1234-123456789011
                  schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                  - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
                  - urn:ietf:params:scim:schemas:extension:custom:1.0:User
                - id: 12345678-1234-1234-1234-123456789012
                  emails:
                  - value: peter.jackson@company.com
                    type: work
                  - value: peter.jackson@personal.com
                    primary: true
                    type: home
                  userName: peter.jackson
                  name:
                    familyName: jackson
                    givenName: peter
                  x509Certificates: []
                  phoneNumbers: []
                  entitlements: []
                  ims: []
                  addresses: []
                  photos: []
                  roles: []
                  groups: []
                  meta:
                    resourceType: User
                    created: '2022-02-02T22:59:59.123456'
                    lastModified: '2022-02-02T22:59:59.123456'
                    version: 0
                    location: https://company.com/scim/Users/12345678-1234-1234-1234-123456789012
                  schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                  - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
                  - urn:ietf:params:scim:schemas:extension:custom:1.0:User
        '401':
          description: Unauthorized
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
    post:
      tags:
      - Users
      summary: Creates a user and returns the user details along with the user's unique ID
      description: 'The mandatory fields to create a new user are:


        A primary email address (emails.primary: true)


        A username (userName)


        A name (name.familyName and name.givenName)


        The following attributes and values are not supported:


        Password. It is not supported to set the user password when creating a new user


        Active. It is not supported to create a user with the ''active'' attribute set to ''false''. If not specified, ''active'' will be set to ''true''


        Groups. It is not supported to add groups to the users


        Roles and Entitlements. The roles and entitlements SCIM extension is not supported


        Returns 201 if successfully created, 409 Conflict if ''userName'' already exists.


        The ''id'' returned by this endpoint when a user is created is the ID of the user in the SCIM API, and can be used to manage the user resource within the SCIM API. Once the user is created in Fen-X Identity, a new ID will be generated there that can''t be retrieved via the SCIM API. That ID can be used for example to set up the user permissions in the Authorization domain.'
      operationId: CreateUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersCreateUpdateRequestDto'
            examples:
              users-create-user-minimal:
                summary: Users - Create a user (minimal)
                description: Create a new user with the minimal set of data required
                value:
                  schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                  userName: johndoe@company.com
                  emails:
                  - type: work
                    value: johndoe@company.com
                    primary: true
                  name:
                    familyName: Doe
                    givenName: John
              users-create-user-full:
                summary: Users - Create a user (full)
                description: Create a new user with all the properties supported by the API
                value:
                  schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                  externalId: '701984'
                  userName: bjensen@example.com
                  name:
                    formatted: Ms. Barbara J Jensen, III
                    familyName: Jensen
                    givenName: Barbara
                    middleName: Jane
                    honorificPrefix: Ms.
                    honorificSuffix: III
                  emails:
                  - value: bjensen@example.com
                    type: work
                    primary: true
                  - value: babs@jensen.org
                    type: home
                  active: true
                  displayName: Babs Jensen
                  nickName: Babs
                  profileUrl: https://login.example.com/bjensen
                  userType: Employee
                  title: Tour Guide
                  preferredLanguage: en-US
                  locale: en-US
                  timezone: America/Los_Angeles
                  addresses:
                  - type: work
                    streetAddress: 100 Universal City Plaza
                    locality: Hollywood
                    region: CA
                    postalCode: '91608'
                    country: USA
                    formatted: '100 Universal City Plaza

                      Hollywood, CA 91608 USA'
                    primary: true
                  - type: home
                    streetAddress: 456 Hollywood Blvd
                    locality: Hollywood
                    region: CA
                    postalCode: '91608'
                    country: USA
                    formatted: '456 Hollywood Blvd

                      Hollywood, CA 91608 USA'
                  phoneNumbers:
                  - value: 555-555-5555
                    type: work
                  - value: 555-555-4444
                    type: mobile
                  ims:
                  - value: someaimhandle
                    type: aim
                  photos:
                  - value: https://photos.example.com/profilephoto/72930000000Ccne/F
                    type: photo
                  - value: https://photos.example.com/profilephoto/72930000000Ccne/T
                    type: thumbnail
                  x509Certificates:
                  - value: DER-encoded X.509 certificate which MUST be base64 encoded
              users-create-enterprise-user:
                summary: Users - Create an enterprise user
                description: Create a new enterprise user with all the properties supported by the SCIM enterprise extension
                value:
                  schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                  - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
                  userName: johndoe@company.com
                  emails:
                  - type: work
                    value: johndoe@company.com
                    primary: true
                  name:
                    familyName: Doe
                    givenName: John
                  urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:
                    employeeNumber: '701984'
                    costCenter: '4130'
                    organization: Universal Studios
                    division: Theme Park
                    department: Tour Operations
                    manager:
                      value: 26118915-6090-4610-87e4-49d8ca9f808d
              users-create-with-custom-properties:
                summary: Users - Create a user with Custom Properties
                description: Create a new user including Custom Properties
                value:
                  schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                  - urn:ietf:params:scim:schemas:extension:custom:1.0:User
                  userName: johndoe@company.com
                  emails:
                  - type: work
                    value: johndoe@company.com
                    primary: true
                  name:
                    familyName: Doe
                    givenName: John
                  urn:ietf:params:scim:schemas:extension:custom:1.0:User:
                    customProperties: '{"propertyString": "StringValue", "propertyNumber": 7, "propertyBoolean": true}'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponseDto'
              example:
                id: 12345678-1234-1234-1234-123456789012
                userName: peter.jackson
                name:
                  familyName: jackson
                  givenName: peter
                emails:
                - value: peter.jackson@company.com
                  type: work
                - value: peter.jackson@personal.com
                  primary: true
                  type: home
                active: true
                x509Certificates: []
                ims: []
                phoneNumbers: []
                photos: []
                entitlements: []
                roles: []
                addresses: []
                groups: []
                meta:
                  resourceType: User
                  created: '2022-02-02T22:59:59.123456'
                  lastModified: '2022-02-02T22:59:59.123456'
                  version: 0
                  location: https://identity.fenergonebula.com/scim/Users/12345678-1234-1234-1234-123456789012
                schemas:
                - urn:ietf:params:scim:schemas:core:2.0:User
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Unauthorized
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
    servers:
    - url: /scim
  /Users/.search:
    post:
      tags:
      - Users
      summary: Returns users according to the filter, sort and pagination parameters
      description: 'Check out the following sections of the SCIM RFC for more information about how to use the search parameters:


        Definition of the search attributes: RFC 7644 Section 3.4.3


        The format of the ''attributes'' and the ''excludedAttributes'' properties: RFC 7644 Section 3.10


        Supported operators for filtering: RFC 7644 Section 3.4.2.2


        Groups with many members could make endpoint timeout, make sure members attribute is added to the list of excludedAttributes. For groups with many members, prefer /Groups/{id} endpoint.


        The supported values for the ''sortOrder'' attribute are:


        0: Ascending order


        1: Descending order


        Returns 200 even if there are no results for the specified filters.'
      operationId: SearchUsers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersSearchRequestDto'
            examples:
              users-search-users:
                summary: Users - Search users
                description: Get the 'userName', 'displayName' and 'employeeNumber' attributes of the first 5 users that have the 'displayName' attribute present, sorted by 'userName' in descending order
                value:
                  attributes:
                  - urn:ietf:params:scim:schemas:core:2.0:User:userName
                  - urn:ietf:params:scim:schemas:core:2.0:User:displayName
                  - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:employeeNumber
                  sortBy: urn:ietf:params:scim:schemas:core:2.0:User:userName
                  sortOrder: 1
                  startIndex: 1
                  count: 5
                  filter: displayName pr
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponseDto'
              example:
                schemas:
                - urn:ietf:params:scim:api:messages:2.0:ListResponse
                totalResults: 2
                itemsPerPage: 100
                startIndex: 1
                Resources:
                - id: 12345678-1234-1234-1234-123456789011
                  name:
                    givenName: John
                    familyName: Smith
                  userName: John.Smith
                  x509Certificates: []
                  phoneNumbers: []
                  entitlements: []
                  emails: []
                  ims: []
                  addresses: []
                  photos: []
                  roles: []
                  groups: []
                  meta:
                    resourceType: User
                    created: '2022-02-02T12:59:59.123456'
                    lastModified: '2022-02-02T12:59:59.123456'
                    version: 0
                    location: https://company.com/scim/Users/12345678-1234-1234-1234-123456789011
                  schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                  - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
                  - urn:ietf:params:scim:schemas:extension:custom:1.0:User
                - id: 12345678-1234-1234-1234-123456789012
                  emails:
                  - value: peter.jackson@company.com
                    type: work
                  - value: peter.jackson@personal.com
                    primary: true
                    type: home
                  userName: peter.jackson
                  name:
                    familyName: jackson
                    givenName: peter
                  x509Certificates: []
                  phoneNumbers: []
                  entitlements: []
                  ims: []
                  addresses: []
                  photos: []
                  roles: []
                  groups: []
                  meta:
                    resourceType: User
                    created: '2022-02-02T22:59:59.123456'
                    lastModified: '2022-02-02T22:59:59.123456'
                    version: 0
                    location: https://company.com/scim/Users/12345678-1234-1234-1234-123456789012
                  schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                  - urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
                  - urn:ietf:params:scim:schemas:extension:custom:1.0:User
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Unauthorized
    servers:
    - url: /scim
  /Users/{id}:
    get:
      tags:
      - Users
      summary: Gets a user by ID
      operationId: GetUserById
      parameters:
      - name: id
        in: path
        description: 'UUID: Universally Unique Identifier with 32 alpha-numeric characters formated as ''xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx''.'
        required: true
        schema:
          type: string
      - name: attributes
        in: query
        description: A multi-valued list of strings indicating the names of resource attributes to return in the response
        schema:
          type: array
          items:
            type: string
      - name: excludedAttributes
        in: query
        description: A multi-valued list of strings indicating the names of resource attributes to be removed from the default set of attributes to return
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponseDto'
              example:
                id: 12345678-1234-1234-1234-123456789012
                userName: peter.jackson
                name:
                  familyName: jackson
                  givenName: peter
                emails:
                - value: peter.jackson@company.com
                  type: work
                - value: peter.jackson@personal.com
                  primary: true
                  type: home
                active: true
                x509Certificates: []
                ims: []
                phoneNumbers: []
                photos: []
                entitlements: []
                roles: []
                addresses: []
                groups: []
                meta:
                  resourceType: User
                  created: '2022-02-02T22:59:59.123456'
                  lastModified: '2022-02-02T22:59:59.123456'
                  version: 0
                  location: https://identity.fenergonebula.com/scim/Users/12345678-1234-1234-1234-123456789012
                schemas:
                - urn:ietf:params:scim:schemas:core:2.0:User
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
    delete:
      tags:
      - Users
      summary: Deletes a user by ID
      description: Returns 204 if successfully deleted, 404 if not found.
      operationId: DeleteUser
      parameters:
      - name: id
        in: path
        description: 'UUID: Universally Unique Identifier with 32 alpha-numeric characters formated as ''xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx''.'
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
    put:
      tags:
      - Users
      summary: Updates all user details and returns the updated user details
      description: 'The mandatory fields to update an existing user are:


        A primary email address (emails.primary: true)


        A username (userName)


        A name (name.familyName and name.givenName)'
      operationId: UpdateUser
      parameters:
      - name: id
        in: path
        description: 'UUID: Universally Unique Identifier with 32 alpha-numeric characters formated as ''xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx''.'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersCreateUpdateRequestDto'
            examples:
              users-update-user:
                summary: Users - Update a user
                description: Update an existing user.
                value:
                  schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                  userName: johndoe@company.com
                  name:
                    givenName: New Given Name
                    familyName: New Family Name
                  emails:
                  - primary: true
                    type: work
                    value: johndoe@company.com
                  - type: home
                    value: johndoe@gmail.com
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponseDto'
              example:
                id: 12345678-1234-1234-1234-123456789012
                userName: peter.jackson
                name:
                  familyName: jackson
                  givenName: peter
                emails:
                - value: peter.jackson@company.com
                  type: work
                - value: peter.jackson@personal.com
                  primary: true
                  type: home
                active: true
                x509Certificates: []
                ims: []
                phoneNumbers: []
                photos: []
                entitlements: []
                roles: []
                addresses: []
                groups: []
                meta:
                  resourceType: User
                  created: '2022-02-02T22:59:59.123456'
                  lastModified: '2022-02-02T22:59:59.123456'
                  version: 0
                  location: https://identity.fenergonebula.com/scim/Users/12345678-1234-1234-1234-123456789012
                schemas:
                - urn:ietf:params:scim:schemas:core:2.0:User
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
    patch:
      tags:
      - Users
      summary: Updates some user details and returns the updated user details
      description: 'The supported values for the ''operations.op'' attribute are:


        add


        remove


        replace


        The endpoint may return the following successful responses if the request is accepted:


        A 200 response with the updated user details if a change has been made to the user


        A 204 response if nothing has been updated in the user'
      operationId: PatchUser
      parameters:
      - name: id
        in: path
        description: 'UUID: Universally Unique Identifier with 32 alpha-numeric characters formated as ''xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx''.'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersPatchRequestDto'
            examples:
              users-patch-user:
                summary: Users - Patch a user
                description: Patch an existing user.
                value:
                  operations:
                  - op: replace
                    path: name
                    value:
                      givenName: New Given Name
                      familyName: New Family Name
                  - op: add
                    path: title
                    value: New title
                  - op: remove
                    path: nickName
                  schemas:
                  - urn:ietf:params:scim:api:messages:2.0:PatchOp
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponseDto'
              example:
                id: 12345678-1234-1234-1234-123456789012
                userName: peter.jackson
                name:
                  familyName: jackson
                  givenName: peter
                emails:
                - value: peter.jackson@company.com
                  type: work
                - value: peter.jackson@personal.com
                  primary: true
                  type: home
                active: true
                x509Certificates: []
                ims: []
                phoneNumbers: []
                photos: []
                entitlements: []
                roles: []
                addresses: []
                groups: []
                meta:
                  resourceType: User
                  created: '2022-02-02T22:59:59.123456'
                  lastModified: '2022-02-02T22:59:59.123456'
                  version: 0
                  location: https://identity.fenergonebula.com/scim/Users/12345678-1234-1234-1234-123456789012
                schemas:
                - urn:ietf:params:scim:schemas:core:2.0:User
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
    servers:
    - url: /scim
  /api/users:
    post:
      tags:
      - Users
      summary: Adds a new user to the tenant, with the data specified in the request
      description: 'If the user doesn''t exist in Fen-X Identity, it is created and added to the tenant.


        If the user already exists, the user is just added to the tenant and the ID of the existing user is returned.


        If there are repeated keys in the custom properties (for example, {"prop1": "value1", "prop1": "value2"}, the

        API will remove the duplicates and store only the last value (following the example, {"prop1": "value2"}).


        Required permissions:

        Following permissions are required: SecurityCreateUser, UserAdministration'
      operationId: CreateUser
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Create user request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDtoServiceRequest'
      responses:
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '200':
