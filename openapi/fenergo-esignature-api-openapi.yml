openapi: 3.2.0
info:
  title: Fenergo E Signature API
  version: '1.0'
  description: 'Operations tagged ESignature across 2 of this provider''s published API definitions: fenergo-documentmanagementcommand-v1-0-openapi.json, fenergo-documentmanagementcommand-v2-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /documentmanagementcommand
security:
- Bearer: []
tags:
- name: ESignature
paths:
  /api/esignature:
    post:
      tags:
      - ESignature
      summary: Sends a request with documents to external provider for eSignature
      description: 'This method will send documents to external provider for eSignature


        Required permissions:

        Following permissions are required: DocumentManagementSendForSignature'
      operationId: SendDocumentsForSignature
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: ServiceRequest with the documents and mandatory signers to send
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/DocumentSignatureRequestDtoServiceRequest'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/DocumentSignatureRequestDtoServiceRequest'
          application/*+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/DocumentSignatureRequestDtoServiceRequest'
      responses:
        '202':
          description: DocumentSignatureResponseDto model created successfully
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentSignatureResponseDtoServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSignatureResponseDtoServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentSignatureResponseDtoServiceResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: An exception occurred while processing the command
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /documentmanagementcommand
  /api/esignature/cancel:
    post:
      tags:
      - ESignature
      summary: Voids existing eSignature and resets document requirement status
      description: 'Required permissions:

        Following permissions are required: DocumentManagementEdit'
      operationId: CancelESignature
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: ServiceRequest with the documents and mandatory signers to send
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/DocumentSignatureCancellationRequestDtoServiceRequest'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/DocumentSignatureCancellationRequestDtoServiceRequest'
          application/*+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/DocumentSignatureCancellationRequestDtoServiceRequest'
      responses:
        '202':
          description: Signature cancelled
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentSignatureCancellationResponseDtoServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSignatureCancellationResponseDtoServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentSignatureCancellationResponseDtoServiceResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Document Requirement not found
                  type: Error
                  errorCode: Error Code
        '500':
          description: An exception occurred while processing the command
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
