      tags:
      - Clients
      summary: Adds a new client to the tenant, with the data specified in the request
      description: 'Required permissions:

        Following permissions are required: SecurityCreateClient, ClientAdministration'
      operationId: CreateClient
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Create client request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientDtoServiceRequest'
      responses:
        '200':
          description: Success. Client added to the tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCreatedDtoServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '409':
          description: Conflict saving changes in expected version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: There are conflicts that cannot be resolved automatically, get latest and apply your changes
                  type: Error
                  errorCode: CONFLICT
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    get:
      tags:
      - Clients
      summary: Returns all clients from the tenant
      description: 'Required permissions:

        Following permissions are required: ClientAdministration'
      operationId: GetClients
      parameters:
      - name: Size
        in: query
        description: Non-negative value indicating desired number of results
        schema:
          maximum: 100000
          minimum: 0
          type: integer
          format: int32
          example: 100
        example: 100
      - name: From
        in: query
        description: Non-negative value indicating the 0-based index of the query result
        schema:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
          example: 0
        example: 0
      - name: X-TENANT-ID
        in: header
