components:
  schemas:
    CloneDynamicConfigurationResponseDto:
      type: object
      properties:
        id:
          type: string
          description: The UiD of the cloned dynamic configuration
          format: uuid
          example: d7f592a5-3feb-4607-bf39-ab9e81c45db0
      additionalProperties: false
      description: Response DTO representing cloned dynamic configuration data
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
          description: The message
          example: Success
        type:
          type:
          - string
          - 'null'
          description: 'Type of the message

            One of Info, Warning, Error, Forbidden'
          example: Info
        errorCode:
          type:
          - string
          - 'null'
          description: Error Code
          example: INTERNAL_SERVER_ERROR
      additionalProperties: false
      description: The message associated to the service response
    UpdateDynamicConfigurationResponseDto:
      type: object
      properties:
        version:
          type: integer
          description: Version of dynamic configuration after update
          format: int32
          example: 1
      additionalProperties: false
      description: Response DTO representing updated dynamic configuration
    CloneDynamicConfigurationResponseDtoServiceResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CloneDynamicConfigurationResponseDto'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
          description: List of Fenergo.Nebula.Platform.Core.Models.Response.ServiceResponseMessage associated to the service response
      additionalProperties: false
      description: Service response data
    UpdateDynamicConfigurationRequestDto:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Name of the dynamic configuration
          example: Canada rule
        description:
          type:
          - string
          - 'null'
          description: Description of the dynamic configuration
          example: Rule for Canada Private Banking
        geographicAccessLayerId:
          type:
          - string
          - 'null'
          description: 'UiD of the referenced Geographic access layer

            The access layer DataType must match the dynamic configuration DataType property'
          format: uuid
          example: 4e63e0ee-c5f8-4115-a1e6-a980dadcacd1
        businessRelatedAccessLayerId:
          type:
          - string
          - 'null'
          description: 'UiD of the referenced Business related access layer

            The access layer DataType must match the dynamic configuration DataType property'
          format: uuid
          example: ec7c05d2-fc98-442c-ba5b-51652b59738c
        dataType:
          $ref: '#/components/schemas/AccessLayerDataTypeDto'
        conditions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ConditionDto'
          description: Conditions under which the dynamic configuration is assigned
        version:
          type: integer
          description: "Current version of the dynamic configuration where the changes needs to be applied. This parameter is required \nto guarantee consistency and conflicts detection. If it is not provided, it will save new changes\non top of latest without conflicts checking"
          format: int32
          default: -1
          example: 1
      additionalProperties: false
      description: Request DTO representing dynamic configuration data to update
    StringServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
          description: The service response DTO
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
          description: List of Fenergo.Nebula.Platform.Core.Models.Response.ServiceResponseMessage associated to the service response
      additionalProperties: false
      description: Service response data
    CreateDynamicConfigurationRequestDtoServiceRequest:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CreateDynamicConfigurationRequestDto'
      additionalProperties: false
      description: Service request data
    CreateDynamicConfigurationRequestDto:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Name of the dynamic configuration
          example: Canada rule
        description:
          type:
