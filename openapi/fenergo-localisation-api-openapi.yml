openapi: 3.2.0
info:
  title: Fenergo Localisation API
  version: '1.0'
  description: 'Operations tagged Localisation across 2 of this provider''s published API definitions: fenergo-localisationcommand-v1-0-openapi.json, fenergo-localisationquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /localisationcommand
- url: /localisationquery
security:
- Bearer: []
tags:
- name: Localisation
paths:
