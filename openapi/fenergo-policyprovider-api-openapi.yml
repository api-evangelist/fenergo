components:
  schemas:
    SearchFieldsConfigDto:
      type: object
      properties:
        label:
          type:
          - string
          - 'null'
          description: Field label
          example: Full Address
        name:
          type:
          - string
          - 'null'
          description: Field Name which will be sent to adapter api
          example: FullAddress
      additionalProperties: false
      description: DTO which represents Search Field Configuration
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    AdditionalSearchFieldsConfigDto:
      type: object
      properties:
        dataKey:
          type:
          - string
          - 'null'
          description: Data Key of Data Group field
          example: Address_Line1
      additionalProperties: false
      description: DTO which represents Additional Search Fields Configuration
    UpdatePolicyProviderDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/UpdatePolicyProviderDto'
          description: Request DTO representing requirement metadata
      additionalProperties: false
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    UpdatePolicyProviderDto:
      allOf:
      - $ref: '#/components/schemas/PolicyProviderDto'
      - type: object
        properties:
          version:
            type: integer
            description: 'Current version of PolicyProvider aggregate where the changes needs to be applied. This parameter is required

              to guarantee consistency and conflicts detection. If it is not provided, it will save new changes

              on top of latest without conflicts checking'
            format: int32
            default: -1
            example: -1
        additionalProperties: false
      description: Request DTO representing requirement metadata
    ObjectServiceResponse:
      type: object
      properties:
        data: {}
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    CreatePolicyProviderResponseDtoServiceResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/CreatePolicyProviderResponseDto'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    PolicyProviderDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of PolicyProvider
          format: uuid
          example: 118313c6-91e6-4b05-a537-5a1ab906418f
        name:
          type:
          - string
          - 'null'
          description: Name of Policy Api Provider
          example: Policy_api_provider_name
        serviceUrl:
          type:
          - string
          - 'null'
          description: Url of Policy Api Provider service
          example: https://TestProviderService.com
        encryptionKey:
          type:
          - string
          - 'null'
          description: Encryption key of Policy Api Provider
          example: MTIzNDU2Nzg5MTEyMzQ1Njc4OTExMjM0NTY3ODkxMTI=
        authenticationKey:
          type:
          - string
          - 'null'
          description: Authentication key of Policy Api Provider
          example: MTIzNDU2Nzg5MTEyMzQ1Njc4OTExMjM0NTY3ODkxMTI=
        type:
          type:
          - string
          - 'null'
          description: 'Type of Policy Api Provider

            Available options are: Search, Validation, DataGroupSearch, DataGroupValidation'
          example: Search
        dataGroupId:
          type:
          - string
          - 'null'
          description: 'Id of selected data group. Required only for Types: DataGroupSearch and DataGroupValidation'
          example: 118313c6-91e6-4b05-a537-5a1ab906418f
        searchFieldsConfigs:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SearchFieldsConfigDto'
          description: 'List of search field configuration. Required only for Type: DataGroupSearch'
        resultFieldsConfig:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ResultFieldsConfigDto'
          description: 'List of result field configuration. Required only for Types: DataGroupSearch and DataGroupValidation'
        additionalSearchFieldsConfigs:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AdditionalSearchFieldsConfigDto'
          description: 'List of data group fields sent as additional search context. Optional for Type: DataGroupSearch'
        detailsUrl:
          type:
          - string
          - 'null'
          description: Url of getting details for selected option
          example: https://DetailsProviderService.com
        callIntegrationFlow:
          type: boolean
          description: The flag which indicates if Integration Flow should be called instead of ServiceUrl
          example: true
        flowKey:
          type:
          - string
          - 'null'
          description: Integration Flow Key
          example: validationFlow
        detailsFlowKey:
          type:
          - string
          - 'null'
          description: Integration Flow Key of getting details for selected option
          example: validationFlowDetails
      additionalProperties: false
      description: Response DTO representing PolicyProvider
    StringServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    CreatePolicyProviderResponseDto:
      type: object
      properties:
        id:
          type: string
          description: The UiD of created Policy Api Provider
          format: uuid
          example: 1bb44eba-d489-4138-8cfa-eee3d49250c9
      additionalProperties: false
    ResultFieldsConfigDto:
      type: object
      properties:
        dataKey:
          type:
          - string
          - 'null'
          description: Data Key of Data Group field
          example: Address_Line1
      additionalProperties: false
      description: DTO which represents Result Field Configuration
    PolicyProviderDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/PolicyProviderDto'
          description: Response DTO representing PolicyProvider
      additionalProperties: false
    SearchFieldsConfigDto_2:
      type: object
      properties:
        label:
          type:
          - string
          - 'null'
          description: Field label
          example: Full Address
        name:
          type:
          - string
          - 'null'
          description: Field name
          example: FullAddress
      additionalProperties: false
      description: DTO which represents Search Field Configuration
    AdditionalSearchFieldsConfigDto_2:
      type: object
      properties:
        dataKey:
          type:
          - string
          - 'null'
          description: Data Key of the Data Group field used as additional search context
          example: country
      additionalProperties: false
      description: DTO which represents Additional Search Field Configuration
    PolicyProviderDtoIEnumerableServiceResponse:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PolicyProviderDto_2'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    DataGroupProviderDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of PolicyApiProvider
          format: uuid
          example: 118313c6-91e6-4b05-a537-5a1ab906418f
        dataGroupId:
          type:
          - string
          - 'null'
          description: 'Id of selected data group. Required only for Type: DataGroupSearch'
          example: 118313c6-91e6-4b05-a537-5a1ab906418f
        searchFieldsConfigs:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SearchFieldsConfigDto_2'
          description: 'List of search field configuration. Required only for Type: DataGroupSearch'
        resultFieldsConfig:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ResultFieldsConfigDto'
          description: 'List of result field configuration. Required only for Type: DataGroupSearch'
        additionalSearchFieldsConfigs:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AdditionalSearchFieldsConfigDto_2'
          description: 'List of data group fields sent as additional search context. Optional for Type: DataGroupSearch'
      additionalProperties: false
    DataGroupProviderDtoIEnumerableServiceResponse:
      type: object
