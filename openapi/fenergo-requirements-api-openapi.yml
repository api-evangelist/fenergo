      additionalProperties: false
    ResetRequirementReviewResponse:
      type: object
      properties:
        comparisonId:
          type:
          - string
          - 'null'
        version:
          type:
          - integer
          - 'null'
          format: int32
        wasReset:
          type: boolean
      additionalProperties: false
    PushRequirementsApiRequest:
      type: object
      properties:
        entityType:
          type:
          - string
          - 'null'
        entityPolicyId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
      additionalProperties: false
    ComparisonAgentOutput:
      type: object
