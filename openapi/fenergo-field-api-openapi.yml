      parameters:
      - name: entityPolicyId
        in: path
        description: Policy ID
        required: true
        schema:
          type: string
          format: uuid
      - name: workspaceId
        in: query
        description: Optional workspace ID
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Create field request
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/PolicyFieldRequestDtoServiceRequest'
              description: Service request data
      responses:
        '202':
          description: Success. Field created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePolicyFieldResponseDtoServiceResponse'
        '400':
          description: One or more validation errors occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://datatracker.ietf.org/doc/html/rfc7231#section-6.5.1
                title: One or more validation errors occurred
                detail: Name is required
                status: 400
                errorCode: VALIDATION_ERROR
                validationErrors:
                - propertyName: Name
                  errorMessage: Name is required
                  attemptedValue: ''
                  validatorType: NotEmptyValidator
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc7231#section-6.5.4
                title: Resource not found
                detail: Not Found. Policy with a given ID does not exist
                status: 404
        '409':
          description: Conflict saving changes in expected version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc7231#section-6.5.8
