  /receptor/getPresignedUrl:
    post:
      tags:
      - Receptor
      summary: Create presigned url for S3 upload
      operationId: GetPresignedUrl
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      - name: X-PROVIDER-ID
        in: header
        description: The ID of the provider
        schema:
          type: string
        example: ProviderId
      - name: X-ENCRYPTION-IV
        in: header
        description: The encryption IV key, base64 encoded
        schema:
          type: string
        example: HgyUHIO81m0FcZfPS1lnUw==
      - name: X-AUTHENTICATION-MAC
        in: header
        description: The authentication MAC key, base64 encoded
        schema:
          type: string
        example: frr2J1pP5rUC6DLe8q1WNko7FmRqUOD8zYTQN4ABgiE=
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSignedUrlRequestDto'
            example:
              documentData:
              - extension: pdf
              - extension: .pdf
          text/json:
            schema:
              $ref: '#/components/schemas/CreateSignedUrlRequestDto'
            example:
              documentData:
              - extension: pdf
              - extension: .pdf
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateSignedUrlRequestDto'
            example:
              documentData:
              - extension: pdf
              - extension: .pdf
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CreateSignedUrlResponseDtoListServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSignedUrlResponseDtoListServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/CreateSignedUrlResponseDtoListServiceResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
    servers:
    - url: /externaldatareceptor
