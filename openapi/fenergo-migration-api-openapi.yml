  /api/migration/{id}/migration-records-file-signed-url:
    put:
      tags:
      - Migration
      summary: Generates a signed url for the migration records csv file
      description: 'If the file has not been generated yet, the generation gets triggered, which adds a new task to the migration (generate-migration-records-file) and update its status to completed when the file has been generated.


        Required permissions:

        Following permissions are required: DataMigrationAdministrator'
