      description: 'Creates a new acceptable document set with a first draft version.


        The new version initializes with the provided data, has the default status of draft

        and the author as the only required signee.


        Required permissions:

        Following permissions are required: DocumentConfigurationEdit'
      operationId: CreateAcceptableDocumentSet
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '202':
          description: Acceptable document set model created successfully
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CreateAcceptableDocumentSetResponseDtoServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAcceptableDocumentSetResponseDtoServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/CreateAcceptableDocumentSetResponseDtoServiceResponse'
        '400':
          description: Invalid request
