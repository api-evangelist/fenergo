      additionalProperties: false
    AggregatedFieldDto:
      type: object
      properties:
        fieldValue:
          type:
          - string
          - 'null'
        count:
          type: integer
          format: int32
      additionalProperties: false
    TaskDashboardDataRequestDto:
      type: object
      properties:
        page:
          minimum: 0
          type: integer
          description: Requested page number
          format: int32
        pageSize:
          minimum: 1
          type: integer
          description: Page size
          format: int32
        sortBy:
          type:
          - string
          - 'null'
          description: Field name used for sorting
        sortOrder:
          allOf:
          - $ref: '#/components/schemas/SortOrder'
          description: Sort order
        searchPhrase:
          type:
          - string
          - 'null'
          description: Full-text search phrase
        filter:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - array
            - 'null'
            items:
              type: string
          description: Filter criteria
        viewId:
          type:
          - string
          - 'null'
          description: View to use when formatting the data, if not provided, the default view will be used
      additionalProperties: false
      description: Represents the data model Task Dashboard request
  securitySchemes:
    Bearer:
      type: apiKey
      description: Please insert JWT with Bearer into field
      name: Authorization
      in: header
