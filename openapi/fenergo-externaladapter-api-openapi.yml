openapi: 3.2.0
info:
  title: Fenergo Nebula Policy Providers Query External Adapter API
  description: Policy Providers Query API is part of FenX eco-system to manage providers. All the operations require valid access token obtained from Identity service.
  version: '1.0'
servers:
- url: /policyprovidersquery
security:
- Bearer: []
tags:
- name: ExternalAdapter
paths:
  /api/external-adapter/suggestions:
    post:
      tags:
      - ExternalAdapter
      summary: Get suggestions by multiple field criteria from external provider
      description: 'Returns all search results.


        Required permissions:

        At least one of the following permissions is required: PolicyConfigurationAccess, PolicySearch'
      operationId: GetMultiFieldSuggestions
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/MultiFieldSuggestionRequestDtoServiceRequest'
      responses:
        '200':
          description: Success. List of suggestions is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAdapterMultiFieldSuggestionResponseDtoServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not Found. Provider with given id does not exist
                  type: Error
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
