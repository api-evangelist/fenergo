openapi: 3.2.0
info:
  title: Fenergo Engine API
  version: '1.0'
  description: 'Operations tagged Engine across 6 of this provider''s published API definitions: fenergo-journeylogicengine-v1-0-openapi.json, fenergo-journeylogicengine-v2-0-openapi.json, fenergo-policylogicengine-v1-0-openapi.json, fenergo-policylogicengine-v2-0-openapi.json, fenergo-policylogicengine-v3-0-openapi.json, fenergo-productpolicylogicengine-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /journeylogicengine
- url: /policylogicengine
- url: /productpolicylogicengine
security:
- Bearer: []
tags:
- name: Engine
paths:
  /api/engine/evaluate-journey-schema:
    post:
      tags:
      - Engine
      summary: Evaluates logic condition to retrieve matching Journey Schema(s)
      description: 'Executes logic engine to retrieve all journey schemas that requests match with defined conditions.


        Returns the collection of matching journey schemas filtered by journey type if filter provided.


        Required permissions:

        Following permissions are required: JourneyCreate'
      operationId: EvaluateJourneySchema
      parameters:
      - name: journeyTypeFilter
        in: query
        description: 'Optional filter(s) to retrieve matched schemas only for specified journey type.

          If multiple filters specified (i.e. Client Onboarding and Client Offboarding) both journey types will be returned (if matched).

          If empty (no filters), all matched journey types will be returned.'
        schema:
          type: array
          items:
            type: string
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Service request with key-value data required for evaluation
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/EvaluateJourneySchemaRequestDtoServiceRequest'
              description: Service request data
      responses:
        '200':
          description: Success. The list of evaluated journey schemas is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateJourneySchemaResponseDtoIEnumerableServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /journeylogicengine
