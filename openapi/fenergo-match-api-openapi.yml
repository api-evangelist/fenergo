openapi: 3.2.0
info:
  title: Fenergo Match API
  version: '1.0'
  description: 'Operations tagged Match across 4 of this provider''s published API definitions: fenergo-screeningquery-v1-0-openapi.json, fenergo-screeningquery-v2-0-openapi.json, fenergo-screeningquery-v3-0-openapi.json, fenergo-screeningquery-v4-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /screeningquery
security:
- Bearer: []
tags:
- name: Match
paths:
  /api/batch/{batchId}/entity/{entityId}/match:
    get:
      tags:
      - Match
      summary: Get all matches for an entity
      description: 'This method returns all matches for a given entity ID, batch ID and tenant ID.


        The method will return a list of match objects.


        Required permissions:

        Following permissions are required: ScreeningAccess'
      operationId: GetMatchesByEntityId
      parameters:
      - name: entityId
        in: path
        description: The ID of the entity the matches belong to
        required: true
        schema:
          type: string
          format: uuid
      - name: batchId
        in: path
        description: The batch ID the entity belongs to
        required: true
        schema:
          type: string
          format: uuid
      - name: returnMaterialMatches
        in: query
        description: Return only matches with status Match
        schema:
          type: boolean
          default: false
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: Success. The list of matches is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDtoIEnumerableServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not Found
                  type: Error
                  errorCode: Error Code
        '500':
          description: Internal server error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /screeningquery
  /api/batch/{batchId}/entity/{entityId}/match/{matchId}:
    get:
      tags:
      - Match
      summary: Get data of a match
      description: 'This method returns the match data for a given match ID, entity ID, batch ID and tenant ID.


