openapi: 3.2.0
info:
  title: Fenergo Acceptable Document API
  version: '1.0'
  description: 'Operations tagged AcceptableDocument across 3 of this provider''s published API definitions: fenergo-documentmanagementcommand-v1-0-openapi.json, fenergo-documentmanagementcommand-v2-0-openapi.json, fenergo-documentmanagementquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /documentmanagementcommand
- url: /documentmanagementquery
security:
- Bearer: []
tags:
- name: AcceptableDocument
paths:
