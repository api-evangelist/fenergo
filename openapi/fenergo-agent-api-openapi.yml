  /api/v2/agent/instructions:
    post:
      tags:
      - Agent
      summary: Create a new screening agent instruction
      description: 'Instructions start as disabled (IsEnabled = false) and must be explicitly enabled via an update.

        Up to 10 instructions per entity type may be enabled at any time.'
      operationId: CreateAgentInstruction
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: The instruction to create.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CreateAgentInstructionDtoServiceRequest'
      responses:
        '202':
          description: Accepted. Returns the new instruction ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
        '400':
          description: Bad request. The request has missing or invalid values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '403':
          description: Forbidden. The feature is disabled or the tenant lacks the required entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error.
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    put:
      tags:
      - Agent
      summary: Replace one or more existing screening agent instructions by ID
      description: 'Only the instructions supplied in the request body are replaced. Omitted instructions remain unchanged.

        All edited instructions are saved as drafts (`IsEnabled` is always set to `false`) regardless of the instruction''s

        current state. Use `PATCH /api/v2/agent/instructions/status` to re-activate an instruction after editing.'
      operationId: UpdateAgentInstructions
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: The list of instructions to replace.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/UpdateAgentInstructionDtoListServiceRequest'
      responses:
        '202':
          description: Accepted. All supplied instructions were replaced.
        '400':
          description: Bad request. The request has missing or invalid values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '403':
          description: Forbidden. The feature is disabled or the tenant lacks the required entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not found. One or more supplied instruction IDs do not exist.
                  type: Error
                  errorCode: Error Code
        '500':
          description: Internal server error.
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    delete:
      tags:
      - Agent
      summary: Delete one or more screening agent instructions by ID
      description: 'This operation is idempotent. Instructions that do not exist or are already deleted are silently skipped.

        Product-authored system defaults are soft-deleted and remain restorable via the reset endpoint.'
      operationId: DeleteAgentInstructions
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: The list of instruction IDs to delete.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/GuidListServiceRequest'
      responses:
        '202':
          description: Accepted. All supplied instructions were deleted, soft-deleted, or did not exist.
        '400':
          description: Bad request. One or more instructions are the last enabled instruction for their entity type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '403':
          description: Forbidden. The feature is disabled or the tenant lacks the required entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error.
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /screeningcommand
  /api/v2/agent/instructions/system-defaults:
    post:
      tags:
      - Agent
      summary: Seed or reset product-authored system default agent instructions for the tenant
      description: 'Seed mode (empty or no body): Seeds any of the 6 canonical defaults that are not already present.

        Instructions that already exist in any state are left untouched. Newly seeded instructions start with IsEnabled = true.

        Intended to be called once on initial UI load; subsequent calls with no body are no-ops.


        Reset mode (list of instruction IDs): Resets each supplied system default instruction to its canonical seeded

        content (Name, Identifiers, Description, EntityType, Resolution), sets IsEnabled to true (re-enables the instruction),

        and clears IsModified and IsDeleted. The entire request is rejected if any supplied ID belongs to a

        user-created instruction or does not exist.


        Both modes are idempotent.'
      operationId: SeedSystemDefaultAgentInstructions
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Optional list of system default instruction IDs to reset. Omit or send an empty list to trigger seed mode.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/GuidListServiceRequest'
      responses:
        '202':
          description: Accepted. Seeding or reset completed (or was already up to date).
        '400':
          description: Bad request. One or more supplied IDs belong to user-created instructions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '403':
          description: Forbidden. The feature is disabled or the tenant lacks the required entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not found. One or more supplied instruction IDs do not exist.
                  type: Error
                  errorCode: Error Code
        '500':
          description: Internal server error.
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /screeningcommand
  /api/v2/agent/instructions/status:
    patch:
      tags:
      - Agent
      summary: Activate or deactivate one or more screening agent instructions
      description: 'Accepts a mixed list of activate (isEnabled: true) and deactivate (isEnabled: false) operations.

        The 10-enabled-instruction cap per entity type is enforced for activation requests.

        Draft-on-edit does not apply — this is the only way to enable an instruction after creation or edit.'
      operationId: UpdateAgentInstructionStatus
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: The list of instruction status updates.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AgentInstructionStatusUpdateListServiceRequest'
      responses:
        '202':
          description: Accepted. All status changes were applied.
        '400':
          description: Bad request. Validation error (e.g. duplicate IDs, empty list, cap exceeded, last-enabled guard violated).
          content:
            application/json:
              schema:
