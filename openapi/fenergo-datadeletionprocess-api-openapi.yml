openapi: 3.2.0
info:
  title: Fenergo Data Deletion Process API
  version: '1.0'
  description: 'Operations tagged DataDeletionProcess across 2 of this provider''s published API definitions: fenergo-dataprotectioncommand-v1-0-openapi.json, fenergo-dataprotectionquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /dataprotectioncommand
