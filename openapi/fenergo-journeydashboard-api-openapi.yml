components:
  schemas:
    JourneyTaskDto:
      type: object
      properties:
        taskId:
          type: string
          format: uuid
        taskName:
          type:
          - string
          - 'null'
        assignedTeamId:
          type:
          - string
          - 'null'
        assignedTeam:
          type:
          - string
          - 'null'
        taskStatus:
          type:
          - string
          - 'null'
        journeyId:
          type:
          - string
          - 'null'
        daysOpen:
          type:
          - string
          - 'null'
        slaPeriod:
          type:
          - string
          - 'null'
        started:
          type:
          - string
          - 'null'
          format: date-time
        completed:
          type:
          - string
          - 'null'
          format: date-time
        paused:
          type:
          - string
          - 'null'
          format: date-time
        unpaused:
          type:
          - string
          - 'null'
          format: date-time
        taskType:
          type:
          - string
          - 'null'
        assignedTo:
          type:
          - string
          - 'null'
        assignedToId:
          type:
          - string
          - 'null'
        isFavourite:
          type: boolean
        serviceLevelAgreement:
          $ref: '#/components/schemas/ServiceLevelAgreementDto'
      additionalProperties: false
    JourneyMilestoneDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
        order:
          type: integer
          format: int32
        status:
          type:
          - string
          - 'null'
        stages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MilestoneStageDto'
      additionalProperties: false
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
          description: The message
          example: Success
        type:
          type:
          - string
          - 'null'
          description: 'Type of the message

            One of Info, Warning, Error, Forbidden'
          example: Info
        errorCode:
          type:
          - string
          - 'null'
          description: Error Code
          example: INTERNAL_SERVER_ERROR
      additionalProperties: false
      description: The message associated to the service response
    JourneySummaryDto:
