                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    put:
      tags:
      - ScopedEntity
      summary: Updates the entities that are in scope for Screening
      description: 'This method is used to update the entities that are in scope for Screening.


        Required permissions:

        Following permissions are required: ScreeningEdit, ScreeningAccess'
