      summary: Save document metadata and generate the URL to upload the file…
      description: 'This method will create the document model metadata and generate a signed URL to allow

        the user to upload the actual file directly in the AWS S3 bucket.


        The method will return an object with some basic information to show the result to the user in the UI like status,

        document requirement and document type. The response also contains the URL to upload the file in the S3 bucket.


        Required permissions:

        At least one of the following permissions is required: DocumentManagementCreate, DocumentManagementEdit'
      operationId: CreateDocumentModel
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
