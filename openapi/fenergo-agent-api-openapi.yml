          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    get:
      tags:
      - Agent
      summary: Get a single registered agent by its identifier
      description: 'Required permissions:

        Following permissions are required: AgentConfigurationAccess'
      operationId: GetAgentById
      parameters:
      - name: agentId
        in: path
        description: The unique identifier of the agent.
        required: true
        schema:
          type: string
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: The Fenergo.Nebula.DigitalAgents.Query.Application.Common.AgentRegistryDto for the requested agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRegistryDtoServiceResponse'
        '400':
          description: One or more validation errors occurred
