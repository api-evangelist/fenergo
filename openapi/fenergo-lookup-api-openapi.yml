openapi: 3.2.0
info:
  title: Fenergo Lookup API
  version: '1.0'
  description: 'Operations tagged Lookup across 4 of this provider''s published API definitions: fenergo-docgenquery-v1-0-openapi.json, fenergo-localisationquery-v1-0-openapi.json, fenergo-lookupcommand-v1-0-openapi.json, fenergo-lookupquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /docgenquery
- url: /localisationquery
- url: /lookupcommand
- url: /lookupquery
security:
- Bearer: []
tags:
- name: Lookup
