components:
  schemas:
    LinkVersionSignResponse:
      type: object
      properties:
        id:
          type: string
          description: The Id of the model the version belongs to
          format: uuid
        versionNumber:
          type: integer
          description: The number of the version that has been signed
          format: int32
        status:
          allOf:
          - $ref: '#/components/schemas/VersionStatus'
          description: The new version status
      additionalProperties: false
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    StringServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    UpdateLinkVersionDtoServiceRequest:
      required:
      - data
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/UpdateLinkVersionDto'
          description: Set of properties which define new version of Link Lookup
      additionalProperties: false
    LookupLinkVersionDtoServiceResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/LookupLinkVersionDto'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    LinkLookupPropertyDto:
      type: object
      properties:
        childValues:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    CreateLinkVersionDtoServiceRequest:
      required:
      - data
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/CreateLinkVersionDto'
      additionalProperties: false
    ObjectServiceResponse:
      type: object
      properties:
        data: {}
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    Approver:
      type: object
      properties:
        subject:
          type:
          - string
          - 'null'
        successor:
          allOf:
          - $ref: '#/components/schemas/Approver'
        action:
          allOf:
          - $ref: '#/components/schemas/ApproveAction'
        hasProcessedRequest:
          type: boolean
          readOnly: true
      additionalProperties: false
    Signee:
      type: object
      properties:
        subject:
          type:
          - string
          - 'null'
        successor:
          allOf:
          - $ref: '#/components/schemas/Approver'
        action:
          allOf:
          - $ref: '#/components/schemas/ApproveAction'
        hasProcessedRequest:
          type: boolean
          readOnly: true
      additionalProperties: false
    LookupLinkVersionDto:
      required:
      - name
      - properties
      type: object
      properties:
        lookupLinkId:
          type: string
          description: The Id of the Lookup Link the version belongs to
          format: uuid
        name:
          minLength: 1
          type: string
          description: Lookup Link Name
        parentLookupId:
          type: string
          description: Parent Lookup Id Linked
          format: uuid
        parentLookupVersion:
          type: integer
          description: Parent Lookup Version Linked
          format: int32
        childLookupId:
          type: string
          description: Child Lookup Id Linked
          format: uuid
        childLookupVersion:
          type: integer
          description: Child Lookup Version Linked
          format: int32
        versionNumber:
          type: integer
          description: The number of the Link version
          format: int32
        notes:
          maxLength: 400
          type:
          - string
          - 'null'
          description: Optional description of the references and details of changes made that will be visible to all users who can access the version. It's assumed that version notes won't contain 'personal identifiable information'. Please note that having many versions with very long notes could hurt API performance in the long term.
          example: Example Notes
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LinkLookupPropertyDto'
          description: Linked Values Properties
        effectiveFrom:
          type: string
          description: The date that the version takes effect when published
          format: date-time
        created:
          type: string
          description: The creation date of the version (Read-only)
          format: date-time
        status:
          allOf:
          - $ref: '#/components/schemas/VersionStatus'
          description: The status of the version
        signees:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Signee'
          description: The defined list of signees for the version
      additionalProperties: false
