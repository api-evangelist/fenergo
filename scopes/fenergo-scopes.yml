source: https://docs.fenergox.com/developer-hub/api-and-system-security/api-scopes-and-access-control
docs: https://docs.fenergox.com/developer-hub/api-and-system-security/api-scopes-and-access-control
note: 'Fenergo publishes a complete fenx.* scope registry on its documentation portal and a live OpenID Connect
  discovery document. The two are recorded separately: `scopes` below is the DOCUMENTED registry (105 scopes, verbatim
  names/display names/descriptions from the docs table); `discovery_only_scopes` are values the live /.well-known/openid-configuration
  advertises that the docs table does not list. The harvested OpenAPI contracts themselves declare almost no oauth2
  scopes — the CLM services use a bearer apiKey scheme — so the scope model lives in the docs and the IdP, not in
  the specs.'
authorization_server:
  issuer: https://identity.fenergox.com
  discovery: https://identity.fenergox.com/.well-known/openid-configuration
  http_status: 200
  token_endpoint: https://identity.fenergox.com/connect/token
  authorization_endpoint: https://identity.fenergox.com/connect/authorize
  jwks_uri: https://identity.fenergox.com/.well-known/openid-configuration/jwks
  introspection_endpoint: https://identity.fenergox.com/connect/introspect
  revocation_endpoint: https://identity.fenergox.com/connect/revocation
  grant_types_supported:
  - authorization_code
  - client_credentials
  - refresh_token
  - implicit
  - password
  - urn:ietf:params:oauth:grant-type:device_code
  - urn:openid:params:grant-type:ciba
  - external-token-exchange
  token_endpoint_auth_methods_supported:
  - client_secret_basic
  - client_secret_post
  - tls_client_auth
  - self_signed_tls_client_auth
  code_challenge_methods_supported:
  - plain
  - S256
  software: Duende IdentityServer (Enterprise Edition)
  note: Regional token endpoints follow https://identity.{region}.fenergox.com/connect/token; mTLS token endpoint
    is https://api-mtls.fenergox.com/sts/connect/mtls/token.
flows:
- flow: clientCredentials
  used_for: machine-to-machine API integrations (recommended)
  token_ttl_seconds: 900
  note: Scope parameter is space-separated; a 300-character limit applies to the scope string on a token request.
- flow: authorizationCode
  used_for: Fenergo UI users on non-SSO tenants (OIDC)
- flow: external-token-exchange
  used_for: headless client portals that use Fenergo APIs but not Fenergo authentication
granularity:
  model: per-domain read/write
  note: 'Fenergo has not moved to method-level granularity: .read scopes align to the Query APIs and .write scopes
    align to the Command APIs. Client-credential grants bypass UI access layers and field-level permissions — a
    credential holding fenx.entitydata.read reads ALL entity data.'
  source: https://docs.fenergox.com/api-docs/tenant-access
scope_count: 105
