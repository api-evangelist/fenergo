components:
  schemas:
    JourneyDashboardDataDtoServiceResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/JourneyDashboardDataDto'
          description: Represents the data returned by the Journey Dashboard
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    AggregationResponseDto:
      type: object
      properties:
        aggregatedResults:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AggregatedFieldDto'
          description: The aggregated results
        totalCount:
          type: integer
          description: The combined total of all aggregated counts
          format: int64
      additionalProperties: false
      description: Represents the response after aggregation.
    AggregationRequestDto:
      type: object
      properties:
        filter:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - array
            - 'null'
            items:
              type: string
          description: A dictionary of field names and their corresponding values to filter the data.
        aggregationField:
          type:
          - string
          - 'null'
          description: The field to aggregate data by (e.g., for generating pie charts or grouped summaries).
        maxAggregationResults:
          type: integer
          description: The number of aggregated results to return in the response
          format: int32
      additionalProperties: false
      description: Represents the request for aggregation.
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    JourneyDashboardDataRequestDto:
      type: object
      properties:
        page:
          minimum: 0
          type: integer
          description: Requested page number
          format: int32
        pageSize:
          minimum: 1
          type: integer
          description: Page size
          format: int32
        sortBy:
          type:
          - string
          - 'null'
          description: Field name used for sorting
        sortOrder:
          allOf:
          - $ref: '#/components/schemas/SortOrder'
          description: Sort order
        searchPhrase:
          type:
          - string
          - 'null'
          description: Full-text search phrase
        filter:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - array
            - 'null'
            items:
              type: string
          description: Filter criteria
        viewId:
          type:
          - string
          - 'null'
          description: View to use when formatting the data, if not provided, the default view will be used
      additionalProperties: false
      description: Represents the data model Journey Dashboard request
    JourneyDashboardDataDto:
      type: object
      properties:
        total:
          type: integer
          description: Total number of items matching the criteria
          format: int64
        items:
          type:
          - array
          - 'null'
          items: {}
          description: Items for the requested page
      additionalProperties: false
      description: Represents the data returned by the Journey Dashboard
    SortOrder:
      enum:
      - Ascending
      - Descending
      type: string
    TaskDashboardDataDto:
      type: object
      properties:
        total:
          type: integer
          description: Total number of items matching the criteria
          format: int64
        items:
          type:
          - array
          - 'null'
          items: {}
          description: Items for the requested page
      additionalProperties: false
      description: Represents the data returned by the Task Dashboard
    ObjectServiceResponse:
      type: object
      properties:
        data: {}
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    StringArrayServiceResponse:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            type: string
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    TaskDashboardDataDtoServiceResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/TaskDashboardDataDto'
          description: Represents the data returned by the Task Dashboard
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    AggregationResponseDtoServiceResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/AggregationResponseDto'
          description: Represents the response after aggregation.
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    StringServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
