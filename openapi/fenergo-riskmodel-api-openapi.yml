      parameters:
      - name: id
        in: path
        description: The Id of the existing model
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: ServiceRequest with the new version data
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/RiskModelDtoServiceRequest'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/RiskModelDtoServiceRequest'
          application/*+json:
