openapi: 3.2.0
info:
  title: Fenergo Nebula Configuration Release Hub Command Bundle API
  description: '**Configuration Release Hub Command API**:


    Configuration Release Hub Command API provides endpoints in order to manage configuration import process.


    **Configuration Release Hub Command API provides**:'
  version: '1.0'
servers:
- url: /configreleasehubcommand
security:
- Bearer: []
tags:
- name: Bundle
paths:
  /api/bundles:
    post:
      tags:
      - Bundle
      summary: Create a Configuration Bundle
      description: 'Create Bundle for a given tenant.


        Required permissions:

        Following permissions are required: ConfigurationReleaseHubCreateBundle'
      operationId: CreateBundle
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: 'The request containing basic information required to create a new configuration bundle,

          including its name, description, and the reference date for retrieving configuration items.'
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CreateBundleRequestDtoServiceRequest'
        required: true
      responses:
        '202':
          description: Success. Bundle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundleVersionDtoServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not Found
                  type: Error
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
