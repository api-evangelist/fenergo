    post:
      tags:
      - Agent
      summary: Seed or reset product-authored system default agent instructions for the tenant
      description: 'Seed mode (empty or no body): Seeds any of the 6 canonical defaults that are not already present.

        Instructions that already exist in any state are left untouched. Newly seeded instructions start with IsEnabled = true.

        Intended to be called once on initial UI load; subsequent calls with no body are no-ops.


        Reset mode (list of instruction IDs): Resets each supplied system default instruction to its canonical seeded

        content (Name, Identifiers, Description, EntityType, Resolution), sets IsEnabled to true (re-enables the instruction),

        and clears IsModified and IsDeleted. The entire request is rejected if any supplied ID belongs to a

        user-created instruction or does not exist.


        Both modes are idempotent.'
      operationId: SeedSystemDefaultAgentInstructions
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
