openapi: 3.2.0
info:
  title: Fenergo Temporary Document Model API
  version: '1.0'
  description: 'Operations tagged TemporaryDocumentModel across 2 of this provider''s published API definitions: fenergo-documentmanagementcommand-v1-0-openapi.json, fenergo-documentmanagementcommand-v2-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /documentmanagementcommand
security:
- Bearer: []
tags:
- name: TemporaryDocumentModel
paths:
  /api/temporarydocumentmanagement:
    post:
      tags:
      - TemporaryDocumentModel
      summary: Save temporary document metadata and generate the URL to upload the file for…
      description: 'This method will create temporary document model metadata and generate a signed URL to allow

        the user to upload temporary file directly in the AWS S3 bucket. When multiple document Requirements need to be fulfilled


        Important: The returned `SignedUrlToUpload` is a presigned S3 URL that includes the

        `x-amz-tagging` header in its signature. When uploading the file via HTTP PUT to this URL, the caller

        must include the following header exactly as shown:

        ```x-amz-tagging: TTL=enabled```


        Omitting this header or providing a different value will result in a `403 SignatureDoesNotMatch` error

        from S3, because the header is part of the presigned URL''s HMAC signature.


        Required permissions:

        At least one of the following permissions is required: DocumentManagementCreate, DocumentManagementEdit'
      operationId: CreateTemporaryDocumentMultipleRequirements
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: The upload multiple document requirements request
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CreateSignedUrlToUploadTemporaryFileMultipleRequirementsRequestServiceRequest'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CreateSignedUrlToUploadTemporaryFileMultipleRequirementsRequestServiceRequest'
          application/*+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CreateSignedUrlToUploadTemporaryFileMultipleRequirementsRequestServiceRequest'
      responses:
        '202':
          description: An instance of the Fenergo.Nebula.DocumentManagement.Command.Application.DTO.CreateSignedUrlToUploadFileMultipleRequirementsResponse class with some metadata that represent the files uploaded
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CreateSignedUrlToUploadFileMultipleRequirementsResponseServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSignedUrlToUploadFileMultipleRequirementsResponseServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/CreateSignedUrlToUploadFileMultipleRequirementsResponseServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not found. Document model or Document Requirement model with given id does not exist
                  type: Error
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /documentmanagementcommand
