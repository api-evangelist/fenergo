openapi: 3.2.0
info:
  title: Fenergo Clients API
  version: '1.0'
  description: 'Operations tagged Clients across 2 of this provider''s published API definitions: fenergo-identitymanagementcommand-v1-0-openapi.json, fenergo-identitymanagementquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /identitymanagementcommand
- url: /identitymanagementquery
security:
- Bearer: []
tags:
- name: Clients
paths:
  /api/clients:
