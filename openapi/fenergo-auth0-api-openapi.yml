  title: Fenergo Nebula Portal Tenant Query Auth0 API
  description: '**Portal Tenant Query API**:


    Portal Tenant Query API provides methods related to the Portal Users.'
  version: '4.0'
servers:
- url: /portaltenantquery
security:
- Bearer: []
tags:
- name: Auth0
paths:
  /api/auth0/passwordresetticket/{id}:
    get:
      tags:
      - Auth0
      summary: Gets password reset ticket
      description: 'Gets a password reset ticket for a given user id.


        Required permissions:

        Following permissions are required: PortalTenantUserAdmin'
      operationId: GetPasswordResetTicket
      parameters:
      - name: id
        in: path
        description: Portal user identifier for which the ticket is to be created.
        required: true
        schema:
          type: string
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: OK
          content:
