openapi: 3.2.0
info:
  title: Fenergo Schedule API
  version: '2.0'
  description: 'Operations tagged Schedule across 2 of this provider''s published API definitions: fenergo-reportscommand-v2-0-openapi.json, fenergo-reportsquery-v2-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /reportscommand
- url: /reportsquery
security:
- Bearer: []
tags:
- name: Schedule
paths:
  /api/v2/Schedule:
