openapi: 3.2.0
info:
  title: Fenergo Nebula ConfigBaseline Query Baseline API
  description: '**ConfigBaseline Query API**:


    ConfigBaseline Query API is part of FenX eco-system to query configuration baseline.'
  version: 1.9.3
servers:
- url: /configbaselinequery
security:
- Bearer: []
tags:
- name: Baseline
paths:
  /api/baseline/latest:
    get:
      tags:
      - Baseline
      summary: Get baselines
      description: 'Returns a list of the latest baselines for a given tenant


        Required permissions:

        Following permissions are required: ConfigBaselineAccess'
      operationId: GetLatest
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: Success. The list of Configuration Baselines is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineDtoIEnumerableServiceResponse'
              example:
                data:
                - id: 4a7135da-dae0-4b7b-89e4-b62cb889f534
                  configType: Lookup
                  effectiveFrom: '2026-09-09T21:47:52.7930452+00:00'
                  activeVersions:
                    585f5742-11e9-4e6a-b248-8923617a7e01: 1
                    87177e7e-2a5a-4af8-a018-aa0e50c11795: 4
                    22606499-9ee9-49ee-9832-31c1514e04ca: 20
                    8d345797-c425-47f5-acb4-b8cc6312a72a: 8
                    32a91d26-39a7-4982-8f7b-43e2071054a2: 75
                    c50587e5-7baa-4786-8ad0-4dbda72ca01d: 32
