components:
  schemas:
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    DataGroupValidationRequestDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/DataGroupValidationRequestDto'
          description: Request fields for external provider multi field search.
      additionalProperties: false
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    DataGroupValidationResponseDto:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/ResponseStatus'
          description: Status of response from provider.
          example: Ok
        validationResults:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DataGroupFieldValidationResultDto'
          description: Collection of validation responses for fields in the datagroup.
      additionalProperties: false
      description: Response fields for external provider multi field validation.
    ExternalAdapterMultiFieldSuggestionResponseDtoServiceResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/ExternalAdapterMultiFieldSuggestionResponseDto'
          description: Response fields for external provider multi field search search.
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    ExternalAdapterValidationRequestDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/ExternalAdapterValidationRequestDto'
          description: Response DTO representing external provider validation request
      additionalProperties: false
    MultiFieldSuggestionDetailsResponseDtoServiceResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/MultiFieldSuggestionDetailsResponseDto'
          description: Result details suggestion object
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    StringServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    ExtendedSearchResultItemDto:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: Id of a result from external provider.
          example: 118313c6-91e6-4b05-a537-5a1ab906418a
        displayValue:
          type:
          - string
          - 'null'
          description: Display value, nicely formatted
          example: Ireland, Dublin, 123 Street
        fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ExtendedSearchFieldDto'
          description: Full list of field name/value pairs for this result.
      additionalProperties: false
      description: A single result from extended search containing full field data.
    ExternalAdapterValidationResponseDto:
      type: object
      properties:
        isValid:
          type: boolean
          description: Is value valid.
        message:
          type:
          - string
          - 'null'
          description: Validation message.
          example: Field must contain digits.
        status:
          allOf:
          - $ref: '#/components/schemas/ResponseStatus'
          description: Status of response from provider.
          example: Ok
      additionalProperties: false
      description: Response DTO representing search suggestions data
    DataGroupFieldValidationResultDto:
      type: object
      properties:
        fieldName:
          type:
          - string
          - 'null'
          description: Name of the validated field
          example: postCode
        isValid:
          type: boolean
          description: Is value valid.
        message:
          type:
          - string
          - 'null'
          description: Validation message.
          example: Postcodes for country 'Ireland' must have 7 alphanumeric characters
      additionalProperties: false
    MultiFieldSuggestionDetailsResponseDto:
      type: object
      properties:
        status:
