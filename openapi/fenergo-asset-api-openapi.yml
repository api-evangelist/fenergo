            type: string
          description: The list of Asset Ids to fetch
        attributes:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The list of attributes to fetch the data for
      additionalProperties: false
    AssetDraftDto:
      type: object
      properties:
        id:
          type: string
          description: The Asset Draft Id
          format: uuid
          example: e1809731-77df-4e72-98e7-0d314b7a5151
        type:
          type:
          - string
          - 'null'
          description: The Asset Type
          example: Financial Asset
        properties:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/PropertyDto'
          description: 'List of custom properties for an Asset separate from the standard

            out of the box properties.'
        status:
          type:
          - string
          - 'null'
          description: The Asset Draft Status
          example: Active
        assetVersion:
          type: integer
          description: The Version of Asset that Draft was made for
          format: int32
          example: 1
        assetId:
          type: string
          description: The Asset Id
          format: uuid
          example: e1809731-77df-4e72-98e7-0d314b7a5151
        journeyId:
          type: string
          description: Id of the related Journey
          format: uuid
          example: e1809731-77df-4e72-98e7-0d314b7a5151
        version:
          type: integer
          description: Version of the Asset Draft
          format: int32
        createdDate:
          type:
          - string
          - 'null'
          description: DateTime of the created Asset
          format: date-time
      additionalProperties: false
      description: "An Asset object. \nContains all properties needed to fill the metadata of the Asset."
    AssetQueryDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/AssetQueryDto'
      additionalProperties: false
    AssetSnapshotDto:
      type: object
      properties:
        assets:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AssetDto_2'
          description: List of Assets
        assetDrafts:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AssetDraftDto'
          description: List of Asset drafts
      additionalProperties: false
      description: An Asset snapshot object
  securitySchemes:
    Bearer:
      type: apiKey
      description: Please insert JWT with Bearer into field
      name: Authorization
      in: header
