      type: object
      properties:
        id:
          type: string
          description: The Product Id
          format: uuid
          example: e1809731-77df-4e72-98e7-0d314b7a5151
        type:
          type:
          - string
          - 'null'
          description: The Product Type
          example: Loans
        family:
          type:
          - string
          - 'null'
          description: The Product Family
          example: Trading
        properties:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/PropertyDto'
          description: 'List of custom properties for a product separate from the standard

            out of the box properties.'
          example:
            firstName:
              type: Single
              value: Tom
            dateOfBirth:
              type: Single
              value: '2021-07-15'
