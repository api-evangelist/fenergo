          example: Requested
        providerId:
          type:
          - string
          - 'null'
          description: Provider Id
          example: Requested
      additionalProperties: false
      description: Contains information about the ongoing monitoring subscription
    OngoingMonitoringSubscriptionDtoICollectionServiceResponse:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/OngoingMonitoringSubscriptionDto'
          description: The service response DTO
        messages:
