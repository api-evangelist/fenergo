  summary: GraphQL responses — including auth-denied ones — from both EntityData subgraph hosts now include the
    Platform security headers Strict-Transport-Security and Content-Security-Policy.
- date: '2026-06-29'
  title: Entity-Data – Fixed
  kind: fixed
  domains:
  - Entity-Data
  url: https://docs.fenergox.com/release-notes/api-changelog/2026/06/29/entity-data/Entity-Data-Fixed
  summary: Entity draft/entity update validation now honours Policy ExternalDataGroupProvider rules for data group
    fields when creating external adapter validation requests. Request/response schema is unchanged; affected command
    endpoints now correctly reject invalid data group rows returned by the external provider.
- date: '2026-06-24'
  title: Entity-Data – Changed
  kind: changed
  domains:
  - Entity-Data
  url: https://docs.fenergox.com/release-notes/api-changelog/2026/06/24/entity-data/Entity-Data-Changed
  summary: Entity draft/entity update validation now sends data group fields to external adapter providers as grouped
    requests (one request per collection row per provider) instead of individual single-field requests. Request/response
    schema is unchanged; validation error messages returned to callers are unaffected.
