      description: 'Creates a new Collateral Draft for given Collateral Id


        The returned Id can be used in the Query API to retrieve this Collateral Draft.


        Required permissions:

        Following permissions are required: CollateralEdit'
      parameters:
      - name: collateralId
        in: path
        description: Collateral Id
        required: true
        schema:
          type: string
          format: uuid
      - name: journeyId
        in: path
        description: Journey Id
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '202':
          description: Success. Asset Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollateralDraftDtoServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal server error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden
