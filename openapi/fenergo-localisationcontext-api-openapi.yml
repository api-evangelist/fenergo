          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    LocalisationContextDto:
      required:
      - values
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Name of the context
          example: Default
        description:
          type:
          - string
          - 'null'
          description: Description of the context
          example: Translation for Chinese
        displayName:
          type:
          - string
          - 'null'
          description: json File display name
        values:
          type: object
          additionalProperties: {}
          description: Localisation file for current context
      additionalProperties: false
      description: Defines the context of the localisation file
    ObjectServiceResponse:
      type: object
      properties:
        data: {}
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
