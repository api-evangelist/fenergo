components:
  schemas:
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    RiskAssessmentsRequest:
      type: object
      properties:
        taskIds:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Collection of task ids which risk assessments are requested
      additionalProperties: false
      description: Risk assessments request
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    Threshold:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        minimumValue:
          type:
          - number
          - 'null'
          format: double
        maximumValue:
          type:
          - number
          - 'null'
          format: double
        nextReviewPeriod:
          type:
          - integer
          - 'null'
          format: int32
        thresholdColor:
          type:
          - string
          - 'null'
      additionalProperties: false
    AggregateRiskAssessment:
      type: object
      properties:
        entityRiskRating:
          type: number
          format: double
        entityRiskCategory:
          type:
          - string
          - 'null'
        entityRiskThresholdColor:
          type:
          - string
          - 'null'
        riskFactorGroupAssessments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RiskFactorGroupRiskAssessment'
        riskModelName:
          type:
          - string
          - 'null'
        riskModelVersion:
          type:
          - integer
          - 'null'
          format: int32
        riskConfigurationModelName:
          type:
          - string
          - 'null'
        riskConfigurationModelVersion:
          type:
          - integer
          - 'null'
          format: int32
        thresholdModelName:
          type:
          - string
          - 'null'
        thresholdModelVersion:
          type:
          - integer
          - 'null'
          format: int32
        aggregateId:
          type: string
          format: uuid
      additionalProperties: false
    RiskFactorSelectedAlgorithmDto:
      type: object
      properties:
        factorName:
          type:
          - string
          - 'null'
          description: Display name of the risk factor
          example: Product Type
        riskLevelCalculationAlgorithm:
          type:
          - string
          - 'null'
          description: The selected algorithm to use (min, max, avg, sum)
          example: avg
      additionalProperties: false
      description: "The algorithm to use, for risk level calculation, \nwhen a risk factor has multiple input values"
    RiskTaskResultModelIEnumerableServiceResponse:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RiskTaskResultModel'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    StringServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    RiskTaskResultModelItemDto:
      type: object
      properties:
        entityId:
          type: string
          description: Unique identifier of the entity being assessed
          format: uuid
          example: 80e92251-db0c-47e0-8e50-490d4bd1db6e
        riskRating:
          type:
          - number
          - 'null'
          description: Risk rating of assessed entity
          format: double
          example: 1
        riskCategory:
          type:
          - string
          - 'null'
          description: Risk category of assessed entity
          example: Low
        riskThresholdColor:
          type:
          - string
          - 'null'
          description: Optional hex color code for UI visualization purposes
          example: '#FF0000'
      additionalProperties: false
      description: Represents the overview of a risk task assessment
    AggregateRiskAssessmentErrorViewModelDto:
      type: object
      properties:
        aggregateId:
          type: string
          description: Unique identifier of the aggregate
          format: uuid
          example: 0e5a0bae-bd18-474f-8da7-0afcb3eb987b
        riskModelId:
          type:
          - string
          - 'null'
          description: Unique identifier of the risk model
          example: 118313c6-91e6-4b05-a537-5a1ab906418f
        riskModelVersionNumber:
          type:
          - integer
          - 'null'
          description: Version number of the risk model
          format: int32
          example: 1
        riskConfigurationModelId:
          type:
          - string
          - 'null'
          description: Unique identifier of the risk configuration model
          example: 16d3c5e6-2e50-4d55-bcc8-c46d37fa3fb9
        riskConfigurationModelVersionNumber:
          type:
          - integer
          - 'null'
          description: Version number of the risk configuration model
          format: int32
          example: 2
        thresholdModelId:
          type:
          - string
          - 'null'
          description: Unique identifier of the threshold model
          example: a8e4a96e-696a-4d04-89e9-faa74738fc43
        thresholdModelVersionNumber:
          type:
          - integer
          - 'null'
          description: Version number of the threshold model
          format: int32
          example: 1
        message:
          type:
          - string
          - 'null'
          description: Error message describing the assessment failure
          example: Unable to calculate risk due to missing data
      additionalProperties: false
      description: Represents an aggregate risk assessment error
    AggregateRiskAssessmentError:
      type: object
      properties:
        riskModelId:
          type:
          - string
          - 'null'
        riskModelVersionNumber:
          type:
          - integer
          - 'null'
          format: int32
        riskConfigurationModelId:
          type:
          - string
          - 'null'
        riskConfigurationModelVersionNumber:
          type:
          - integer
          - 'null'
          format: int32
        thresholdModelId:
          type:
          - string
          - 'null'
        thresholdModelVersionNumber:
          type:
          - integer
          - 'null'
          format: int32
        message:
          type:
          - string
          - 'null'
        aggregateId:
          type: string
          format: uuid
      additionalProperties: false
    OverrideScoresDto:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Display name of the factor to override
          example: Product Type
        score:
          type: number
          description: The score that the calculated risk level should be overwritten with
          format: double
          example: 5.04
      additionalProperties: false
      description: Risk factor override data
    RiskAssessmentError:
      type: object
      properties:
        riskModelId:
          type:
          - string
          - 'null'
        riskModelVersionNumber:
          type:
          - integer
          - 'null'
          format: int32
        riskConfigurationModelId:
          type:
          - string
          - 'null'
        riskConfigurationModelVersionNumber:
          type:
          - integer
          - 'null'
          format: int32
        thresholdModelId:
          type:
          - string
          - 'null'
        thresholdModelVersionNumber:
          type:
          - integer
          - 'null'
          format: int32
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    AggregateTaskResultLinkViewModelDto:
      type: object
      properties:
        riskTaskId:
          type: string
          description: Unique identifier of the risk task
          format: uuid
          example: 0e5a0bae-bd18-474f-8da7-0afcb3eb987b
        aggregateId:
          type: string
          description: Unique identifier of the aggregate
          format: uuid
          example: 80e92251-db0c-47e0-8e50-490d4bd1db6e
        referenceAggregateId:
          type: string
          description: Unique identifier of the reference aggregate
          format: uuid
          example: 90f82251-db0c-47e0-8e50-490d4bd1db7f
      additionalProperties: false
      description: Represents a link to a reused aggregate task result
    InputValueRiskAssessment:
      type: object
      properties:
        value:
          type:
          - string
          - 'null'
        riskCategory:
          type:
          - string
          - 'null'
        riskThresholdColor:
          type:
          - string
          - 'null'
        riskRating:
          type:
          - number
          - 'null'
          format: double
        weight:
          type:
          - number
          - 'null'
          format: double
        weightedRiskRating:
          type:
          - number
          - 'null'
          format: double
      additionalProperties: false
    ExcludedAggregateAssessment:
      type: object
      properties:
        aggregateId:
          type: string
          format: uuid
        lifecycleStatus:
          type:
          - string
          - 'null'
      additionalProperties: false
    ObjectServiceResponse:
      type: object
      properties:
        data: {}
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    GetRiskRelatedPartiesResultRequestDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/GetRiskRelatedPartiesResultRequestDto'
      additionalProperties: false
    RiskTaskResultModelListDto:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RiskTaskResultModelItemDto'
          description: Collection of risk assessment overviews for related parties
      additionalProperties: false
      description: Container for multiple risk assessment overviews for related parties
    RiskAssessmentDto:
      required:
