  /api/v1/document:
    post:
      tags:
      - Document
      summary: Upload Policy Document
      description: Upload policy docuemnt
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
