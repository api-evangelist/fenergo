        The Status of the version will change according to the action sent (Approve/Reject).


        Required permissions:

        Following permissions are required: RiskConfigurationApprove'
      operationId: SignRiskModelVersion
      parameters:
      - name: id
        in: path
        description: The Id of the existing model
        required: true
        schema:
          type: string
          format: uuid
      - name: versionNumber
        in: path
        description: The version number of the version to sign
        required: true
        schema:
          type: integer
          format: int32
      - name: X-TENANT-ID
        in: header
