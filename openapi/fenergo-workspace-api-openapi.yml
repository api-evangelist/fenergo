components:
  schemas:
    BulkSoftDeleteWorkspaceRequestDto:
      required:
      - ids
      type: object
      properties:
        ids:
          minItems: 1
          uniqueItems: true
          type: array
          items:
            type: string
            format: uuid
          description: List of workspace IDs to delete. A maximum of 20 IDs can be provided per request.
      additionalProperties: false
      description: Delete workspaces in bulk request
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
          description: The message
          example: Success
        type:
          type:
          - string
          - 'null'
          description: 'Type of the message

            One of Info, Warning, Error, Forbidden'
          example: Info
        errorCode:
          type:
          - string
