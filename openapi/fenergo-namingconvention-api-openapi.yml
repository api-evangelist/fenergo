        Required permissions:

        Following permissions are required: DocGenConfigurationApprove'
      operationId: SignNamingConventionVersion
      parameters:
      - name: setId
        in: path
        description: The Id of the existing set
        required: true
        schema:
          type: string
          format: uuid
      - name: versionNumber
        in: path
        description: The version number of the version to sign
        required: true
        schema:
          type: integer
          format: int32
      - name: X-TENANT-ID
        in: header
