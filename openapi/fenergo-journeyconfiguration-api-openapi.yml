        isCancellationReasonMandatory:
          type: boolean
          description: Flag indicating if journey cancellation reason should be mandatory
        isReassignCommentMandatory:
          type: boolean
          description: Flag indicating if reassign-task comment should be mandatory
        isReopenReasonEnabled:
          type:
          - boolean
          - 'null'
          description: 'Flag indicating if the reopen-reason dropdown is enabled.

            Nullable to avoid silent resets from older callers that don''t send this field.'
        isReopenReasonMandatory:
          type:
          - boolean
          - 'null'
          description: 'Flag indicating if the reopen-reason dropdown selection is mandatory.

            Nullable to avoid silent resets from older callers that don''t send this field.'
        validateExistingReferenceDataValues:
          type:
          - boolean
          - 'null'
          description: 'Flag indicating if existing reference data values should be validated on load.

            Nullable to avoid silent resets from older callers that don''t send this field.'
