        dynamicRules:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DateLimitRuleDtoConditionalValueDto2'
      additionalProperties: false
    SlimProductRequirementDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        jurisdiction:
          type:
          - string
          - 'null'
        category:
          type:
          - string
          - 'null'
        entityType:
          type:
          - string
          - 'null'
        targetEntity:
          type:
          - string
          - 'null'
        conditions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ConditionDto'
        references:
          type:
          - array
          - 'null'
          items: {}
        order:
          type:
          - number
          - 'null'
          format: double
        isReadOnly:
          type:
          - boolean
          - 'null'
        isSensitiveData:
          type:
          - boolean
          - 'null'
        isSecondaryIdentifier:
          type:
          - boolean
          - 'null'
        clearValueIfTriggerConditionNotMet:
          type:
          - boolean
          - 'null'
        isMandatory:
          type:
          - boolean
          - 'null'
        defaultValue:
          type:
          - string
          - 'null'
        defaultDateType:
          type:
          - string
          - 'null'
        conditionalValues:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ConditionalValueDto'
        dataField:
          allOf:
          - $ref: '#/components/schemas/SlimDataFieldDto'
        validationRulesV2:
          allOf:
          - $ref: '#/components/schemas/SlimDataValidationRulesDto'
          description: 'Slimmed validation rules DTO for the evaluation-definitions endpoint.

            Only includes rules that the client-side evaluation engine reads.

            Rules that are inactive (isActive=false, no dynamicRules) are omitted via

            the mapper — properties are null and serialized away by JsonIgnore.

            ExternalProvider and ExternalDataGroupProvider are stripped entirely

            (not consumed by the frontend eval engine).'
      additionalProperties: false
      description: 'Slimmed requirement DTO for the evaluation-definitions endpoint.

        Contains only the fields the client-side evaluation engine needs.

        Reduces payload from ~265 KB to ~51 KB (81% reduction) for a typical product.'
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    FormulaVariableDto:
      type: object
      properties:
        dataSource:
          type:
          - string
          - 'null'
        propertyName:
          type:
          - string
          - 'null'
        filterConditions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FilterConditionDto'
      additionalProperties: false
    EvaluatedDataFieldDto:
      type: object
      properties:
        propertyName:
          type:
          - string
          - 'null'
          description: Property name
          example: firstName
        propertyType:
          type:
          - string
          - 'null'
          description: Property type
          example: text
        propertyTypeId:
          type:
          - string
          - 'null'
          description: Property type id
          format: uuid
          example: ab92ecbc-bd77-494b-acad-3d2fb0b8136c
        linkChildFieldPropertyName:
          type:
          - string
          - 'null'
          description: Linked child field property name
          example: productCategory
        linkedParentFieldPropertyName:
          type:
          - string
          - 'null'
          description: Linked parent field property name
          example: productCategory
        name:
          type:
          - string
          - 'null'
          description: Requirement name
          example: First Name
        description:
          type:
          - string
          - 'null'
          description: Requirement description
          example: This is the client first name
        hasEvaluatedDefaultValue:
          type: boolean
          description: Does this field has evaluated default value?
        defaultValue:
          type:
          - string
          - 'null'
          description: Default Value
          example: Not Available
        isReadOnly:
          type: boolean
          description: Is requirement readonly
          example: false
        category:
          type:
          - string
          - 'null'
          description: Requirement business category
          example: Basic Details
        validationData:
          allOf:
          - $ref: '#/components/schemas/ValidationDataDto'
          description: Validation Data - set of validation rules specific to requirement/data group field
        isRequired:
          type: boolean
          description: Is the field value mandatory
        order:
          type:
          - number
          - 'null'
          description: Order
          format: double
          example: 1
        hasEvaluatedConditionalValue:
          type: boolean
          description: Does this field has evaluated conditional value?
        evaluatedConditionalValue:
          type:
          - string
          - 'null'
          description: Evaluated conditional value
        isMasked:
          type: boolean
          description: Flag indicating if field is masked due to missing Sensitive Data Access layers
          example: false
        isConditional:
          type: boolean
          description: Is requirement conditional
          example: false
        isSensitiveData:
          type: boolean
          description: Requirement sensitive data flag
          example: true
        fieldAccessLayers:
          allOf:
          - $ref: '#/components/schemas/AccessLayerDto'
          description: Field Access Layers
        hasCalculatedValue:
          type: boolean
          description: Does this field has calculated value?
        calculatedFieldResult:
          allOf:
          - $ref: '#/components/schemas/CalculatedResultDto'
          description: Calcualtion value
        uiDecoration:
          type:
          - string
          - 'null'
          description: Determines how the requirement should be rendered
        timeZoneId:
          type:
          - string
          - 'null'
          description: Time zone id used for date values validation in order to determine exact Today time range
          example: Europe/Warsaw
        customActionProperties:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
          description: 'Properties which can be passed to a custom action function in the UI, provided as

            basic string key-value pairs to allow action functions to be created generically.'
        conditionalLimitError:
          type:
          - string
          - 'null'
          description: Conditional limit error
        externalSearchApiProviderId:
          type:
          - string
          - 'null'
          description: Provider Id for Search Field that will be used to fetch options for the field
          format: uuid
          example: ab92ecbc-bd77-494b-acad-3d2fb0b8136c
        shouldClearValue:
          type: boolean
          description: Indicates the field value should be cleared because its trigger condition is not met
          example: false
      additionalProperties: false
    ValueLimitRuleDtoConditionalValueDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
