components:
  schemas:
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    CollateralDtoServiceResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/CollateralDto2'
          description: "Class to represent the collateral uploaded. \nContains all properties needed to fill the metadata of the collateral being uploaded."
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    PropertyType:
      enum:
      - Single
      - Custom
      - Collection
      type: string
    CollateralDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/CollateralDto2'
          description: "Class to represent the collateral uploaded. \nContains all properties needed to fill the metadata of the collateral being uploaded."
      additionalProperties: false
    PropertyDto:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/PropertyType'
          readOnly: true
        discriminator:
          allOf:
          - $ref: '#/components/schemas/PropertyType'
          readOnly: true
        isValid:
          type:
          - boolean
          - 'null'
      additionalProperties: false
    ObjectServiceResponse:
      type: object
      properties:
        data: {}
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    CollateralDto2:
      type: object
      properties:
        id:
          type: string
          description: The Collateral Id
          format: uuid
          example: e1809731-77df-4e72-98e7-0d314b7a5151
        type:
          type:
          - string
          - 'null'
          description: The Collateral Type
          example: Financial Asset
        alternateId:
          type:
          - string
          - 'null'
          description: Collateral Id from data migration
        properties:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/PropertyDto'
          description: 'List of custom properties for a collateral separate from the standard

            out of the box properties.'
          example:
            firstName:
              type: Single
              value: Tom
            dateOfBirth:
              type: Single
              value: '2021-07-15'
            address:
              type: Collection
              dataGroupId: 674ccef1-cfdc-46af-97f8-340b24ab7f43
              collections:
                54a25d24-1a4b-45c6-a5b4-980e5d3a1df5:
                  properties:
                    country: Spain
                    city: Madrid
                    street: C. de Sevilla
                93468632-1a9e-4ad0-b2e1-c5ec0f65d7b2:
                  properties:
                    country: Spain
                    city: Barcelona
                    street: Carrer de Girona
        entityId:
          type: string
          description: The Entity Id
          format: uuid
          example: e1809731-77df-4e72-98e7-0d314b7a5151
        journeyId:
          type: string
          description: The Journey Id
          format: uuid
          example: e1809731-77df-4e72-98e7-0d314b7a5151
        created:
          type:
          - string
          - 'null'
          description: The creation date of the Collateral
          format: date-time
      additionalProperties: false
      description: "Class to represent the collateral uploaded. \nContains all properties needed to fill the metadata of the collateral being uploaded."
    StringServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    PropertiesDto:
      type: object
      properties:
        singleProperties:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/SinglePropertyDto2'
        collectionProperties:
