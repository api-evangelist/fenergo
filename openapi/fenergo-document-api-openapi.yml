    - url: /docgenquery
  /api/document:
    post:
      tags:
      - Document
      summary: Create new document retrieval request
      description: 'This endpoint is obsolete and will be terminated on 2027-01-12. Use POST /externaldatabff/api/processes/{contextType}/{contextId}/gets/{getId}/document instead.


        This method will create a document retrieval request that will trigger asynchronous requests to different external data providers.


        The method will return the document request ID created in the system.


        Required permissions:

        Following permissions are required: ExternalDataAccess


        Required permissions:

        Following permissions are required: ExternalDataAccess'
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: The document retrieval request
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/DocumentRequestDtoServiceRequest'
              description: Service request data
      responses:
