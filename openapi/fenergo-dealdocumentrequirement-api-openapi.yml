openapi: 3.2.0
info:
  title: Fenergo Nebula Document Management Query Deal Document…
  description: Query API to get the documents information to show in the UI.
  version: '1.0'
servers:
- url: /documentmanagementquery
security:
- Bearer: []
tags:
- name: DealDocumentRequirement
paths:
  /api/deal/documentrequirement/{journeyId}:
    get:
      tags:
      - DealDocumentRequirement
      summary: Gets all requirements for a Journey Id
      description: 'Required permissions:

        Following permissions are required: DocumentManagementAccess'
      operationId: GetAllDealRequirementModelsByJourneyId
      parameters:
      - name: journeyId
        in: path
        description: The journey identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: "A list of the Fenergo.Nebula.DocumentManagement.Query.Application.Dto.DocumentRequirementModelDto class representing the document requirements if found; \n            otherwise, `null`."
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentRequirementModelDtoIEnumerableServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRequirementModelDtoIEnumerableServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentRequirementModelDtoIEnumerableServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
