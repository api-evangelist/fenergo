components:
  schemas:
    AgentType:
      enum:
      - IDP_Classification
      - IDP_DocSplit
      - IDP_DataExtraction
      - Task_Autocompletion
      - IDP_RelatedPartyExtraction
      - ExternalData_DataSourcing
      - SignificanceEngine_Evaluation
      - Screening_HitResolution
      - Document
      - CapacityManagement
      - ReportingAgent
      - FenAI
      - Policy
      type: string
      description: Represents the type of digital agent.
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    OutcomeDto:
      type: object
      properties:
        agentExecutionId:
          type:
          - string
          - 'null'
          description: Gets or sets the unique identifier of the agent execution.
        agentCategory:
          type:
          - string
          - 'null'
          description: Gets or sets the category of the agent that was executed.
        agentType:
          type:
          - string
          - 'null'
          description: Gets or sets the type of the agent that was executed.
        outcome:
          type:
          - string
          - 'null'
          description: Gets or sets the execution outcome result.
        entryId:
          type:
          - string
          - 'null'
          description: Gets or sets the identifier of the related entry.
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          description: Gets or sets the metadata associated with the outcome.
        timestamp:
          type: string
          description: Gets or sets the time stamp of the outcome.
          format: date-time
      additionalProperties: false
      description: Data Transfer Object (DTO) representing the outcome of a digital agent execution.
    AgentCategory:
      enum:
      - KYC
      - Compliance
      - Reporting
      - FenAI
      - Decisioning
      - Extraction
      - Agentic
      type: string
      description: Represents the category of an agent in the digital agents system.
    OutcomeDtoIEnumerableServiceResponse:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/OutcomeDto'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: Please insert JWT with Bearer into field
      name: Authorization
      in: header
