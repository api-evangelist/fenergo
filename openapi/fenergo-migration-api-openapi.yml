openapi: 3.2.0
info:
  title: Fenergo Migration API
  version: '1.0'
  description: 'Operations tagged Migration across 3 of this provider''s published API definitions: fenergo-datamigrationcommand-v1-0-openapi.json, fenergo-datamigrationcommand-v2-0-openapi.json, fenergo-datamigrationquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /datamigrationcommand
- url: /datamigrationquery
security:
- Bearer: []
tags:
- name: Migration
paths:
  /api/migration:
    post:
      tags:
      - Migration
      summary: Creates a migration instance that holds and control the data flow
      description: 'Migration instances are the starting point for any migration. After this instance is created, data can be attached to it and pushed to the supported domains.


        Returns the migration instance Id to be used by the rest of the commands.


        Required permissions:

        Following permissions are required: DataMigrationAdministrator'
      operationId: CreateMigration
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Create migration request
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CreateMigrationRequestServiceRequest'
      responses:
        '202':
          description: Id of the migration created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal server error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /datamigrationcommand
  /api/migration/{id}/start:
    put:
      tags:
      - Migration
      summary: Starts a migration
      description: 'Starts a migration. It requires that the files have been already added to the migration using /add-file and that the migration instance has finished running preparation tasks.


        Returns the migration instance Id to be used by the rest of the commands.


        Required permissions:

        Following permissions are required: DataMigrationAdministrator'
      operationId: StartMigration
      parameters:
      - name: id
        in: path
        description: The Id of the migration to start
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '202':
          description: The Id of the migration started
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal server error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /datamigrationcommand
  /api/migration/{id}/startAssociation:
    put:
      tags:
      - Migration
      summary: Starts only an association migration
      description: 'Starts only an association migration.


        It requires that the source files have been already attached to the migration using /add-file, the migration instance has finished running preparation tasks and any entity related with the association is part of the current migration or previous one.


        Returns the migration instance Id to be used by the rest of the commands.


        Required permissions:

        Following permissions are required: DataMigrationAdministrator'
      operationId: StartAssociationMigration
      parameters:
      - name: id
        in: path
        description: The migration Id to start
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '202':
          description: The Id of the migration started
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal server error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /datamigrationcommand
  /api/migration/{id}/add-file:
    put:
      tags:
      - Migration
      summary: Adds a file as data source to the migration
      description: 'The file should be in csv format.


        It should contain a header describing the fields with the same name as in the requirements for the target type plus "alternateId" and "parentAlternateId" (this last one only for datagroups).


        Each value/field should be surrounded by quotes and separated by commas (e.g., "value1", "value2").


        If multiple values are to be represented in a single field, like in the lookups scenario, separate them with a pipe (e.g., "value1|value2").


        Returns the migration instance Id to be used by the rest of the commands.


        Required permissions:

        Following permissions are required: DataMigrationAdministrator'
      operationId: AddFileToDataMigration
      parameters:
      - name: id
        in: path
        description: The migration id to start
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - Data.File
              - Data.TableName
              type: object
              properties:
                Data.File:
                  type: string
                  description: File
                  format: binary
                Data.TableName:
                  type: string
                  description: Table name what the file has information
            encoding:
              Data.File:
                style: form
              Data.TableName:
                style: form
      responses:
        '202':
          description: The Id of the migration the file was added to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal server error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /datamigrationcommand
  /api/migration/{id}/{tableName}:
    delete:
      tags:
      - Migration
      summary: Deletes a file previously added to a migration instance
      description: 'Allows to delete files that have not been yet processed by the migration.


        Returns the migration instance Id to be used by the rest of the commands.


        Required permissions:

        Following permissions are required: DataMigrationAdministrator'
      operationId: DeleteMigrationFile
      parameters:
      - name: id
        in: path
        description: The id of the migration
        required: true
        schema:
          type: string
          format: uuid
      - name: tableName
        in: path
        description: Table name related with the file
        required: true
        schema:
          type: string
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '202':
