openapi: 3.2.0
info:
  title: Fenergo Template API
  version: '1.0'
  description: 'Operations tagged Template across 2 of this provider''s published API definitions: fenergo-docgencommand-v1-0-openapi.json, fenergo-docgenquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /docgencommand
- url: /docgenquery
security:
- Bearer: []
tags:
