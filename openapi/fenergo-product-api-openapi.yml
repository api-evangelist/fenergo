openapi: 3.2.0
info:
  title: Fenergo Product API
  version: '1.0'
  description: 'Operations tagged Product across 2 of this provider''s published API definitions: fenergo-productcommand-v1-0-openapi.json, fenergo-productquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /productcommand
- url: /productquery
security:
- Bearer: []
tags:
- name: Product
paths:
  /api/managedProduct:
    post:
      tags:
      - Product
      summary: Creates a managed product
      description: 'This method creates a managed product and stores the data related to the product.


        The method returns an object containing some basic information as the result to the user,

        and type. The returned Id can be used in the query api to get the product.


        Required permissions:

        Following permissions are required: ProductEdit'
      operationId: CreateManagedProduct
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: The create managed product request
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ManagedProductDtoServiceRequest'
      responses:
        '202':
          description: An instance of the Fenergo.Nebula.Product.Command.Application.Features.CreateManagedProduct.ManagedProductDto class with some metadata that represent the managed product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedProductDtoServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal server error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /productcommand
  /api/product:
    post:
      tags:
      - Product
      summary: Creates a product
      description: 'This method creates a product and stores the data related to the product.


        The method returns an object containing some basic information as the result to the user,

        and type. The returned Id can be used in the query api to get the product.


        Required permissions:

        Following permissions are required: ProductEdit'
