  /api/localisationcontext/{localisationId}/version/{versionNumber}/context/{contextName}/filelite:
    put:
      tags:
      - LocalisationContext
      summary: Update Localisation Context file by uploading a json file less than 5MB
      description: 'Update the Context file and its values.


        By updating the localisation context, you will replace the existing file


        This can only affect the current context


        Required permissions:

        Following permissions are required: LocalisationEdit'
      operationId: UpdateLocalisationContextFileLite
      parameters:
      - name: localisationId
        in: path
        description: Localisation Id
        required: true
        schema:
          type: string
          format: uuid
      - name: versionNumber
        in: path
        description: Version Number
        required: true
        schema:
          type: integer
          format: int32
      - name: contextName
        in: path
        description: Context Name
        required: true
        schema:
          type: string
      - name: displayName
        in: query
        description: Display Name
        schema:
          type: string
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - Data.File
              type: object
              properties:
                Data.File:
                  type: string
                  description: 'File to be saved in the S3 storage

                    File must be in json type and max size is 6 MB'
                  format: binary
            encoding:
              Data.File:
                style: form
      responses:
        '202':
          description: Accepted for processing
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UpdateLocalisationContextDtoServiceResponse'
            application/json:
