openapi: 3.2.0
info:
  title: Fenergo Providers Configuration API
  version: '1.0'
  description: 'Operations tagged Providers Configuration across 2 of this provider''s published API definitions: fenergo-externaldatacommand-v1-0-openapi.json, fenergo-externaldataquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /externaldatacommand
- url: /externaldataquery
security:
- Bearer: []
tags:
- name: Providers Configuration
paths:
  /api/providersconfiguration/provider/{providerId}/status:
    put:
      tags:
      - Providers Configuration
      summary: Save Provider status
      description: 'This method allows to save external provider status active/inactive


        It validates if the status can be changed, e.g. if any other provider is active at the same time.


        Required permissions:

        Following permissions are required: ExternalDataConfiguratorEdit


        Required permissions:

        Following permissions are required: ExternalDataConfiguratorEdit'
      operationId: SaveProviderStatusV2
      parameters:
      - name: providerId
        in: path
        description: ID of External Data Provider
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Request with the boolean value of status to set.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/BooleanServiceRequest'
              description: Service request data
      responses:
        '202':
          description: Accepted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
