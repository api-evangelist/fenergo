            text/plain:
              schema:
                $ref: '#/components/schemas/CreateCustomTemplateSetResponseDtoServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCustomTemplateSetResponseDtoServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/CreateCustomTemplateSetResponseDtoServiceResponse'
