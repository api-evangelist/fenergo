  scheme: uri-path + swagger document version
  note: Two versioning axes run together. Path versioning (/api/v2/..., /api/v3/...) appears inside a service, and
    Swagger document versioning (…/swagger/1.0/swagger.json, …/2.0/…, up to 4.0 on policyquery and screeningquery)
    publishes each major as its own OpenAPI document. Older majors stay published and callable alongside the newer
    ones.
