openapi: 3.2.0
info:
  title: Fenergo Product Draft API
  version: '1.0'
  description: 'Operations tagged ProductDraft across 2 of this provider''s published API definitions: fenergo-productcommand-v1-0-openapi.json, fenergo-productquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /productcommand
- url: /productquery
security:
- Bearer: []
tags:
- name: ProductDraft
paths:
  /api/product/{productId}/draft/journey/{journeyId}:
    post:
      tags:
      - ProductDraft
      summary: Creates a product draft
      description: 'This method creates a Product Draft and stores the data related to the product.


        The method returns an object containing some basic information as the result to the user,

        type and status. The returned Id can be used in the query api to get the product.


        Required permissions:

        Following permissions are required: ProductEdit'
      operationId: CreateProductDraft
      parameters:
      - name: productId
        in: path
        description: The id of the product record that is the source for this draft
        required: true
        schema:
          type: string
          format: uuid
      - name: journeyId
        in: path
        description: The id of the product record that is the source for this draft
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '202':
          description: An instance of the Fenergo.Nebula.Product.Command.Application.Dto.ProductDraftDto class with some metadata that represent the Product Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDraftDtoServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal server error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /productcommand
