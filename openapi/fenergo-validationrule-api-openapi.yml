components:
  schemas:
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
          description: The message
          example: Success
        type:
          type:
          - string
          - 'null'
          description: 'Type of the message

            One of Info, Warning, Error, Forbidden'
          example: Info
        errorCode:
          type:
          - string
          - 'null'
          description: Error Code
          example: INTERNAL_SERVER_ERROR
      additionalProperties: false
      description: The message associated to the service response
    GetValidationRulesRequestDto:
      required:
      - entityType
      - jurisdictions
      type: object
      properties:
        jurisdictions:
          minItems: 1
          type: array
          items:
            minLength: 1
            type: string
          description: List of jurisdictions e.g. ["Global", "Ireland"]
        entityType:
          minLength: 1
          type: string
          description: The type of the entity (Individual, Company, Other, All)
          example: Individual
        category:
          type:
          - array
          - 'null'
          items:
            type: string
          description: List of requirement category e.g. ["Basic Details", "Enrich Details"]
      additionalProperties: false
      description: Response DTO representing validation request data
    ValidationRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        setId:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        propertyTypeId:
          type:
          - string
          - 'null'
          format: uuid
        linkChildFieldPropertyName:
          type:
          - string
          - 'null'
        linkedParentFieldPropertyName:
          type:
          - string
          - 'null'
        propertyName:
          type:
          - string
          - 'null'
        friendlyName:
          type:
          - string
          - 'null'
        validationType:
          type:
          - string
          - 'null'
        isDataGroup:
          type: boolean
        dataGroupId:
          type:
          - string
          - 'null'
          format: uuid
        validationData:
          allOf:
          - $ref: '#/components/schemas/ValidationData'
      additionalProperties: false
    RegexRule:
      type: object
      properties:
        active:
          type: boolean
        message:
          type:
          - string
          - 'null'
        isCaseSensitive:
          type: boolean
        regexValue:
          type:
          - string
          - 'null'
      additionalProperties: false
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
          description: The service response DTO
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
          description: List of Fenergo.Nebula.Platform.Core.Models.Response.ServiceResponseMessage associated to the service response
      additionalProperties: false
      description: Service response data
    GetValidationRulesRequestDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/GetValidationRulesRequestDto'
          description: Response DTO representing validation request data
      additionalProperties: false
      description: Service request data
    ValidationRuleListServiceResponse:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ValidationRule'
          description: The service response DTO
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
          description: List of Fenergo.Nebula.Platform.Core.Models.Response.ServiceResponseMessage associated to the service response
      additionalProperties: false
      description: Service response data
    ValidationData:
      type: object
      properties:
        isMandatory:
          allOf:
          - $ref: '#/components/schemas/BasicRule'
        specialCharacters:
          allOf:
          - $ref: '#/components/schemas/SpecialCharactersRule'
        noNumbers:
          allOf:
          - $ref: '#/components/schemas/BasicRule'
        onlyInteger:
          allOf:
          - $ref: '#/components/schemas/BasicRule'
        noNegative:
          allOf:
          - $ref: '#/components/schemas/BasicRule'
        onlyDecimal:
          allOf:
          - $ref: '#/components/schemas/BasicRule'
        regex:
          allOf:
          - $ref: '#/components/schemas/RegexRule'
        characterLimit:
          allOf:
          - $ref: '#/components/schemas/ValueLimitRule'
        numberLimit:
          allOf:
          - $ref: '#/components/schemas/ValueLimitRule'
        noFutureDates:
          allOf:
          - $ref: '#/components/schemas/BasicRule'
        noPastDates:
          allOf:
          - $ref: '#/components/schemas/BasicRule'
        dateLimit:
          allOf:
          - $ref: '#/components/schemas/DateLimitRule'
        multiSelectLimit:
          allOf:
          - $ref: '#/components/schemas/ValueLimitRule'
        collectionMinimumCount:
          allOf:
          - $ref: '#/components/schemas/CollectionMinimumCountRule'
        collectionMaximumCount:
          allOf:
          - $ref: '#/components/schemas/CollectionMaximumCountRule'
        externalProvider:
          allOf:
          - $ref: '#/components/schemas/ExternalProviderRule'
        externalDataGroupProvider:
          allOf:
          - $ref: '#/components/schemas/ExternalProviderRule'
      additionalProperties: false
    ValueLimitRule:
      type: object
      properties:
        active:
          type: boolean
        message:
          type:
          - string
          - 'null'
        minValue:
          type:
          - integer
          - 'null'
          format: int32
        maxValue:
          type:
          - integer
          - 'null'
          format: int32
      additionalProperties: false
    ObjectServiceResponse:
      type: object
      properties:
        data:
          description: The service response DTO
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
          description: List of Fenergo.Nebula.Platform.Core.Models.Response.ServiceResponseMessage associated to the service response
      additionalProperties: false
      description: Service response data
    CollectionMaximumCountRule:
      type: object
      properties:
        active:
          type: boolean
        message:
          type:
          - string
          - 'null'
        requiredTypesMaxCount:
          type:
          - object
          - 'null'
          additionalProperties:
            type: integer
            format: int32
        overallMaximumCount:
          type:
          - integer
          - 'null'
          format: int32
      additionalProperties: false
    BasicRule:
      type: object
      properties:
        active:
          type: boolean
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    DateLimitRule:
      type: object
      properties:
        active:
          type: boolean
        message:
          type:
          - string
          - 'null'
        minDate:
          type:
          - string
          - 'null'
          format: date-time
        maxDate:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
    SpecialCharactersRule:
      type: object
      properties:
        active:
          type: boolean
        message:
          type:
          - string
          - 'null'
        excludedCharacters:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    StringServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
          description: The service response DTO
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
          description: List of Fenergo.Nebula.Platform.Core.Models.Response.ServiceResponseMessage associated to the service response
      additionalProperties: false
      description: Service response data
    ExternalProviderRule:
      type: object
      properties:
        active:
          type: boolean
        message:
          type:
          - string
          - 'null'
        providerId:
          type: string
          format: uuid
      additionalProperties: false
    CollectionMinimumCountRule:
      type: object
      properties:
        active:
          type: boolean
        message:
          type:
          - string
          - 'null'
        requiredTypesMinCount:
          type:
          - object
          - 'null'
          additionalProperties:
            type: integer
            format: int32
        overallMinimumCount:
          type: integer
          format: int32
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: Please insert JWT with Bearer into field
      name: Authorization
      in: header
