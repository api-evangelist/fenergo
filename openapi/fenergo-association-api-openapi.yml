            this id (e.g. authorization filtered it out) - never populated from Neptune itself.'
        type:
          type:
          - string
          - 'null'
        childCount:
          type: integer
          description: 'True child count for this node - if non-zero, the client can offer a Branch Card / drill-in to

            page this node''s own children via another call to the same endpoint with this node''s EntityId.'
          format: int32
      additionalProperties: false
