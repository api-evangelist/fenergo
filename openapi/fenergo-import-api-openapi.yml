  version: '1.0'
  description: 'Operations tagged Import across 5 of this provider''s published API definitions: fenergo-configreleasehubcommand-v1-0-openapi.json, fenergo-externaldatacommand-v1-0-openapi.json, fenergo-externaldataquery-v1-0-openapi.json, fenergo-financialanalysiscommand-v1-0-openapi.json, fenergo-financialanalysisquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /configreleasehubcommand
- url: /externaldatacommand
- url: /externaldataquery
- url: /financialanalysiscommand
