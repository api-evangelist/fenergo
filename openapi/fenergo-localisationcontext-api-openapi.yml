      additionalProperties: false
    UpdateLocalisationContextMetadataDtoServiceRequest:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UpdateLocalisationContextMetadataDto'
      additionalProperties: false
    UpdateLocalisationContextMetadataDto:
      type: object
      properties:
        description:
          type:
          - string
          - 'null'
          description: Description of the context
          example: Translation for Chinese
      additionalProperties: false
      description: Defines the context of the localisation file
    LocalisationContextDtoServiceRequest:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/LocalisationContextDto'
      additionalProperties: false
    ValidateContextAndRefreshCacheDto:
      type: object
      properties:
        isContextValid:
          type: boolean
        message:
