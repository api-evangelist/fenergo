  version: '1.0'
  description: 'Operations tagged Deals across 3 of this provider''s published API definitions: fenergo-associationquery-v1-0-openapi.json, fenergo-dealscommand-v1-0-openapi.json, fenergo-dealsquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
