components:
  schemas:
    RecipientIdentityVerification:
      type: object
      properties:
        inputOptions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RecipientIdentityInputOption'
        workflowId:
          type:
          - string
          - 'null'
        workflowIdMetadata:
          allOf:
          - $ref: '#/components/schemas/PropertyMetadata'
        workflowLabel:
          type:
          - string
          - 'null'
      additionalProperties: false
    DocumentSignatureCancellationResponseDto:
      type: object
      properties:
        warnings:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The list of possible warnings
      additionalProperties: false
      description: A document requirement model for an external eSignature provider
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    DocumentSignatureResponseDtoServiceResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/DocumentSignatureResponseDto'
          description: A document requirement model for an external eSignature provider
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    StringServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    DocumentSignatureResponseDto:
      type: object
      properties:
        envelopeId:
          type:
          - string
          - 'null'
          description: EnvelopeId attribute of the eSignature Document Requirement defined by eSignature Service
          example: 4ec8f1bc-d745-4d0d-a9e7-cde0d0e7a614
        dateSent:
          type:
          - string
          - 'null'
          description: The sent date to external eSignature service
          format: date-time
          example: '2021-09-09 09:26:03.478039'
        externalProviderUrl:
          type:
          - string
          - 'null'
          description: The URL which navigates to External Provider Envelope
          example: https://docusign.net/
        warnings:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The list of possible warnings
      additionalProperties: false
      description: A document requirement model for an external eSignature provider
    RecipientIdentityInputOption:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        phoneNumberList:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RecipientIdentityPhoneNumber'
        valueType:
          type:
          - string
          - 'null'
      additionalProperties: false
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    RecipientIdentityPhoneNumber:
      type: object
      properties:
        countryCode:
          type:
          - string
          - 'null'
        countryCodeLock:
          type:
          - string
          - 'null'
        countryCodeMetadata:
          allOf:
          - $ref: '#/components/schemas/PropertyMetadata'
        extension:
          type:
          - string
          - 'null'
        extensionMetadata:
          allOf:
          - $ref: '#/components/schemas/PropertyMetadata'
        number:
          type:
          - string
          - 'null'
        numberMetadata:
          allOf:
          - $ref: '#/components/schemas/PropertyMetadata'
      additionalProperties: false
    DocumentSignatureCancellationResponseDtoServiceResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/DocumentSignatureCancellationResponseDto'
          description: A document requirement model for an external eSignature provider
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    ObjectServiceResponse:
      type: object
      properties:
        data: {}
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    PropertyMetadata:
      type: object
      properties:
        options:
          type:
          - array
          - 'null'
          items:
            type: string
        rights:
          type:
          - string
          - 'null'
      additionalProperties: false
    SignerDto:
      type: object
      properties:
        signerType:
          type:
          - string
          - 'null'
        fullName:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        relationship:
          type:
          - string
          - 'null'
        hasSigned:
          type:
          - boolean
          - 'null'
        order:
          type: integer
          format: int32
        accessCode:
          type:
          - string
          - 'null'
        recipientIdentityVerification:
          allOf:
          - $ref: '#/components/schemas/RecipientIdentityVerification'
        signatureType:
          type:
          - string
          - 'null'
        smsNumber:
          type:
          - string
          - 'null'
      additionalProperties: false
    DocumentSignatureRequestDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/DocumentSignatureRequestDto'
          description: A document requirement model for external eSignature provider
      additionalProperties: false
    DocumentSignatureCancellationRequestDto:
      type: object
      properties:
        providerName:
          type:
          - string
          - 'null'
          description: The name of external provider
          example: DocuSign
        eSignatureDocumentRequirementId:
          type: string
          description: ESignatureDocumentRequirement identifier
          format: uuid
          example: 4ec8f1bc-d745-4d0d-a9e7-cde0d0e7a614
      additionalProperties: false
      description: A document requirement model for external eSignature provider
    DocumentSignatureCancellationRequestDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/DocumentSignatureCancellationRequestDto'
          description: A document requirement model for external eSignature provider
      additionalProperties: false
    DocumentSignatureRequestDto:
      type: object
      properties:
        taskId:
          type: string
          description: The Id of the task
          format: uuid
          example: 315df981-38a0-4145-836b-8d22745887b6
        entityId:
          type: string
          description: The Id of the entity
          format: uuid
          example: 315df981-38a0-4145-836b-8d22745887b6
        journeyId:
          type: string
          description: The Id of the journey
          format: uuid
          example: 315df981-38a0-4145-836b-8d22745887b6
        entityName:
          type:
          - string
          - 'null'
          description: The name of entity
          example: Fenergo Limited
        providerName:
          type:
          - string
          - 'null'
          description: The name of external provider
          example: DocuSign
        documentRequirementsIds:
          type:
          - array
          - 'null'
          items:
            type: string
          description: List of document requirements identifiers which will be send
        signers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SignerDto'
          description: List of persons required to sign off
        isDraft:
          type:
          - boolean
          - 'null'
          description: Flag which determines which status will be send to external provider
          example: false
      additionalProperties: false
      description: A document requirement model for external eSignature provider
  securitySchemes:
    Bearer:
      type: apiKey
      description: Please insert JWT with Bearer into field
      name: Authorization
      in: header
