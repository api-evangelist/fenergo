          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
      example:
        data:
        - propertyName: data
          errorMessage: Data is required
          attemptedValue: ''
          errorCode: NotNullValidator
        messages:
        - message: Data is required
          type: Error
          errorCode: Error Code
    CoverSheetDto:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether the cover sheet is included in the report.
        showLogo:
          type: boolean
          description: Whether the tenant logo is displayed on the cover sheet.
        showGeneratedDate:
          type: boolean
