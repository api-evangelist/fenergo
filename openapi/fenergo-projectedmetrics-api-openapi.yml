                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
      operationId: postApiProjectedmetricsGetjourneyestimatesbytype
      x-operation-id-source: derived
