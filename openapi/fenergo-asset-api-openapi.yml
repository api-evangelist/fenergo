openapi: 3.2.0
info:
  title: Fenergo Asset API
  version: '1.0'
  description: 'Operations tagged Asset across 2 of this provider''s published API definitions: fenergo-collateralcommand-v1-0-openapi.json, fenergo-collateralquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /collateralcommand
- url: /collateralquery
security:
- Bearer: []
tags:
- name: Asset
paths:
  /api/asset:
    post:
      tags:
      - Asset
      summary: Create a new Asset
      description: 'Creates a new Asset


        The returned Id can be used in the Query API to retrieve this Asset.


        Required permissions:

        Following permissions are required: CollateralEdit'
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Create Asset request
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AssetDtoServiceRequest'
      responses:
        '202':
          description: Success. Asset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDtoServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal server error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: Error Code
      operationId: postApiAsset
      x-operation-id-source: derived
    servers:
    - url: /collateralcommand
  /api/asset/{id}:
    delete:
      tags:
      - Asset
      summary: Delete an Asset
      description: 'Deletes an Asset and its drafts


        Only Assets with the draft status can be deleted.


        Required permissions:

        Following permissions are required: CollateralEdit'
      parameters:
      - name: id
        in: path
        description: Asset Id
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '202':
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal server error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: Error Code
      operationId: deleteApiAssetById
      x-operation-id-source: derived
    get:
      tags:
      - Asset
      summary: Get an Asset by Id
      description: 'This method returns the Asset of specified Id.


        Required permissions:

        Following permissions are required: CollateralAccessAndSearch'
      operationId: GetAssetById
      parameters:
      - name: id
        in: path
        description: Asset Id
        required: true
        schema:
          type: string
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDtoServiceResponse'
        '400':
          description: Asset Id is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: No Asset was found
                  type: Error
                  errorCode: Error Code
        '500':
          description: An exception occurred while processing the command
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: Error Code
    servers:
    - url: /collateralcommand
  /api/asset/getAssetsList:
    post:
      tags:
      - Asset
      summary: Get Assets with specified attributes
      description: 'This method returns Assets with attributes specified.


        Required permissions:

        Following permissions are required: CollateralAccessAndSearch'
      operationId: GetAssetsList
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
