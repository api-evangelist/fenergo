openapi: 3.2.0
info:
  title: Fenergo Nebula Review Command Product Rules API
  description: Review Command API is part of FenX eco-system to manage EntityRule and Review Instances. All the operations require valid access token obtained from Identity service.
  version: '1.0'
servers:
- url: /reviewcommand
security:
- Bearer: []
tags:
- name: ProductRules
