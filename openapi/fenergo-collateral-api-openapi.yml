openapi: 3.2.0
info:
  title: Fenergo Collateral API
  version: '1.0'
  description: 'Operations tagged Collateral across 2 of this provider''s published API definitions: fenergo-collateralcommand-v1-0-openapi.json, fenergo-collateralquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /collateralcommand
- url: /collateralquery
security:
- Bearer: []
tags:
- name: Collateral
paths:
  /api/collateral:
    post:
      tags:
      - Collateral
      summary: Create a new Collateral
      description: 'Creates a new Collateral


        The returned Id can be used in the Query API to retrieve this Collateral.


        Required permissions:

        Following permissions are required: CollateralEdit'
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Create Collateral request
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CollateralDtoServiceRequest'
      responses:
        '202':
          description: Success. Asset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollateralDtoServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal server error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: Error Code
      operationId: postApiCollateral
      x-operation-id-source: derived
    get:
      tags:
      - Collateral
      summary: Get all Collaterals for a Tenant Id
      description: 'This endpoint is obsolete and was terminated on 2023-09-30. This endpoint is obsolete, use GetCollateralsList instead.


        This method returns the list of Collaterals for the Tenant.


        Required permissions:

        Following permissions are required: CollateralAccessAndSearch'
      operationId: GetCollaterals
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollateralDtoIEnumerableServiceResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not Found
                  type: Error
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
