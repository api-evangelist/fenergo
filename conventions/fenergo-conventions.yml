architecture:
  style: REST + JSON
  pattern: CQRS — separate Command (write) and Query (read) services per domain
  persistence: event sourcing over an append-only log
  consistency: eventually consistent — a write accepted by a Command API is not immediately visible on the matching
    Query API
  design: Domain Driven Design; each domain owns its own service and interface
  note: Of 145 published contracts, the majority pair as <domain>command / <domain>query. Read-after-write requires
    polling the Query API or subscribing to the matching event notification.
