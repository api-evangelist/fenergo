          type: string
          format: uuid
        journeyName:
          type:
          - string
          - 'null'
        entityName:
          type:
          - string
          - 'null'
        entityId:
          type: string
          format: uuid
        progress:
          type: number
          format: double
        status:
          type:
          - string
          - 'null'
        tasks:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/JourneyTaskDto'
        daysOpen:
          type:
          - string
          - 'null'
        slaPeriod:
          type:
          - string
          - 'null'
        teams:
          type:
          - array
          - 'null'
          items:
            type: string
        started:
          type:
          - string
          - 'null'
          format: date-time
        paused:
          type:
          - string
          - 'null'
          format: date-time
        priority:
          type:
          - array
          - 'null'
          items:
            type: string
        entityGeographicAccessLayers:
          type:
          - array
          - 'null'
          items:
            type: string
        entityBusinessAccessLayers:
          type:
          - array
          - 'null'
          items:
            type: string
        journeyGeographicAccessLayers:
          type:
          - array
          - 'null'
          items:
            type: string
        journeyBusinessAccessLayers:
          type:
          - array
          - 'null'
          items:
            type: string
        milestones:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/JourneyMilestoneDto'
        serviceLevelAgreement:
          $ref: '#/components/schemas/ServiceLevelAgreementDto'
        journeyOwner:
          $ref: '#/components/schemas/JourneyOwnerDto'
        customStatus:
          type:
          - string
          - 'null'
      additionalProperties: false
    ServiceLevelAgreementDto:
