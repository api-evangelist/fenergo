        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    DeferredDocRequirementsReviewConfigDto:
      required:
      - isEnabled
      - journeyType
      type: object
      properties:
        isEnabled:
          type: boolean
          description: Is deferred document requirements mechanism enabled.
          example: true
        journeyType:
          type:
          - string
          - 'null'
          description: Type of the journey to launch as a review.
          example: DeferredDocumentRequirementsReview
      additionalProperties: false
