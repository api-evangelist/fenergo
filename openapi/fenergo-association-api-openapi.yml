openapi: 3.2.0
info:
  title: Fenergo Association API
  version: '1.0'
  description: 'Operations tagged Association across 6 of this provider''s published API definitions: fenergo-associationcommand-v1-0-openapi.json, fenergo-associationcommand-v2-0-openapi.json, fenergo-associationquery-v1-0-openapi.json, fenergo-externaloutreachcommand-v1-0-openapi.json, fenergo-externaloutreachcommand-v2-0-openapi.json, fenergo-externaloutreachquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /associationcommand
- url: /associationquery
- url: /externaloutreachcommand
- url: /externaloutreachquery
security:
- Bearer: []
tags:
- name: Association
paths:
