openapi: 3.2.0
info:
  title: Fenergo Nebula Advanced Dashboard Query Dashboards API
  description: '**Advanced Dashboard Query API**:


    Advanced Dashboard Query API provides endpoints in order to retrieve all related models and their versions.


    **Advanced Dashboard Query API provides**:'
  version: 1.0.0
servers:
- url: /advanceddashboardquery
security:
- Bearer: []
tags:
- name: Dashboards
paths:
  /api/dashboards/journey:
    post:
      tags:
      - Dashboards
      summary: Get journey dashboard data
      description: 'Returns the data for journey dashboard for a given tenant


        Required permissions:

        Following permissions are required: AdvancedDashboardAccess'
      operationId: GetJourneyDashboard
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/JourneyDashboardDataRequestDto'
              description: Represents the data model Journey Dashboard request
      responses:
        '200':
          description: Success. Journey Dashboard data is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyDashboardDataDtoServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
  /api/dashboards/journey/aggregation:
    post:
      tags:
      - Dashboards
      summary: Retrieves aggregated journey dashboard data for the specified tenant
      description: 'This endpoint returns grouped data based on the specified aggregation field (e.g., for pie chart visualization),

        optionally filtered by the provided field-value pairs.


        Required permissions:

        Following permissions are required: AdvancedDashboardAccess'
      operationId: GetJourneyDataAggregation
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: The request containing filter criteria and the field to aggregate on.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AggregationRequestDto'
              description: Represents the request for aggregation.
      responses:
        '200':
          description: Success. Aggregated journey dashboard data is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregationResponseDtoServiceResponse'
        '400':
          description: Bad request. One or more request values are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
