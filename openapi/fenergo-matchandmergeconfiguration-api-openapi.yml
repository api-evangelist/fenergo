      - MatchAndMergeConfiguration
      summary: Save Match and Merge configuration
      description: 'Creates or updates the Match and Merge field configuration for the given entity type.


        Replaces all existing fields with those provided in the request.


        Required permissions:

        Following permissions are required: EntityDataEdit'
      operationId: SaveMatchAndMergeConfiguration
      parameters:
      - name: entityType
        in: path
        description: The entity type (e.g. Individual, Company)
        required: true
        schema:
          type: string
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      - name: X-CORRELATION-ID
        in: header
        description: The UiD of the correlation id
        schema:
          type: string
        example: fee5b5f5-b220-4fef-ba38-bf802b98d74d
      requestBody:
        description: The configuration request containing the list of fields
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/MatchAndMergeConfigurationRequestDtoServiceRequest'
      responses:
