components:
  schemas:
    PatchClientDtoServiceRequest:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PatchClientDto'
      additionalProperties: false
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    CreateClientDto:
      required:
      - allowedScopes
      - clientEmails
      - clientName
      type: object
      properties:
        clientName:
          minLength: 1
          type: string
          description: The name of the client
          example: cli-tool-1
        allowedScopes:
          type: array
          items:
            type: string
          description: Scopes the client has access to
          example:
          - scimapi.resource.update
          - scimapi.resource.query
          - scimapi.resource.delete
          - fenx.product.read
        clientEmails:
          maxLength: 2000
          minLength: 1
          type: string
          description: Client emails used for notifications about certificate expiration.
