              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    get:
      tags:
      - ReportBranding
      summary: Get report branding configuration
      description: 'This method returns the report branding configuration for the current tenant


        Required permissions:

        Following permissions are required: ReportingAccess'
      operationId: GetReportBranding
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: Success. The report branding configuration is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportBrandingResponseDtoServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
