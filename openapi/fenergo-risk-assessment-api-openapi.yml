              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
  /api/risk-assessment/related-parties/{taskId}/entity/{entityId}:
    get:
      tags:
      - Risk Assessment
      summary: Get Risk Assessment for Related Party by task id and entity id
      description: 'This method will retrieve a specific risk assessment for a related party based on the given task id and entity id.


        Required permissions:

        Following permissions are required: RiskCalculatorAccess'
      operationId: GetRiskAssessmentDetailsForRelatedParty
      parameters:
      - name: taskId
        in: path
        description: Id of the task for returning related party risk assessment
        required: true
        schema:
          type: string
          format: uuid
      - name: entityId
        in: path
        description: Id of the entity for returning related party risk assessment
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/RiskTaskResultModelViewModelDtoServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/RiskTaskResultModelViewModelDtoServiceResponse'
            text/json:
              schema:
