components:
  schemas:
    RelationshipContexts:
      enum:
      - None
      - Hierarchy
      - InvestmentAccount
      - Both
      type: string
      description: 'Identifies the relationship context for a related party in the RPD&D task.

        Defined as a flags enum so that Fenergo.Nebula.Association.Query.Application.Enums.RelationshipContexts.Both is a true bitwise combination

        of Fenergo.Nebula.Association.Query.Application.Enums.RelationshipContexts.Hierarchy and Fenergo.Nebula.Association.Query.Application.Enums.RelationshipContexts.InvestmentAccount, allowing callers

        to use `HasFlag` to test individual origins.'
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    FundIdPageDto:
      required:
      - agentId
      type: object
      properties:
        agentId:
          type: string
          format: uuid
        pagination:
          allOf:
          - $ref: '#/components/schemas/PageDto'
      additionalProperties: false
    AssociationDtoIEnumerableServiceResponse:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AssociationDto'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    VerifiedProductIdPageDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/VerifiedProductIdPageDto'
      additionalProperties: false
    GuidItemsPageDtoServiceResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/GuidItemsPageDto'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    AgencyProductDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/AgencyProductDto'
      additionalProperties: false
    GuidItemsPageDto:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
        paginationToken:
          type:
          - string
          - 'null'
      additionalProperties: false
    AgencyAssociationsByTargetIdListDto:
      type: object
      properties:
        entityIds:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Entity Ids
      additionalProperties: false
    AgencyProductDto:
      type: object
      properties:
        entityId:
          type: string
          description: The UiD of the root entity.
          format: uuid
          example: 118313c6-91e6-4b05-a537-5a1ab906418f
        mrId:
          type: string
          description: The UiD of the Managed relationship entity.
          format: uuid
          example: 118313c6-91e6-4b05-a537-5a1ab906418f
        agentId:
          type: string
          description: The UiD of the agent entity.
          format: uuid
          example: 118313c6-91e6-4b05-a537-5a1ab906418f
        productId:
          type: string
          description: The UiD of the product entity.
          format: uuid
          example: 118313c6-91e6-4b05-a537-5a1ab906418f
        journeyId:
          type: string
          description: The UiD of the journey.
          format: uuid
          example: c5d6c4e4-1246-4928-b6ba-6b4e3560e414
      additionalProperties: false
    AgencyAssociationsByTargetIdListDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/AgencyAssociationsByTargetIdListDto'
      additionalProperties: false
    ObjectServiceResponse:
      type: object
      properties:
        data: {}
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    AssociationDto:
      type: object
      properties:
        id:
          type: string
          description: The UiD of the association model
          format: uuid
          example: 118313c6-91e6-4b05-a537-5a1ab906418f
        sourceId:
          type: string
          description: The UiD of the Parent Entity
          format: uuid
          example: 2920b7a7-7336-4fb1-82b7-1d691b8367fa
        targetId:
          type: string
          description: The UiD of the Child Entity
          format: uuid
          example: 6b399cff-6e35-42a0-aaf0-69a94a008636
        type:
          type:
          - string
          - 'null'
          description: The type of association
          example: Shareholder
        journeyId:
          type: string
          description: The UiD of the Journey that this association was created
          format: uuid
          example: 4a056330-18d2-4ec1-8b1e-c959ed4b5f12
        isVerified:
          type: boolean
          description: Annotates whether the association has been validated
          example: true
        ownershipPercentage:
          type:
          - number
          - 'null'
          description: 'The percentage amount of the target entity owned by the source entity

            (optional)'
          format: double
          example: 5.007
        controlPercentage:
          type:
          - number
          - 'null'
          description: 'The percentage amount of the target entity controlled by the source entity

            (optional)'
          format: double
          example: 23.4
        markedForDeletion:
          uniqueItems: true
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          description: Lists the JourneyIds which have marked the association for deletion
        properties:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
          description: A list of custom properties that describe the association
          example:
          - Ownership Percentage: 15
          - CountryOfIncorporation: Ireland
        subtype:
          type:
          - string
          - 'null'
          description: The subtype of association used for product association type
          example: Shareholder
        relationshipContext:
          allOf:
          - $ref: '#/components/schemas/RelationshipContexts'
          description: 'Identifies the relationship context for the association.

            Null when the IA RP feature is disabled or not applicable.'
        investmentAccountName:
          type:
          - string
          - 'null'
          description: 'The name of the investment account this RP is associated with.

            Null when the RP originates from the entity hierarchy only.'
      additionalProperties: false
      description: The metadata of an association between two entities
    PageDto:
      type: object
      properties:
        paginationToken:
          type:
          - string
          - 'null'
        pageSize:
          type:
          - integer
          - 'null'
          format: int32
      additionalProperties: false
    VerifiedProductIdPageDto:
      required:
      - agentId
      - fundId
      type: object
      properties:
        agentId:
          type: string
          format: uuid
        fundId:
          type: string
          format: uuid
        pagination:
          allOf:
          - $ref: '#/components/schemas/PageDto'
      additionalProperties: false
    StringServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    FundIdPageDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/FundIdPageDto'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: Please insert JWT with Bearer into field
      name: Authorization
      in: header
