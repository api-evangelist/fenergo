            $ref: '#/components/schemas/AssetDto_2'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    AssetSnapshotDtoServiceResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/AssetSnapshotDto'
          description: An Asset snapshot object
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    AssetDto_2:
      type: object
      properties:
        id:
          type: string
          description: The Asset Id
          format: uuid
          example: e1809731-77df-4e72-98e7-0d314b7a5151
        type:
          type:
          - string
          - 'null'
          description: The Asset Type
          example: Financial Asset
        alternateId:
