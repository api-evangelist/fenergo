components:
  schemas:
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    CreateCategoryDto:
      required:
      - colour
      - name
      type: object
      properties:
        name:
          maxLength: 24
          minLength: 1
          type: string
          description: Category display name (max 24 characters)
        colour:
          minLength: 1
          type: string
          description: 'Hex colour code for the category badge (e.g. #FF5733)'
      additionalProperties: false
      description: Data required to create a new query category
    CreatedCategoryDtoServiceResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/CreatedCategoryDto'
          description: Response returned after a category is created
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    UpdateCategoryDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/UpdateCategoryDto'
          description: Data for updating a query category
      additionalProperties: false
    UpdateCategoryDto:
      type: object
      properties:
        name:
          maxLength: 24
          type:
          - string
          - 'null'
          description: New display name (max 24 characters, optional — null preserves existing)
        colour:
          type:
          - string
          - 'null'
          description: 'New hex colour code (e.g. #FF5733, optional — null preserves existing)'
      additionalProperties: false
      description: Data for updating a query category
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    CreatedCategoryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
      additionalProperties: false
      description: Response returned after a category is created
    ObjectServiceResponse:
      type: object
      properties:
        data: {}
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    CreateCategoryDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/CreateCategoryDto'
          description: Data required to create a new query category
      additionalProperties: false
    StringServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    CategoryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
        colour:
          type:
          - string
          - 'null'
        queryCount:
          type: integer
          format: int32
      additionalProperties: false
      description: A single query category returned in the list
    CategoryDtoIEnumerableServiceResponse:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CategoryDto'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: Please insert JWT with Bearer into field
      name: Authorization
      in: header
