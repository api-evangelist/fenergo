components:
  schemas:
    TaskConfigBaseDto:
      required:
      - taskType
      type: object
      properties:
        taskType:
          allOf:
          - $ref: '#/components/schemas/TaskType'
          readOnly: true
        catch:
          allOf:
          - $ref: '#/components/schemas/TaskCatchDto'
        retry:
          allOf:
          - $ref: '#/components/schemas/TaskRetryDto'
      additionalProperties: false
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    AiInvokerConfigV1Dto:
      allOf:
      - $ref: '#/components/schemas/TaskConfigBaseDto'
      - required:
        - taskType
        type: object
        properties:
          taskType:
            allOf:
            - $ref: '#/components/schemas/TaskType'
            readOnly: true
          aiModel:
            allOf:
            - $ref: '#/components/schemas/AiModel'
          requestType:
            allOf:
            - $ref: '#/components/schemas/AiRequestType'
          id:
            allOf:
            - $ref: '#/components/schemas/StraightValueDto'
          providerId:
            allOf:
            - $ref: '#/components/schemas/StraightValueDto'
          apiKey:
            allOf:
            - $ref: '#/components/schemas/StraightValueDto'
          userPrompt:
            allOf:
            - $ref: '#/components/schemas/StraightValueDto'
          systemPrompt:
            allOf:
            - $ref: '#/components/schemas/StraightValueDto'
          entityId:
            allOf:
            - $ref: '#/components/schemas/StraightValueDto'
          searchCriteria:
            type:
            - object
            - 'null'
            additionalProperties:
              $ref: '#/components/schemas/StraightValueDto'
        additionalProperties: false
    FlowVariableDto:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        value: {}
        type:
          allOf:
          - $ref: '#/components/schemas/VariableType'
      additionalProperties: false
    VariableDefinitionType:
      enum:
      - Constant
      - Single
      - Func
      type: string
    FlowTemplateDependencyDto:
      type: object
      properties:
        templateKey:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
      additionalProperties: false
    InlineTransformerConfigV1Dto:
      allOf:
      - $ref: '#/components/schemas/TaskConfigBaseDto'
      - required:
        - taskType
        type: object
        properties:
          taskType:
            allOf:
            - $ref: '#/components/schemas/TaskType'
            readOnly: true
          operation:
            allOf:
            - $ref: '#/components/schemas/InlineTransformerTaskOperation'
          saveToState:
            type: boolean
          statePropertyName:
            type:
            - string
            - 'null'
          leftOperand:
            allOf:
            - $ref: '#/components/schemas/ComplexValueDto'
          rightOperand:
            allOf:
            - $ref: '#/components/schemas/ComplexValueDto'
          withHeaders:
            type:
            - boolean
            - 'null'
        additionalProperties: false
    FlowTemplateDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        templateKey:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        category:
          allOf:
          - $ref: '#/components/schemas/TemplateCategory'
        featureFlagName:
          type:
          - string
          - 'null'
        versionNumber:
          type: integer
          format: int32
        status:
          allOf:
          - $ref: '#/components/schemas/TemplateStatus'
        flowDefinition:
          allOf:
          - $ref: '#/components/schemas/FlowTemplateFlowDefinitionDto'
        schemas:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FlowTemplateSchemaSnapshotDto'
        mappings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FlowTemplateMappingSnapshotDto'
        dependentFlows:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/FlowTemplateDependencyDto'
        dependentSchemas:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/ResourceTemplateDependencyDto'
        dependentMappings:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/ResourceTemplateDependencyDto'
      additionalProperties: false
    TemplateCategory:
      enum:
      - ConfigurationTemplates
      - DesignPatterns
      - ScreeningProviderDemo
      - AiTemplates
      type: string
    SuperGraphQueryFlagsDto:
      type: object
      properties:
        includeStages:
          type: boolean
        includeEntity:
          type: boolean
        includeEntityDrafts:
          type: boolean
        includeRelatedParties:
          type: boolean
        includeProductDrafts:
          type: boolean
        includeProductAssociations:
          type: boolean
        includeJourneys:
          type: boolean
      additionalProperties: false
    RouterConfigV1Dto:
      allOf:
      - $ref: '#/components/schemas/TaskConfigBaseDto'
      - required:
        - taskType
        type: object
        properties:
          taskType:
            allOf:
            - $ref: '#/components/schemas/TaskType'
            readOnly: true
          routes:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/RouteDto'
        additionalProperties: false
    TaskCatchDto:
      type: object
      properties:
        routes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TaskCatchRouteDto'
        default:
          type:
          - string
          - 'null'
      additionalProperties: false
    StraightValue:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/StraightValueType'
        value:
          type:
          - string
          - 'null'
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/Variable'
      additionalProperties: false
    EventIngressConfigV1Dto:
      allOf:
      - $ref: '#/components/schemas/TaskConfigBaseDto'
      - required:
        - eventSubtype
        - eventType
        - payload
        - runMode
        - source
        - taskType
        type: object
        properties:
          taskType:
            allOf:
            - $ref: '#/components/schemas/TaskType'
            readOnly: true
          eventType:
            minLength: 1
            type: string
          eventSubtype:
            minLength: 1
            type: string
          source:
            minLength: 1
            type: string
          payload:
            allOf:
            - $ref: '#/components/schemas/ComplexValueDto'
          runMode:
            allOf:
            - $ref: '#/components/schemas/EventIngressRunMode'
          priority:
            allOf:
            - $ref: '#/components/schemas/StraightValue'
        additionalProperties: false
    VariableDefinitionFuncType:
      enum:
      - JsonPath
      - Pattern
      type: string
    Variable:
      type: object
      properties:
        definitionType:
          allOf:
          - $ref: '#/components/schemas/VariableDefinitionType'
        constantVariable:
          allOf:
          - $ref: '#/components/schemas/ConstantVariable'
        singleVariable:
          allOf:
          - $ref: '#/components/schemas/SingleVariable'
        funcVariable:
          allOf:
          - $ref: '#/components/schemas/FuncVariable'
      additionalProperties: false
    ComplexValueDto:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/ComplexValueType'
        variable:
          allOf:
          - $ref: '#/components/schemas/VariableDto'
        json: {}
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/VariableDto'
      additionalProperties: false
    StorageTaskTTL:
      enum:
      - OneWeek
      - OneMonth
      type: string
    UpdateManagedFlowResponse:
      type: object
      properties:
        updated:
          type: boolean
      additionalProperties: false
    VariableType:
      enum:
      - Text
      - Number
      - Json
      - Guid
      - Request
      - Secret
      - TaskError
      type: string
    ObjectInitiatorDto:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/SourceType'
        config: {}
      additionalProperties: false
    FileSource:
      enum:
      - PersistedStorage
      - FenergoDocument
      type: string
    ParallelTaskConfigV1Dto:
      allOf:
      - $ref: '#/components/schemas/TaskConfigBaseDto'
      - required:
        - taskType
        type: object
        properties:
          taskType:
            allOf:
            - $ref: '#/components/schemas/TaskType'
            readOnly: true
          branches:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/ParallelBranchConfigV1Dto'
        additionalProperties: false
    InlineTransformerTaskOperation:
      enum:
      - JsonMerge
      - JsonFormat
      - ArrayMerge
      - ArrayAppend
      - Compress
      - Uncompress
      - ParseCsv
      type: string
    TemplateStatus:
      enum:
      - Active
      - Deprecated
      type: string
    ObjectServiceResponse:
      type: object
      properties:
        data: {}
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    TaskRetryDto:
      type: object
      properties:
        rules:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TaskRetryRuleDto'
        default:
          allOf:
          - $ref: '#/components/schemas/TaskRetryDefinitionDto'
      additionalProperties: false
    ConditionDto:
      required:
      - leftValue
      - name
      - operatorType
      - rightValue
      type: object
      properties:
        name:
          minLength: 1
          type: string
        leftValue:
          allOf:
          - $ref: '#/components/schemas/StraightValueDto'
        rightValue:
          allOf:
          - $ref: '#/components/schemas/StraightValueDto'
        operatorType:
          allOf:
          - $ref: '#/components/schemas/ConditionOperator'
      additionalProperties: false
    AiRequestType:
      enum:
      - ExternalDataSearchAndCollect
      - ExternalDataSearchCustomPrompt
      - ExternalDataSearchGetSummary
      - ExternalDataGetSchema
      type: string
    TaskRetryRuleDto:
      type: object
      properties:
        condition:
          allOf:
          - $ref: '#/components/schemas/ConditionDto'
        definition:
          allOf:
          - $ref: '#/components/schemas/TaskRetryDefinitionDto'
      additionalProperties: false
    StorageTaskSensitivity:
      enum:
      - Sensitive
      - NotSensitive
      type: string
    DependentImportResultDto:
      type: object
      properties:
        templateKey:
          type:
          - string
          - 'null'
        configurationId:
          type: string
          format: uuid
        flowKey:
          type:
          - string
          - 'null'
      additionalProperties: false
    ConditionOperator:
      enum:
      - Equals
      - GreaterThan
      - LowerThan
      - GreaterThanOrEquals
      - LowerThanOrEquals
      - IsNull
      - StringContains
      - NotEquals
      - IsNotNull
      - StringNotContains
      - IsTrue
      - IsFalse
      type: string
    VariableCategory:
      enum:
      - Global
      - Flow
      - Execution
      - Task
      type: string
    FlowInvokerConfigV1Dto:
      allOf:
      - $ref: '#/components/schemas/TaskConfigBaseDto'
      - required:
        - taskType
        type: object
        properties:
          taskType:
            allOf:
            - $ref: '#/components/schemas/TaskType'
            readOnly: true
          runMode:
            allOf:
            - $ref: '#/components/schemas/FlowInvokerRunMode'
          flowKey:
            type:
            - string
            - 'null'
          flowRequest:
            allOf:
            - $ref: '#/components/schemas/ComplexValueDto'
          mapToRequestBody:
            type: boolean
          callbackTimeout:
            type:
            - string
            - 'null'
        additionalProperties: false
