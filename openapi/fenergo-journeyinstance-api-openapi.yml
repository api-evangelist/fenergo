openapi: 3.2.0
info:
  title: Fenergo Journey Instance API
  version: '1.0'
  description: 'Operations tagged JourneyInstance across 2 of this provider''s published API definitions: fenergo-journeycommand-v1-0-openapi.json, fenergo-journeyquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /journeycommand
- url: /journeyquery
security:
- Bearer: []
tags:
- name: JourneyInstance
paths:
  /api/journey-instance:
    post:
      tags:
      - JourneyInstance
      summary: Create journey instance
      description: 'Creates a new journey instance. The request must contain journey schema id that is currently published and in

        effect.


        Required permissions:

        Following permissions are required: JourneyCreate'
      operationId: CreateJourney
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      - name: X-CORRELATION-ID
        in: header
        description: The UiD of the correlation id
        schema:
          type: string
        example: fee5b5f5-b220-4fef-ba38-bf802b98d74d
      requestBody:
        description: Create journey instance request
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CreateJourneyInstanceDtoServiceRequest'
              description: Service request data
      responses:
        '202':
          description: Success. Journey instance created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyInstanceCreatedDtoServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not Found. Journey schema with given id does not exist
                  type: Error
                  errorCode: Error Code
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /journeycommand
  /api/journey-instance/{journeyInstanceId}/abort:
    put:
      tags:
      - JourneyInstance
      summary: Cancel journey instance
      description: 'Cancels a currently in progress journey instance and rejects the associated entity draft.


        Required permissions:

        Following permissions are required: JourneyCancel'
      operationId: AbortJourneyInstance
