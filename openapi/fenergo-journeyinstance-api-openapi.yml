  /api/journey-instance/{journeyInstanceId}/task/complete:
    put:
      tags:
      - JourneyInstance
      summary: Complete journey instance task
      description: 'Completes a currently in progress task.


        If the task is not the last one in given process, the next task will be started, otherwise next process

        will be started.


        If all the processes within stage finished, the next stage will be started. If it''s the last stage, the

        Journey Instance will complete.


        Required permissions:

        Following permissions are required: JourneyEdit'
