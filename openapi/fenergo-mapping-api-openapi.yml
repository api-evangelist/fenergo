openapi: 3.2.0
info:
  title: Fenergo Mapping API
  version: '1.0'
  description: 'Operations tagged Mapping across 2 of this provider''s published API definitions: fenergo-externaldatacommand-v1-0-openapi.json, fenergo-externaldataquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /externaldatacommand
- url: /externaldataquery
security:
- Bearer: []
tags:
- name: Mapping
paths:
  /api/mapping/provider/{providerId}:
    put:
      tags:
      - Mapping
      summary: Create or replace mapping
      description: 'This method creates or replaces mapping between provider adapter schema and the FenX policy.


        Required permissions:

        Following permissions are required: ExternalDataMapperEdit


        Required permissions:

        Following permissions are required: ExternalDataMapperEdit'
      operationId: PutMapping
      parameters:
      - name: providerId
        in: path
        description: Provider ID
        required: true
        schema:
          type: string
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Create or replace mapping request
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ProviderMappingDtoServiceRequest'
              description: Service request data
      responses:
        '202':
          description: Success.
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
