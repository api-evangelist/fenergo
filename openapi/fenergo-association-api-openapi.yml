      type: object
      properties:
        productId:
          type: string
          description: The unique identifier of the product
          format: uuid
        isAgency:
          type: boolean
          description: Whether the product has an active agency Owner association
      additionalProperties: false
      description: Lightweight DTO representing whether a product has an agency association
    SearchForAssociationDtoV2:
      required:
      - maxLevels
      type: object
      properties:
        entityId:
          type:
          - string
          - 'null'
          description: The UiD of the root entity.
          example: 118313c6-91e6-4b05-a537-5a1ab906418f
        maxLevels:
          maximum: 2147483647
          minimum: 1
          type: integer
          description: Maximum hierarchy levels to search.
          format: int32
          example: 3
        journeyId:
          type:
          - string
          - 'null'
          description: "The UiD of the journey.\nIf not provided, only the verified associations will be returned.\nIf provided, unverified associations in the given journey and \nall the verified associations will be returned."
          example: c5d6c4e4-1246-4928-b6ba-6b4e3560e414
        associationTypes:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Types of associations to search for.

            If not provided, all types of associations will be returned.'
          example:
          - legalEntity
          - collateral
        edgeDirection:
          type:
          - string
          - 'null'
          description: 'Edge types - default inbound-outbound.

            inbound-outbound - inbound and outbound edges will be searched.

            inbound - only inbound edges leading to root entity will be searched.

            outbound - only outbound edges from root will be searched.

            If A is the root entity and edgeDirection is outbound, A-->B will be returned.

            If A is the root entity and edgeDirection is inbound, A<-C will be returned.

            If A is the root entity and edgeDirection is inbound-outbound, A-> B and A<-C will be returned.'
          example: inbound-outbound
        allowedInboundAssociationTypesForTraversal:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'The allowed association types of inbound edges for traversal.

            If not provided, all association types for inbound edges during traversal will be accepted.

            If we have two associations A<--Shareholder---B, A<---collateral---C, and root entity is A,

            AllowedInboundAssociationTypesForTraversal: ["Shareholder"], then only A<--Shareholder---B will be returned.'
          example:
          - legalEntity
