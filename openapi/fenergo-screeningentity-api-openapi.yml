openapi: 3.2.0
info:
  title: Fenergo Screening Entity API
  version: '1.0'
  description: 'Operations tagged ScreeningEntity across 4 of this provider''s published API definitions: fenergo-screeningquery-v1-0-openapi.json, fenergo-screeningquery-v2-0-openapi.json, fenergo-screeningquery-v3-0-openapi.json, fenergo-screeningquery-v4-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /screeningquery
security:
- Bearer: []
tags:
- name: ScreeningEntity
paths:
  /api/entity/{entityId}:
    get:
      tags:
      - ScreeningEntity
      summary: Gets an existing Screening entity by ID
      description: 'This method is used to get the data of an existing Screening entity by ID.


        Required permissions:

        Following permissions are required: ScreeningAccess'
      operationId: GetEntity
      parameters:
      - name: entityId
        in: path
        description: The Screening ID of the entity
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: Success. The data of the entity is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningEntityDtoServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not found. The entity couldn't be found
                  type: Error
                  errorCode: Error Code
        '500':
          description: Internal server error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /screeningquery
  /api/entity/getentitieslist:
    post:
      tags:
      - ScreeningEntity
      summary: Get a list of all screening entities found corresponding to a list of legal…
      description: 'This method returns a list of all screening entity objects found corresponding to a given list of legal entity IDs.


        Pre-requisites:


        For a screening entity to be returned for a given legal entity id, it must already exist in the Screening domain.


        If no screening entity is found for a given legal entity id, it will simply not be included in the response.

        The response will contain only the screening entities found.


        A maximum number of 100 legal entity IDs can be submitted in a single request. To query for more,

        please split them into multiple requests.


        Required permissions:

        Following permissions are required: ScreeningAccess'
      operationId: GetEntitiesList
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Get entities list request
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/GetEntitiesListDtoServiceRequest'
      responses:
        '200':
          description: Success. A list of one or more screening entities is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningEntityDtoIEnumerableServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal server error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
