delivery_patterns:
- pattern: webhooks
  direction: push
  description: Fenergo POSTs each notification to a client-registered endpoint.
  management_api: openapi/fenergo-webhooks-v1-0-openapi.json
  scope: fenx.webhooks
  docs: https://docs.fenergox.com/developer-hub/event-notifications/webhook-api-walkthrough
- pattern: polling
  direction: pull
  description: Clients poll the Event Notifications API for queued notifications.
  api:
  - openapi/fenergo-eventnotifications-v1-0-openapi.json
  - openapi/fenergo-eventnotifications-v2-0-openapi.json
  scope: fenx.eventnotifications
  docs: https://docs.fenergox.com/developer-hub/event-notifications/polling-api-walkthrough
- pattern: event ingress
  direction: inbound
  description: Clients push events INTO Fenergo (DataImport, VerifiedImport, CreateAlert, TransactionScreening).
  api: openapi/fenergo-eventingress-v1-0-openapi.json
  scope: fenx.eventingress
  rate_limits: rate-limits/fenergo-rate-limits.yml
  docs: https://docs.fenergox.com/developer-hub/event-ingress/overview
security:
  signature_header: x-fenx-signature
  algorithm: HMAC-SHA256
  format: sha256=<uppercase hex digest of HMAC-SHA256(raw body, shared secret)>
  secret_storage: Fenergo stores only the hash of the client-supplied secret, never plaintext.
  rotation: Clients may replace the secret at any time via the Webhook API.
  docs: https://docs.fenergox.com/developer-hub/event-notifications/webhook-security-using-hmac
message_schema:
  fields:
  - name: id
    description: Notification identifier
  - name: tenantId
    description: Tenant identifier
  - name: eventType
    description: Source domain and event name, e.g. entitydata:created
  - name: relativeUrl
    description: Relative path to the resource that changed, e.g. entitydataquery/api/entity/{id}
  - name: payload
    description: Event-specific body; empty object for many event types
  - name: when
    description: ISO-8601 timestamp the notification was created
  - name: correlationId
    description: Correlation identifier, propagated from x-correlation-id where supplied
  - name: causationId
    description: Identifier of the thing that caused the notification, typically the resource id
  serialization: Non-ASCII characters are escaped to \uXXXX.
  example:
    id: 1a575f9b-6567-4b6e-a77b-d1eb6cd891ca
    tenantId: 215d5a67-d8cb-2a0c-bcf0-d051ceb18011
    eventType: screening:searchcompleted
    relativeUrl: screeningquery/api/batch/3a1e8b52-4489-4b64-ad14-346f2c18cdfr
    correlationId: 11ac5835-45c2-49c4-11a9-3fee55b14433
    causationId: a3fffa4b-f5d6-4034-a93d-082f3881be22
    when: '2021-01-01T00:00:00+00:00'
