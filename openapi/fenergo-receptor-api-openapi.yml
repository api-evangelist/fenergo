openapi: 3.2.0
info:
  title: Fenergo Receptor API
  version: '1.0'
  description: 'Operations tagged Receptor across 3 of this provider''s published API definitions: fenergo-creditscreeningreceptor-v1-0-openapi.json, fenergo-externaldatareceptor-v1-0-openapi.json, fenergo-screeningreceptor-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /creditscreeningreceptor
- url: /externaldatareceptor
- url: /screeningreceptor
tags:
- name: Receptor
paths:
  /api/receptor/callback:
    post:
      tags:
      - Receptor
      summary: Callback
      description: 'This method will handle adapters responses.

        Processes Adapter Responses'
      operationId: Callback
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Adapter response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdapterResponseDto'
          text/json:
            schema:
              $ref: '#/components/schemas/AdapterResponseDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AdapterResponseDto'
      responses:
        '202':
          description: Success. Data Accepted
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /creditscreeningreceptor
