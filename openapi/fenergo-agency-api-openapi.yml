openapi: 3.2.0
info:
  title: Fenergo Nebula Association Query Agency API
  description: '**Association Query API**:


    Association Query API provides endpoints in order to retrieve entity associations.


    **Association Query API provides**:


    Entity Association retrieval


    Unwrapping Requirement Status Model Management'
  version: '1.0'
servers:
- url: /associationquery
security:
- Bearer: []
tags:
- name: Agency
paths:
  /api/agency/target/{entityId}/journey/{journeyId}:
    get:
      tags:
      - Agency
      summary: Get all associations from an Agent in a Journey
      description: 'Required permissions:

        Following permissions are required: AssociationAccess'
      operationId: GetAgencyAssociationsByTargetAndJourney
      parameters:
      - name: entityId
        in: path
        description: The ID of the Entity that is the target of the association
        required: true
        schema:
          type: string
      - name: journeyId
        in: path
        description: The ID of the Journey to search for agency associations in the specific journey
        required: true
        schema:
          type: string
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssociationDtoIEnumerableServiceResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal Server Error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
