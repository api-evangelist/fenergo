note: 'REPLACES a 2026-05-04 generated scaffold that invented free/professional/enterprise tiers with 10/100/1000
  requests-per-minute. Fenergo publishes its real limits in three places and none of them looks like that: a platform-wide
  tenant limit, per-domain limits, a separate point-based complexity budget for Event Ingress, and per-endpoint
  limits for Transaction Monitoring.'
headers:
  remaining: X-Rate-Limit-Remaining
  reset: X-Rate-Limit-Reset
  retry_after: Retry-After
  note: The CLM domain APIs return X-Rate-Limit-Remaining and X-Rate-Limit-Reset (an ISO-8601 UTC timestamp), documented
    as covering the 24-hour window only — "these headers don't include sub-windows (second, minute, or hour)". The
    Transaction Monitoring APIs instead return Retry-After in seconds. There is no X-Rate-Limit-Limit and no RateLimit-Policy
    header.
  observed_example: 'X-Rate-Limit-Remaining: 9992 / X-Rate-Limit-Reset: 2024-04-09T10:55:30.0705512Z'
exhaustion_status: 429
declared_429_in_specs: 18
window_start: The 24-hour domain clock starts on the first API call, not at midnight.
increase_process: Rate-limit increases are requested through the client Client Partner or Solution Architect; bulk
  activity is redirected to the Data Migration and Bulk Load APIs, which are not subject to these limits.
guidance:
- Watch for 429 and retry with exponential backoff plus jitter to avoid a thundering herd.
- Control traffic centrally with a client-side token bucket rather than per-request tuning.
- Cache the access token for its full 15-minute TTL — token requests share the 100/5min/IP identity limit.
