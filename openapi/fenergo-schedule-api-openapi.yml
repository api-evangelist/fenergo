              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    get:
      tags:
      - Schedule
      summary: Get all Schedules
      description: 'This method returns all schedules for the current tenant


        Required permissions:

        Following permissions are required: ReportingAccess'
      operationId: GetAllSchedules
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: Success. The list of Schedules is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllSchedulesItemDtoIEnumerableServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
