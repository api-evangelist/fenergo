components:
  schemas:
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    CollateralDraftUpdatedDto:
      type: object
      properties:
        version:
          type: integer
          description: Version of collateral draft after update
          format: int32
          example: 4
      additionalProperties: false
      description: Response DTO representing updated collateral draft
    UpdateCollateralDraftDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/UpdateCollateralDraftDto'
          description: "Class to represent the collateral uploaded. \nContains all properties needed to fill the metadata of the collateral being uploaded."
      additionalProperties: false
    UpdateCollateralDraftDto:
      type: object
      properties:
        id:
          type: string
          description: The Collateral Id
          format: uuid
          example: e1809731-77df-4e72-98e7-0d314b7a5151
        type:
          type:
          - string
          - 'null'
          description: The Collateral Type
          example: Financial Asset
        properties:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/PropertyDto'
          description: 'List of custom properties for a collateral separate from the standard

            out of the box properties.'
          example:
            firstName:
              type: Single
              value: Tom
            dateOfBirth:
              type: Single
              value: '2021-07-15'
            address:
              type: Collection
              dataGroupId: 674ccef1-cfdc-46af-97f8-340b24ab7f43
              collections:
                54a25d24-1a4b-45c6-a5b4-980e5d3a1df5:
                  properties:
                    country: Spain
                    city: Madrid
                    street: C. de Sevilla
                93468632-1a9e-4ad0-b2e1-c5ec0f65d7b2:
                  properties:
                    country: Spain
                    city: Barcelona
                    street: Carrer de Girona
        status:
          type:
          - string
          - 'null'
          description: The Collateral Draft Status
          example: Active
        sourceCollateralVersion:
          type: integer
          description: The Version of Collateral that draft was made for
          format: int32
          example: 1
        version:
          type: integer
          description: The version of the updated draft
          format: int32
        jurisdictions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VersionedJurisdictionDto'
          description: Collection of policy jurisdictions
        categories:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Collection of categories of passed properties, if null then use all
        entityType:
          type:
          - string
          - 'null'
          description: The type of the entity (Individual, Company, Other, All)
          example: Individual
        entityProperties:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/PropertyDto'
          description: EntityData properties used for rules evaluation
          example:
            firstName:
              type: Single
              value: Tom
            dateOfBirth:
              type: Single
              value: '2021-07-15'
            address:
              type: Collection
