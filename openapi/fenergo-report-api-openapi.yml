openapi: 3.2.0
info:
  title: Fenergo Report API
  version: '1.0'
  description: 'Operations tagged Report across 5 of this provider''s published API definitions: fenergo-financialanalysisquery-v1-0-openapi.json, fenergo-reportscommand-v1-0-openapi.json, fenergo-reportscommand-v2-0-openapi.json, fenergo-reportsquery-v1-0-openapi.json, fenergo-reportsquery-v2-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /financialanalysisquery
- url: /reportscommand
- url: /reportsquery
security:
- Bearer: []
tags:
- name: Report
paths:
  /api/report/set/{setId}/version/{versionId}:
    get:
      tags:
      - Report
      summary: Retrieve a Financial Analysis report for specific version
      description: 'This method returns the Financial Analysis data linked to the specific version.


        Required permissions:

        Following permissions are required: FinancialAnalysisReport'
      operationId: GetFinancialAnalysisReportBySetIdAndVersionId
      parameters:
      - name: setId
        in: path
        description: The id of Financial Analysis Set
        required: true
        schema:
          type: string
          format: uuid
      - name: versionId
        in: path
        description: Financial Analysis Version Id
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: Success. A Financial Analysis report is returned in csv format.
          content:
            application/json:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not Found. Financial Analysis with given ids does not exist
                  type: Error
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /financialanalysisquery
  /api/Report:
    post:
      tags:
      - Report
      summary: Create report
      description: 'Creates and saves a new report.


        Returns the id of the created report.


