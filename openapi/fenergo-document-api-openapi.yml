      x-operation-id-source: derived
    servers:
    - url: /externaldatacommand
  /api/document/signedurl/{fileName}:
    get:
      tags:
      - Document
      summary: Method to get a signed URL from S3
      description: 'This method will generate a URL that will allow the user to open the document in the browser.


        The URL is signed by the AWS S3 service and the token will expire in a short time.


        Required permissions:

        Following permissions are required: ExternalDataAccess


        Required permissions:

        Following permissions are required: ExternalDataAccess'
      parameters:
      - name: fileName
        in: path
        description: Name of document
        required: true
        schema:
          type: string
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: "An url to access the file uploaded for the document with the specified \n            fileName, if found; otherwise, `null`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse_3'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_2'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse_3'
              example:
                data: {}
                messages:
                - message: Not found. If no signed url is found
                  type: Error
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
