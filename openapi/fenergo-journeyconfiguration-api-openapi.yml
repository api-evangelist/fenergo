          description: List of Fenergo.Nebula.Platform.Core.Models.Response.ServiceResponseMessage associated to the service response
      additionalProperties: false
      description: Service response data
    UpdateJourneyConfigurationRequestDto:
      type: object
      properties:
        isCancellationCommentMandatory:
          type: boolean
          description: Flag indicating if journey cancellation comment should be enabled or disabled
        enableSlaEventNotifications:
          type: boolean
          description: Flag indicating if SLA event notifications should be enabled or disabled
        restrictTaskReopenToAssignedTeam:
          type: boolean
