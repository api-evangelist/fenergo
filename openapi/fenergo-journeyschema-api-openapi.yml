components:
  schemas:
    ServiceLevelAgreementLightDtoConditionalValueDto:
      required:
      - logicalOperation
      - operands
      type: object
      properties:
        id:
          type: string
          description: The ID of the condition
          format: uuid
          example: 118313c6-91e6-4b05-a537-5a1ab906418f
        name:
          type:
          - string
          - 'null'
          description: The name of the condition
          example: Company-type only
        description:
          type:
          - string
          - 'null'
          description: The description of the condition
          example: Applicable only when EntityType=Company
        logicalOperation:
          minLength: 1
          type: string
          description: Logical operation on the Fenergo.Nebula.Platform.LogicEngine.Model.Dto.ConditionDto.Operands collection
          example: AND
        operands:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/ConditionDefinitionDto'
          description: Collection of operands for given condition. These might contain additional, nested conditions of type Fenergo.Nebula.Platform.LogicEngine.Model.Dto.ConditionDefinitionDto
        value:
          allOf:
          - $ref: '#/components/schemas/ServiceLevelAgreementLightDto'
          description: Value that should be returned when conditions are met
        priority:
          type: integer
          description: Priority of the value in case when multiple conditional values are evaluated
          format: int32
          example: 1
          exclusiveMinimum: 0
      additionalProperties: false
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
          description: The message
          example: Success
        type:
          type:
          - string
          - 'null'
          description: 'Type of the message

            One of Info, Warning, Error, Forbidden'
          example: Info
        errorCode:
          type:
          - string
          - 'null'
          description: Error Code
          example: INTERNAL_SERVER_ERROR
      additionalProperties: false
      description: The message associated to the service response
    JourneyMilestoneDto:
      required:
      - id
      - name
      - stages
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: The UiD of the Journey Milestone
          format: uuid
          example: 24511767-4586-4b69-af43-c405ec6b154a
        name:
          maxLength: 255
          minLength: 1
          type: string
          description: Journey Milestone name
          example: New Request
        description:
          maxLength: 255
          type:
          - string
          - 'null'
          description: Journey Milestone description
          example: New Request Milestone
        order:
          minimum: 0
          type: integer
          description: Journey Milestone order
          format: int32
          example: 1
        stages:
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
          description: List of Journey Milestone's stages
      additionalProperties: false
      description: DTO representing Journey Milestone
    ServiceLevelAgreementDto:
      type: object
      properties:
        committedHours:
          type:
          - integer
          - 'null'
          description: Committed Hours - sets the amount of time a user has to complete a Journey/Stage/Task
          format: int32
          example: 7
        approachingDueHours:
          type:
          - integer
          - 'null'
          description: Approaching Due Hours - sets the amount of time when the SLA status change to ‘Approaching Due’
          format: int32
          example: 8
        conditions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceLevelAgreementLightDtoConditionalValueDto'
          description: List of conditions required to dynamically assign SLA to Journey/Stage/Task
      additionalProperties: false
      description: Request DTO representing Service Level Agreement of a Journey/Stage/Task
    JourneySchemaVersionSignResponse:
      type: object
      properties:
        journeySchemaId:
          type: string
          description: The UiD of the journey schema
          format: uuid
          example: 118313c6-91e6-4b05-a537-5a1ab906418f
        versionNumber:
          type: integer
          description: The number of the version that has been signed
          format: int32
          example: 2
        status:
          allOf:
          - $ref: '#/components/schemas/VersionStatus'
          description: The new version status
          example: Rejected
      additionalProperties: false
      description: Sign journey schema response contains the new version status
    JourneySchemaDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/JourneySchemaDto'
          description: The service request DTO
      additionalProperties: false
      description: Service request data
    StageDto:
      required:
      - id
      - name
      - processes
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: The UiD of the stage
          format: uuid
          example: 24511767-4586-4b69-af43-c405ec6b154a
        name:
          maxLength: 255
          minLength: 1
          type: string
          description: Stage name
          example: New Request
        dataKey:
          maxLength: 255
          pattern: (^$)|(^[\dA-z]+$)
          type:
          - string
          - 'null'
          description: Stage Datakey
          example: NewRequestStageDataKey
        description:
          maxLength: 255
          type:
          - string
          - 'null'
          description: Stage description
          example: New Request Stage
        order:
          minimum: 0
          type: integer
          description: Stage order
          format: int32
          example: 1
        processesCompletionOrder:
          enum:
          - Sequential
          - AnyOrder
          type:
          - string
          - 'null'
          description: 'Determines the order of completing processes. Defaults to Sequential.

            One of Sequential, AnyOrder'
          example: Sequential
        inParallelWithStages:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          description: Optional list of previous stages when this stage should start
        stageChannel:
          type:
          - string
          - 'null'
          description: Stage channel
          example: Internal
        assignedPortalRoleIds:
          type:
          - array
          - 'null'
          items:
            maxLength: 20
            type: string
          description: The list of IDs of the assigned portal roles
        processes:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/ProcessDto'
          description: List of stage processes
        conditions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ConditionDto'
          description: List of conditions required to trigger stage
        serviceLevelAgreement:
          allOf:
          - $ref: '#/components/schemas/ServiceLevelAgreementDto'
          description: Stage Service Level Agreement
      additionalProperties: false
      description: DTO representing journey stage
    ProcessDto:
      required:
      - id
      - name
      - tasks
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: The UiD of the process
          format: uuid
          example: 3bdd0379-11e9-4fa7-9ddf-05a8eb5e3d37
        name:
          maxLength: 255
          minLength: 1
          type: string
          description: Process name
          example: New Request
        description:
          maxLength: 255
          type:
          - string
          - 'null'
          description: Process description
          example: New Request Process
        order:
          minimum: 0
          type: integer
          description: Process order
          format: int32
          example: 1
        tasksCompletionOrder:
          enum:
          - Sequential
          - AnyOrder
          type:
          - string
          - 'null'
          description: 'Determines the order of completing tasks. Defaults to Sequential.

            One of Sequential, AnyOrder'
          example: Sequential
        tasks:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/TaskDto'
          description: List of process tasks
        conditions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ConditionDto'
          description: List of conditions required to trigger process
      additionalProperties: false
      description: DTO representing journey process
    TaskDto:
      required:
      - id
      - name
      - taskType
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: The UiD of the task
          format: uuid
          example: c5207c1d-5242-4c28-b16f-ac028e2bfdfd
        name:
          maxLength: 255
          minLength: 1
          type: string
          description: Task name
          example: Capture Basic Details
        taskKey:
          maxLength: 255
          pattern: (^$)|(^[\dA-z]+$)
          type:
          - string
          - 'null'
          description: Task key
          example: CaptureBasicDetailsTaskKey
        description:
          maxLength: 2000
          type:
          - string
          - 'null'
          description: Task description
          example: Capture Basic Details task
        order:
          minimum: 0
          type: integer
          description: Task order
          format: int32
          example: 1
        taskType:
          minLength: 1
          type: string
          description: Task type
          example: PolicyTask
        teamId:
          type:
          - string
          - 'null'
          description: Team id that task belongs to
