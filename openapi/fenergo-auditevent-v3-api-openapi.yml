                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
  /api/v3/auditevent/groupedEntityEvents:
    post:
      tags:
      - AuditEvent v3
      summary: Get Entity Specific Audit Events, grouped and summarized by the fields that…
      description: 'This method accepts a list of Entity specific resource IDs and returns a list of Audit Events grouped and summarized by field name.


        Each returned record contains the original value as well as the last updated value.


        To retrieve a complete list of updated fields for an Entity, include all entity draft IDs in the request.


        Required permissions:

        Following permissions are required: AuditAccessAndSearch'
      operationId: GetGroupedEntityAuditEventsV3
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
