      parameters:
      - name: taskId
        in: query
        description: Task id
        required: true
        schema:
          type: string
          format: uuid
      - name: journeyInstanceId
        in: path
        description: Journey instance id
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
