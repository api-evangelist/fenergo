components:
  schemas:
    ReceivingDnsRecord:
      type: object
      properties:
        recordType:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
        priority:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: DTO representing Receiving Dns Record
    OutreachDataFieldDto:
      type: object
      properties:
        fieldName:
          type:
          - string
          - 'null'
        tooltip:
          type:
          - string
          - 'null'
        category:
          type:
          - string
          - 'null'
        dataKey:
          type:
          - string
          - 'null'
      additionalProperties: false
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    NewOutreachDraftDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/NewOutreachDraftDto'
          description: Request DTO for initialising a new outreach draft
      additionalProperties: false
    OutreachDocumentDto:
      type: object
      properties:
        documentRequirementName:
          type:
          - string
          - 'null'
        tooltip:
          type:
          - string
          - 'null'
        category:
          type:
          - string
          - 'null'
        dataKey:
          type:
          - string
          - 'null'
      additionalProperties: false
    PortalAccessEmailResponseDtoServiceResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/PortalAccessEmailResponseDto'
          description: Response DTO representing a portal access link email send response
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    NewEmailDomainDto:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Domain name
          example: testmail.fenergonebula.com
        useTenantIdAsDomainId:
          type: boolean
          description: Determines if Domain ID should be set to TenantId. True by default.
      additionalProperties: false
      description: Request DTO representing new email domain request
    EmailSendResponseDto:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: Message Id in mailgun
          example: 20230104083737.750bcf084d35a5a2@testmail.fenergonebula.com
        message:
          type:
          - string
