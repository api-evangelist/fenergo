openapi: 3.2.0
info:
  title: Fenergo Nebula Reporting Query Journey Report API
  description: Reporting Query API is part of FenX eco-system to manage Reporting. All the operations require valid access token obtained from Identity service.
  version: 1.0.0
servers:
- url: /reportingquery
security:
- Bearer: []
tags:
- name: JourneyReport
paths:
  /api/journey-report/journey-started-report:
    post:
      tags:
      - JourneyReport
      summary: Get report for journey started property
      description: 'Returns the list of journeys started within a specified date range.

        Limit: 10000 journeys, for more, please use the /file API


        Required permissions:

        Following permissions are required: ReportingAccess'
      operationId: GetJourneyStartedReport
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Start and end date
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DateRangeReportRequestServiceRequest'
      responses:
        '200':
          description: Success. Journey report for specified criteria is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyStartedDtoDateRangeReportResponseServiceResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal server error
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
  /api/journey-report/journey-started-report/file:
    post:
      tags:
      - JourneyReport
      summary: Get file report for journey started property
      description: 'Returns the link to the file, with a list of journeys started within a specified date range


        Required permissions:

        Following permissions are required: ReportingAccess'
      operationId: GetJourneyStartedFileReport
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
