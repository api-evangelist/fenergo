components:
  schemas:
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    SelectedItemDto:
      type: object
      properties:
        configId:
          type:
          - string
          - 'null'
        configName:
          type:
          - string
          - 'null'
        configVersionKey:
          type:
          - string
          - 'null'
        versionLabel:
          type:
          - string
          - 'null'
        versionNotes:
          type:
          - string
          - 'null'
        dependencies:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DependencyRecordDto'
        effectiveFrom:
          type:
          - string
          - 'null'
          format: date-time
        type:
          allOf:
          - $ref: '#/components/schemas/SelectConfigItemType'
        configKey:
          type:
          - string
          - 'null'
        selectedItemStatus:
          allOf:
          - $ref: '#/components/schemas/SelectedItemStatus'
      additionalProperties: false
    BundleStatus:
      enum:
      - Draft
      - Pending
      - Failed
      - Published
      - Deleted
      type: string
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    SaveBundleVersionDto:
      required:
      - configurationAsOfDate
      - name
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        description:
          maxLength: 400
          type:
          - string
          - 'null'
        versionNotes:
          maxLength: 400
          type:
          - string
          - 'null'
        configurationAsOfDate:
          minLength: 1
          type: string
      additionalProperties: false
    BundleVersionDtoServiceResponse:
