        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: Instance of Fenergo.Nebula.ExternalData.Query.Application.Dto.Mapping.ProviderMappingDto class containing mapping for provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMappingDtoServiceResponse'
        '400':
          description: Invalid request
          content:
