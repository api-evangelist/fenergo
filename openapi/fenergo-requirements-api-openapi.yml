openapi: 3.2.0
info:
  title: Policy Agent Requirements API
  description: API to manage Policy Agent operations
  version: '1.0'
servers:
- url: /policyagent
security:
- Bearer: []
tags:
- name: Requirements
paths:
  /api/v1/extraction/{extractionId}/document/{documentId}/compare:
    get:
      tags:
      - Requirements
      summary: Compare Extracted Requirements with Policy Fields
      description: Returns a pre-computed comparison between extracted requirements and policy fields, with the reviewer's latest persisted overlay merged over each row.
      parameters:
      - name: extractionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewedComparisonItem'
        '404':
          description: Not Found
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
      operationId: getApiV1ExtractionByExtractionIdDocumentByDocumentIdCompare
      x-operation-id-source: derived
