        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Create a custom template set request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomTemplateSetRequestDtoServiceRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateCustomTemplateSetRequestDtoServiceRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateCustomTemplateSetRequestDtoServiceRequest'
