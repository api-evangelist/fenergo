      - ScopedEntity
      summary: Adds new scoped entities to a given Journey and Process
      description: 'This method is used to add new scoped entities to a given Journey and Process and set whether or not they are in scope for Screening.


        Required permissions:

        Following permissions are required: ScreeningEdit, ScreeningAccess'
      operationId: AddScopedEntities
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: The request with the list of scoped entities to be added
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AddScopedEntitiesToJourneyProcessDtoServiceRequest'
      responses:
        '202':
          description: Accepted. The request has been accepted
