    GetJourneyConfigurationResponseDtoServiceResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/GetJourneyConfigurationResponseDto'
          description: The service response DTO
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
          description: List of Fenergo.Nebula.Platform.Core.Models.Response.ServiceResponseMessage associated to the service response
      additionalProperties: false
      description: Service response data
    GetJourneyConfigurationResponseDto:
      type: object
      properties:
        isCancellationCommentMandatory:
          type: boolean
          description: Flag indicating if inheritance is enabled or disabled
        enableSlaEventNotifications:
          type: boolean
          description: Flag indicating if SLA event notifications are enabled or disabled
        restrictTaskReopenToAssignedTeam:
          type: boolean
          description: Flag indicating if task reopening is restricted to users in the task's assigned team
        isCancellationReasonMandatory:
          type: boolean
          description: Flag indicating if journey cancellation reason is mandatory
        isReassignCommentMandatory:
          type: boolean
          description: Flag indicating if reassign-task comment is mandatory
        isReopenReasonEnabled:
          type: boolean
          description: Flag indicating if the reopen-reason dropdown is enabled
        isReopenReasonMandatory:
          type: boolean
          description: Flag indicating if the reopen-reason dropdown selection is mandatory
        validateExistingReferenceDataValues:
          type: boolean
          description: Flag indicating if existing reference data values should be validated on load
      additionalProperties: false
      description: Request DTO representing current related party access layers inheritance configuration data
  securitySchemes:
