openapi: 3.2.0
info:
  title: Fenergo Nebula Audit Query AuditEvent v3 API
  description: The Audit Query API enables the retrieval of audit event data related to various activities within the system.
  version: '3.0'
servers:
- url: /auditquery
security:
- Bearer: []
tags:
- name: AuditEvent v3
paths:
  /api/v3/auditevent/resources:
    post:
      tags:
      - AuditEvent v3
      summary: Get Audit Events for a specific list of resource IDs in a paged manner
      description: 'This method accepts a list of resource IDs and a pager object.


        The resource IDs indicate the records that are being sought, while the pager specifies the number of records to return in each page, the starting index of the first result, sorting field, and order (either "Ascending" or "Descending").


        The resource IDs can refer to entities, journeys, or any other record type.


        The method then returns a list of audit events for each resource ID and a field indicating the total number of results.


        Required permissions:

        Following permissions are required: AuditAccessAndSearch'
      operationId: GetAuditEventsForMultipleResourcesV3
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Resource request object
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ResourceQueryPagedDtoServiceRequest'
      responses:
        '200':
          description: Success. The relevant audit events are returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetForMultipleResourcesResultDtoServiceResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
        '500':
          description: Internal server error
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: The amount of data requested is too large. Please request smaller data set.
                  type: Error
                  errorCode: PAYLOAD_TOO_LARGE
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
  /api/v3/auditevent/searchterm:
    post:
      tags:
      - AuditEvent v3
      summary: Get Audit Events for a specific search term in a paged manner
      description: 'This method takes in a list of resource IDs, a search term and a pager object.


        The resource IDs represent the identifiers of entities, journeys, or any other type of record, while the search term filters these records by either specifying a field name or a field value.

        The pager specifies the number of records to return in each page, the starting index of the first result, sorting field, and order (either "Ascending" or "Descending").


        The method then returns a list of audit events for each resource ID and a field indicating the total number of results.


        Required permissions:

        Following permissions are required: AuditAccessAndSearch'
      operationId: SearchByTermV3
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Search term paged request.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/SearchTermPagedDtoServiceRequest'
      responses:
        '200':
          description: Success. The relevant audit events are returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBySearchTermResultDtoServiceResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
        '500':
          description: Internal server error
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: The amount of data requested is too large. Please request smaller data set.
                  type: Error
                  errorCode: PAYLOAD_TOO_LARGE
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
