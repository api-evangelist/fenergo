openapi: 3.2.0
info:
  title: Fenergo Threshold Model API
  version: '1.0'
  description: 'Operations tagged ThresholdModel across 2 of this provider''s published API definitions: fenergo-riskcommand-v1-0-openapi.json, fenergo-riskquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /riskcommand
- url: /riskquery
security:
- Bearer: []
tags:
- name: ThresholdModel
paths:
  /api/threshold-model:
    post:
      tags:
      - ThresholdModel
      summary: Create a new ThresholdModel
      description: 'This method will create a new ThresholdModel with a first draft version.


        The new version will initialize with the DTO data and have the default status of Draft

        and the Author as the only required Signee.


        Required permissions:

        Following permissions are required: RiskConfigurationEdit'
      operationId: CreateThresholdModel
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: ServiceRequest with the ThresholdModelDto to create
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ThresholdModelDtoServiceRequest'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ThresholdModelDtoServiceRequest'
          application/*+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ThresholdModelDtoServiceRequest'
      responses:
        '202':
          description: ThresholdModel created successfully
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ThresholdModelDtoServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdModelDtoServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ThresholdModelDtoServiceResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: An exception occurred while processing the command
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    get:
      tags:
      - ThresholdModel
      summary: Get all Threshold models
      description: 'This method returns all threshold models for the given tenant.


        Required permissions:

        At least one of the following permissions is required: RiskConfigurationAccess, RiskCalculatorAccess'
      operationId: GetAllThresholdModels
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ThresholdModelDtoIEnumerableServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdModelDtoIEnumerableServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ThresholdModelDtoIEnumerableServiceResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /riskcommand
  /api/threshold-model/{id}:
