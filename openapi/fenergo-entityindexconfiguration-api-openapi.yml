openapi: 3.2.0
info:
  title: Fenergo Entity Index Configuration API
  version: '1.0'
  description: 'Operations tagged EntityIndexConfiguration across 2 of this provider''s published API definitions: fenergo-entitydataquery-v1-0-openapi.json, fenergo-entitydataquery-v2-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /entitydataquery
security:
- Bearer: []
tags:
- name: EntityIndexConfiguration
paths:
  /api/entity-index-configuration:
    get:
      tags:
      - EntityIndexConfiguration
      summary: Get indexed entity properties
      description: 'Returns list of all indexed entity properties.


        Required permissions:

        Following permissions are required: EntityDataAccessAndSearch'
      operationId: GetIndexedEntityProperties
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: Success. The list of indexed entity properties is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityIndexConfigurationDtoIEnumerableServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /entitydataquery
  /api/v2/entity-index-configuration:
    get:
      tags:
      - EntityIndexConfiguration
      summary: Get indexed entity properties
      description: 'Returns list of all indexed entity properties.


        Required permissions:

        Following permissions are required: EntityDataAccessAndSearch'
      operationId: GetIndexedEntityProperties
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
