openapi: 3.2.0
info:
  title: Fenergo Validation Rule API
  version: '1.0'
  description: 'Operations tagged ValidationRule across 2 of this provider''s published API definitions: fenergo-policyquery-v1-0-openapi.json, fenergo-policyquery-v2-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /policyquery
security:
- Bearer: []
tags:
- name: ValidationRule
paths:
  /api/validation-rule/validation-rules:
    post:
      tags:
      - ValidationRule
      summary: Get validation data by jurisdiction(s)
      description: 'Returns validation data of requirements and data groups by requirement set jurisdiction(s).


        Required permissions:

        Following permissions are required: PolicySearch'
      operationId: GetValidationRules
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Get validation data request.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/GetValidationRulesRequestDtoServiceRequest'
              description: Service request data
      responses:
        '200':
          description: Success. The list of validation data is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRuleListServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /policyquery
  /api/v2/validation-rule/validation-rules:
    post:
      tags:
      - ValidationRule
      summary: Get validation data by jurisdiction(s)
      description: 'Returns validation data of requirements and data groups by requirement set jurisdiction(s).


