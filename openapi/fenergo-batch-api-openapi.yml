openapi: 3.2.0
info:
  title: Fenergo Batch API
  version: '1.0'
  description: 'Operations tagged Batch across 7 of this provider''s published API definitions: fenergo-screeningcommand-v1-0-openapi.json, fenergo-screeningcommand-v2-0-openapi.json, fenergo-screeningcommand-v3-0-openapi.json, fenergo-screeningquery-v1-0-openapi.json, fenergo-screeningquery-v2-0-openapi.json, fenergo-screeningquery-v3-0-openapi.json, fenergo-screeningquery-v4-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /screeningcommand
- url: /screeningquery
security:
- Bearer: []
tags:
- name: Batch
paths:
  /api/batch:
    post:
      tags:
      - Batch
      summary: Create a new screening batch to screen one or more entities
      description: 'This method creates a screening batch that triggers asynchronous requests to different screening providers.


        This batch ID can be used in the Screening Query Api to check the status of the request and to get the screening results.


        The method returns the batch ID created in the system.


        For Individuals, the mandatory fields are; tenant + fullName + type OR tenant + firstName + lastName + type.


        For Company’s, the mandatory fields are tenant + type + LEName.


        If providers is null the batch will be created with the active providers.


        If configuration set is null the batch will be created for the specified provider with the default configuration set.


        Otherwise the batch will be created with the providers and configuration sets specified in the request.


        Required permissions:

        Following permissions are required: ScreeningCreate, ScreeningAccess'
      operationId: CreateBatch
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: The Create Batch request
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CreateBatchDtoServiceRequest'
      responses:
        '202':
          description: Success. Batch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreatedDtoServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal server error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /screeningcommand
  /api/batch/{id}/complete:
    put:
      tags:
      - Batch
      summary: Complete an existing screening batch
      description: 'This method is used to complete an existing batch


        All providers must have status ''Search Complete'' or ''Return Failed''


        All matches must be resolved


        Required permissions:

        Following permissions are required: ScreeningEdit, ScreeningAccess'
      operationId: CompleteBatch
      parameters:
      - name: id
        in: path
        description: The ID of the existing batch to be completed
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '202':
          description: Accepted. The request to complete the batch has been accepted
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not found. The batch couldn't be found
                  type: Error
                  errorCode: Error Code
        '500':
          description: Internal server error
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /screeningcommand
  /api/batch/{id}/matches:
