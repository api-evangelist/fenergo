              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /reviewcommand
  /api/review/trigger:
    post:
      tags:
      - Review
      summary: Triggers Review Journeys that are scheduled to be launched Today
      description: 'Launches Review Journeys for the requested Tenant


        Required permissions:

