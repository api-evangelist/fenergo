  /api/risk-model/{id}/version/{versionNumber}/clone:
    post:
      tags:
      - RiskModel
      summary: Clone an existing Version of a RiskModel to a new model
      description: 'This method will clone the selected version of an existing RiskModel

        and create a new model with a single version.


        The new version will contain all the data of the original selected one,

        will have the default status of Draft and the Author as the only required Signee.


        Required permissions:

        Following permissions are required: RiskConfigurationEdit'
      operationId: CloneRiskModelVersion
      parameters:
      - name: id
        in: path
        description: The Id of the existing model
        required: true
        schema:
          type: string
          format: uuid
      - name: versionNumber
        in: path
        description: The version number of the version to clone
        required: true
        schema:
          type: integer
          format: int32
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '202':
          description: RiskModel cloned successfully
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/RiskModelDtoServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/RiskModelDtoServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/RiskModelDtoServiceResponse'
        '400':
