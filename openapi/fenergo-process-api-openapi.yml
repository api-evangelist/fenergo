openapi: 3.2.0
info:
  title: Fenergo Nebula External Data BFF Process API
  description: '**External Data BFF API**:


    External Data BFF API allows to search, retrieve and import information about clients, their associated parties, documents from external providers. Use External Data BFF API to perform the import action.'
  version: '1.0'
servers:
- url: /externaldatabff
security:
- Bearer: []
tags:
- name: Process
paths:
  /api/processes/{contextType}/search:
    post:
      tags:
      - Process
      summary: Create new search request
      description: 'This method will create a search request that will trigger asynchronous requests to different external data providers.


        Required permissions:

        Following permissions are required: ExternalDataAccess


        Required permissions:

        Following permissions are required: ExternalDataAccess'
      operationId: RequestSearch
      parameters:
      - name: contextType
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: The process search request
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/NewRequestSearchRequestDtoServiceRequest'
              description: Service request data
      responses:
        '202':
          description: Success. Search request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewRequestSearchResponseDtoServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
