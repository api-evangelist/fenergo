openapi: 3.2.0
info:
  title: Fenergo Policy API
  version: '1.0'
  description: 'Operations tagged Policy across 2 of this provider''s published API definitions: fenergo-policycommand-v2-0-openapi.json, fenergo-policyquery-v4-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /policycommand
- url: /policyquery
security:
- Bearer: []
tags:
- name: Policy
paths:
  /api/v2/policies:
    post:
      tags:
      - Policy
      summary: Create a new entity policy
      description: 'Creates a new policy for the specified entity type


        Required permissions:

        Following permissions are required: PolicyConfigurationEdit'
      operationId: CreatePolicy
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Create entity policy request
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CreateEntityPolicyRequestDtoServiceRequest'
              description: Service request data
      responses:
        '202':
          description: Success. Entity policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEntityPolicyResponseDtoServiceResponse'
        '400':
          description: One or more validation errors occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://datatracker.ietf.org/doc/html/rfc7231#section-6.5.1
                title: One or more validation errors occurred
                detail: Name is required
                status: 400
                errorCode: VALIDATION_ERROR
                validationErrors:
                - propertyName: Name
                  errorMessage: Name is required
                  attemptedValue: ''
                  validatorType: NotEmptyValidator
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://datatracker.ietf.org/doc/html/rfc7231#section-6.5.3
                title: Access to resource is forbidden.
                detail: 'Access denied. Following permissions are required: Permission1, Permission2'
                status: 403
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://datatracker.ietf.org/doc/html/rfc7231#section-6.6.1
                title: Internal server exception. Please, contact your provider.
                detail: null
                status: 500
