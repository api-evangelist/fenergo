components:
  schemas:
    ReviewDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ruleId:
          type: string
          format: uuid
        reviewType:
          type:
          - string
          - 'null'
        typeId:
          type: string
          format: uuid
        entityId:
          type: string
          format: uuid
        deferredDocumentRequirements:
          allOf:
          - $ref: '#/components/schemas/DeferredDocumentRequirements'
        calculatedDate:
          type: string
          format: date-time
        offset:
          type: integer
          format: int32
        launchDate:
          type: string
          format: date-time
        status:
          type:
          - string
          - 'null'
        journeyType:
          type:
          - string
          - 'null'
        origin:
          allOf:
          - $ref: '#/components/schemas/ReviewOrigin'
      additionalProperties: false
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    UpdateReviewDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/UpdateReviewDto'
      additionalProperties: false
    PatchReviewDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/PatchReviewDto'
      additionalProperties: false
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    ReviewDtoServiceResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/ReviewDto'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    UpdateReviewDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ruleId:
          type: string
          format: uuid
        entityId:
          type: string
          format: uuid
        deferredDocumentRequirements:
          allOf:
          - $ref: '#/components/schemas/DeferredDocumentRequirements'
        status:
          type:
          - string
          - 'null'
        launchDate:
          type: string
          format: date-time
        calculatedDate:
          type: string
          format: date-time
        offset:
          type: integer
          format: int32
      additionalProperties: false
    DeferredDocumentRequirementsReviewProperties:
      required:
      - documentRequirements
      - jurisdictions
      - policyCategories
      type: object
      properties:
        documentRequirements:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DeferredDocumentRequirementsReviewPropertiesDocRequirement'
        policyCategories:
          type:
          - array
          - 'null'
          items:
            type: string
        jurisdictions:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    ObjectServiceResponse:
      type: object
      properties:
        data: {}
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    PatchReviewDto:
      type: object
      properties:
        launchDate:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
    ReviewDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/ReviewDto'
      additionalProperties: false
    ValidationErrorModelListServiceResponse:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ValidationErrorModel'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
      example:
        data:
        - propertyName: data
