components:
  schemas:
    CreateBatchDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/CreateBatchDto'
          description: Represents the create batch request
      additionalProperties: false
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    BatchCreatedDto:
      type: object
      properties:
        batchId:
          type: string
          description: The unique ID for the batch of entities to be screened. A batch can contain one or more entities.
          format: uuid
          example: 12be5a50-66c2-44bb-851e-afc4fc4a28c2
      additionalProperties: false
      description: Represents the data of a batch that has been created
    CreateBatchEntityDto:
      required:
      - searchCriteria
      type: object
      properties:
        legalEntityId:
          type:
          - string
          - 'null'
          description: The unique ID for a Legal Entity in Fen-X
          example: 12be5a50-66c2-44bb-851e-afc4fc4a28c2
        searchCriteria:
          allOf:
          - $ref: '#/components/schemas/SearchCriteriaDto'
          description: The search criteria of the entity that will be used to perform screening requests
        entityAliases:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EntityAliasDto'
          description: The list of aliases for the entity that will be used to perform screening request
      additionalProperties: false
      description: Represents the entity in the create batch request
    StringServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    EntityAliasDto:
      required:
      - id
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: The id of the entity alias, which in FenX is the id of the Alternate Names DataGroup item.
          example: 12be5a50-66c2-44bb-851e-afc4fc4a28c2
        aliasType:
          type:
          - string
          - 'null'
          description: The type of the alias
          example: Also Known As
        fullName:
          type:
          - string
          - 'null'
          description: The Individual's firstname and surname. Alternatively use FirstName with LastName.
          example: John Doe
        firstName:
          type:
          - string
          - 'null'
          description: The Individual's first name. Alternatively use FullName.
          example: John
        middleName:
          type:
          - string
          - 'null'
          description: The Individual's middle name
          example: David
        lastName:
          type:
          - string
          - 'null'
          description: The Individual's surname. Alternatively use FullName.
          example: Doe
        legalEntityName:
          type:
          - string
          - 'null'
          description: Full Company name
          example: Fenergo
      additionalProperties: false
      description: Class to represent a Screening entity Alias
    UpdateMaterialityAssessmentDto:
      required:
      - properties
      type: object
      properties:
        relatedPartyEntityId:
          type: string
          description: The Entity ID for the related party.
          format: uuid
          example: 7d8a7aae-e78f-4acd-8a18-e60454979809
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PropertyDto'
          description: Materiality assessment properties
      additionalProperties: false
      description: Represents the materiality assessment of a related party
    PropertyType:
      enum:
      - Single
      - Custom
      - Collection
      type: string
    UpdateMaterialityAssessmentDtoServiceRequest:
