        comparisonSummary:
          type:
          - string
          - 'null'
        matchType:
          allOf:
          - $ref: '#/components/schemas/ComparisonMatchType'
        policyFieldClassification:
          allOf:
          - $ref: '#/components/schemas/PolicyFieldClassification'
      additionalProperties: false
    PushItemDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        comparisonId:
          type:
          - string
          - 'null'
        requirementName:
          type:
          - string
          - 'null'
        commandName:
          type:
          - string
          - 'null'
        status:
          allOf:
          - $ref: '#/components/schemas/PushItemStatus'
        policyResourceId:
          type:
          - string
          - 'null'
          format: uuid
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    ExportRequirementsResponse:
      type: object
      properties:
        presignedUrl:
          type:
          - string
          - 'null'
      additionalProperties: false
    PolicyFieldClassification:
      enum:
      - PolicyField
      - DocumentRequirement
      - RelatedPartyRequirement
      type: string
    GetRequirementReviewHistoryResponse:
      type: object
      properties:
        comparisonId:
          type:
          - string
          - 'null'
        versions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RequirementReviewHistoryEntry'
      additionalProperties: false
    ReviewChangeType:
