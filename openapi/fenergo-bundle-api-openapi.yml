          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    AddConfigRequestDto:
      required:
      - configItems
      - configKey
      type: object
      properties:
        configKey:
          minLength: 1
          type: string
        configItems:
          type: array
          items:
            $ref: '#/components/schemas/AddConfigItemDto'
      additionalProperties: false
    SaveBundleVersionDtoServiceRequest:
      required:
      - data
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/SaveBundleVersionDto'
      additionalProperties: false
    SelectConfigItemType:
      enum:
      - Auto
      - Manual
      type: string
    SelectedItemStatus:
      enum:
      - DependencyCalculation
      - Error
      - Ready
      type: string
    DependencyRecordDto:
      type: object
      properties:
        dependencyId:
          type:
          - string
          - 'null'
        configKey:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        dependencyVersionKey:
          type:
          - string
          - 'null'
      additionalProperties: false
    CreateBundleRequestDto:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        description:
          maxLength: 400
          type:
          - string
          - 'null'
      additionalProperties: false
    ObjectServiceResponse:
      type: object
      properties:
        data: {}
        messages:
          type:
          - array
          - 'null'
          items:
