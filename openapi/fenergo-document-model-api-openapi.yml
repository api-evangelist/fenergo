components:
  schemas:
    UpdateDocumentDto:
      type: object
      properties:
        documentType:
          type:
          - string
          - 'null'
          description: The type of the document
          example: Driver license
        friendlyName:
          type:
          - string
          - 'null'
          description: The friendly name of the document
        documentRequirementIds:
          uniqueItems: true
          type:
          - array
          - 'null'
          items:
            type: string
          description: Hash Set of Document Requirement Ids from FenX to link the document to document requirements
        documentDataKey:
          type:
          - string
          - 'null'
          description: String represented Document DataKey to uniquely identity a document requirement linked with multiple document models
          example: identificationDocuments
        properties:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/PropertyDto'
          description: Custom document properties
          example:
            firstName:
              type: Single
              value: Tom
            dateOfBirth:
              type: Single
              value: '2021-07-15'
            address:
              type: Collection
              dataGroupId: dfde9f06-040a-4127-b9a0-2c802a6502fc
              collections:
                54a25d24-1a4b-45c6-a5b4-980e5d3a1df5:
                  properties:
                    country: Ireland
                    city: Dublin
                    street: Mayor Street
                47010265-3b85-4407-be61-90d04525f020:
                  properties:
                    country: Ireland
                    city: Dublin
                    street: E Wall Rd
        skipStatusReset:
          type:
          - boolean
          - 'null'
          description: Optional flag to skip document requirement history status reset
        documentURL:
          type:
          - string
          - 'null'
          description: URL of the virtual file
      additionalProperties: false
      description: Properties to update the metadata related to an uploaded document
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
