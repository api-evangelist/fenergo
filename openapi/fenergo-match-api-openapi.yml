components:
  schemas:
    MatchDtoIEnumerableServiceResponse:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MatchDto'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    MatchDataExternalIdDto:
      type: object
      properties:
        entityAliasId:
          type:
          - string
          - 'null'
          description: What entity Alias this externalId is associated with. Will be "PrimaryName" for the PrimaryName external ids
          example: e7b8f7c2-3c4a-4b2a-9e2d-1f2a3b4c5d6e
        value:
          type:
          - string
          - 'null'
          description: The value of the ID
          example: '1234'
      additionalProperties: false
      description: Class to represent a match external id
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    MatchDto:
      type: object
      properties:
        id:
          type: string
          description: The unique ID for the match on a Legal Entity. A single entity can have no matches or more than one match.
          format: uuid
          example: 6fbfa5f9-124f-4159-b947-d9294ad48370
        entityAliasIds:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'List of the Entity AliasIds that this match is associated with. When it''s associated with the primary name of the entity, one of them will be "PrimaryName".

            If the array is null or empty, it means that the match only belongs to the PrimaryName of the entity.'
        status:
          type:
          - string
          - 'null'
          description: The match status. This will be match/no match/unresolved
          example: No Match
        reason:
          type:
          - string
          - 'null'
          description: Connected to the match status
          example: No Name Match
        comments:
          type:
          - string
          - 'null'
          description: Any additional comments
          example: Additional comments
        matchData:
          allOf:
          - $ref: '#/components/schemas/MatchDataDto'
          description: Data related to the match
        lastActionedBy:
          allOf:
          - $ref: '#/components/schemas/LastActionedByDto'
          description: User/System who actioned the match
      additionalProperties: false
      description: Represents a Screening Match
    MatchDataDto:
      required:
      - providerId
      - providerSourceName
      type: object
      properties:
        externalId:
          type:
          - string
          - 'null'
