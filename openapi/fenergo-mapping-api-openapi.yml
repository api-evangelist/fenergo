              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    get:
      tags:
      - Mapping
      summary: Get provider mapping
      description: 'This method will return provider mappings for specific tenant


        Required permissions:

        At least one of the following permissions is required: ExternalDataMapperAccess, ExternalDataAccess


        Required permissions:

        At least one of the following permissions is required: ExternalDataMapperAccess, ExternalDataAccess'
      operationId: GetProviderMapping
      parameters:
      - name: providerId
        in: path
        description: The ID of provider
        required: true
        schema:
          type: string
      - name: entityType
        in: query
        description: Entity type for schema
        schema:
          type: string
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
