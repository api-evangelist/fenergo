components:
  schemas:
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    GetEntitiesListDto:
      required:
      - legalEntityIds
      type: object
      properties:
        legalEntityIds:
          type: array
          items:
            type: string
          description: The list of unique legal entity Ids for which the corresponding screening entities should be returned in the GetEntitiesListRequest
      additionalProperties: false
      description: Class to represent the request for GetEntitiesList
    EntityAliasDto:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: The id of the entity alias, which in FenX is the id of the Alternate Names DataGroup item.
          example: 12be5a50-66c2-44bb-851e-afc4fc4a28c2
        aliasType:
          type:
          - string
          - 'null'
          description: The type of the alias
          example: Also Known As
        fullName:
          type:
          - string
          - 'null'
          description: The Individual's firstname and surname. Alternatively use FirstName with LastName.
          example: John Doe
        firstName:
          type:
          - string
          - 'null'
          description: The Individual's first name. Alternatively use FullName.
          example: John
        middleName:
          type:
          - string
          - 'null'
          description: The Individual's middle name
          example: David
        lastName:
          type:
          - string
          - 'null'
          description: The Individual's surname. Alternatively use FullName.
          example: Doe
        legalEntityName:
          type:
          - string
          - 'null'
          description: Full Company name
          example: Fenergo
      additionalProperties: false
      description: Class to represent a Screening entity Alias
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    GetEntitiesListDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/GetEntitiesListDto'
          description: Class to represent the request for GetEntitiesList
      additionalProperties: false
    AddressDto:
      type: object
      properties:
        addressLine1:
          type:
          - string
          - 'null'
          description: The first line in the address
          example: 7107 Andell Rd
        addressLine2:
          type:
          - string
          - 'null'
          description: The second line in the address
          example: Portobello
        city:
          type:
          - string
          - 'null'
          description: The city
          example: Dublin
        postalCode:
          type:
          - string
          - 'null'
          description: The postal code
          example: D08 YY66
        country:
          type:
          - string
          - 'null'
          description: The country
          example: Ireland
        countryISO2:
          type:
          - string
          - 'null'
          description: The country ISO2 code
          example: IE
        countryISO3:
          type:
          - string
          - 'null'
          description: The country ISO3 code
          example: IRL
        stateProvince:
          type:
          - string
          - 'null'
          description: The state or province
          example: Leinster
        type:
          type:
          - string
          - 'null'
          description: The type
          example: Personal
        category:
          type:
          - string
          - 'null'
          description: The category of the address
          example: Residential
      additionalProperties: false
      description: Represents the address of an entity
    ScreeningEntityDtoIEnumerableServiceResponse:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ScreeningEntityDto'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    SearchCriteriaDto:
      required:
      - type
      type: object
      properties:
        fullName:
          type:
          - string
          - 'null'
          description: The Individual's firstname and surname. Alternatively use FirstName with LastName.
          example: John Doe
        firstName:
          type:
          - string
          - 'null'
          description: The Individual's first name. Alternatively use FullName.
          example: John
        middleName:
          type:
          - string
          - 'null'
          description: The Individual's middle name
          example: David
        lastName:
          type:
          - string
          - 'null'
          description: The Individual's surname. Alternatively use FullName.
          example: Doe
        dateOfBirth:
          type:
          - string
          - 'null'
          description: The Individual's date of birth in DD/MM/YYYY format
          example: 31/12/1990
        gender:
          type:
          - string
          - 'null'
          description: The Individual's gender
          example: Male
        legalEntityName:
          type:
          - string
          - 'null'
          description: Full Company name
          example: Fenergo
        type:
          minLength: 1
          type: string
          description: Legal entity type i.e. Individual or Company
          example: Individual
        address:
          allOf:
          - $ref: '#/components/schemas/AddressDto'
