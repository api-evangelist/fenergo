    post:
      tags:
      - Product
      summary: Clones a product
      description: 'This method clones a product.


        The cloned product will remain within the same entity and journey as the source product.


        Required permissions:

        Following permissions are required: ProductEdit'
      operationId: CloneProduct
      parameters:
      - name: id
        in: path
