    ScheduleBaseDto:
      required:
      - format
      - frequency
      - name
      - queryId
      - recipients
      - timeOfDay
      - timezone
      type: object
      properties:
        name:
          minLength: 1
          type: string
          description: Human-readable name for the schedule
        queryId:
          type: string
          description: ID of the saved query to run on this schedule
          format: uuid
        frequency:
          allOf:
          - $ref: '#/components/schemas/ScheduleFrequency'
          description: 0 = OneTime, 1 = Daily, 2 = Weekly, 3 = Monthly
          x-enumNames:
