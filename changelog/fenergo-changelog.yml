  title: Screening – Added
  kind: added
  domains:
  - Screening
  url: https://docs.fenergox.com/release-notes/api-changelog/2026/07/07/screening/Screening-Added
  summary: 'New V3 Entity endpoints are now available. These replace the existing V1/V2 entity endpoints and introduce
    two key improvements: support for multiple addresses per entity in SearchCriteria, and per-configuration-set
    targeting when toggling Ongoing Screening.'
- date: '2026-07-06'
  title: Entity-Data – Added
  kind: added
  domains:
  - Entity-Data
  url: https://docs.fenergox.com/release-notes/api-changelog/2026/07/06/entity-data/Entity-Data-Added
  summary: New endpoint that returns a named subset of an entity draft's properties for up to 10 drafts in a single
    request. Each result carries the draft's id, type, and only the top-level property keys named in the request.
    Requested keys that don't exist on a draft are omitted, and drafts that don't exist or that the caller cannot
    access are omitted from the response.
