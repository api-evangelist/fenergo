components:
  schemas:
    ListUsersResponseDto:
      type: object
      properties:
        schemas:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'List of one or more URIs that indicate included SCIM schemas that are used to indicate the attributes contained within a resource. <br />

            Example: [ "urn:ietf:params:scim:api:messages:2.0:ListResponse" ]'
        totalResults:
          type: integer
          description: The total number of results returned by the list or query operation
          format: int32
          example: 1
        itemsPerPage:
          type: integer
          description: The number of resources returned in a list response page
          format: int32
          example: 1
        startIndex:
          type: integer
          description: The 1-based index of the first result in the current set of list results
          format: int32
          example: 1
        Resources:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UsersResponseDto'
          description: A list of all the users. This MAY be a subset of the full set of users if pagination is requested
      additionalProperties: false
    SortOrders:
      enum:
      - 0
      - 1
      type: integer
      format: int32
    SearchSCIMRepresentationOrders:
      enum:
      - 0
      - 1
      type: integer
      format: int32
    ErrorResponseDto:
      type: object
      properties:
        schemas:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'List of one or more URIs that indicate included SCIM schemas that are used to indicate the attributes contained within a resource. <br />

            Example: [ "urn:ietf:params:scim:api:messages:2.0:Error" ]'
        status:
          type:
          - string
          - 'null'
          description: The HTTP status code of the error response
          example: '400'
        scimType:
          type:
          - string
          - 'null'
          description: The type of error
          example: invalidSyntax
        detail:
          type:
          - string
          - 'null'
          description: The summary of the error
          example: The request is not well-formatted
      additionalProperties: false
    UsersAddressMultiValuedAttributeDto:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
          description: A label indicating the attribute's function
          example: work
        primary:
          type: boolean
          description: "A Boolean value indicating the 'primary' or preferred attribute value for this attribute, \ne.g., the preferred mailing address or primary email address"
          example: true
        formatted:
          type:
          - string
          - 'null'
          description: The full mailing address, formatted for display or use with a mailing label. This attribute MAY contain newlines.
          example: 100 Universal City Plaza, Hollywood, CA 91608 USA
        streetAddress:
          type:
          - string
          - 'null'
          description: "The full street address component, which may include house number, street name, P.O. box, and multi-line extended street address information. \nThis attribute MAY contain newlines"
          example: 100 Universal City Plaza
        locality:
          type:
          - string
          - 'null'
          description: The city or locality component
          example: Hollywood
        region:
          type:
          - string
          - 'null'
          description: The state or region component
          example: CA
        postalCode:
          type:
          - string
          - 'null'
          description: The zip code or postal code component
          example: '91608'
        country:
          type:
          - string
          - 'null'
          description: The country name component
          example: USA
      additionalProperties: false
    UsersResponseDto:
      type: object
      properties:
        externalId:
          type:
          - string
          - 'null'
          description: A String that is an identifier for the user as defined by the provisioning client
          example: '701984'
        userName:
          type:
          - string
          - 'null'
          description: 'Unique identifier for the User, typically used by the user to directly authenticate to the service provider. <br />

            Each User MUST include a non-empty userName value. This identifier MUST be unique across the service provider''s entire set of Users.'
          example: bjensen@example.com
        name:
          $ref: '#/components/schemas/UsersNameDto'
        active:
          type: boolean
          description: A Boolean value indicating the user's administrative status
          example: true
        displayName:
          type:
          - string
          - 'null'
          description: The name of the User, suitable for display to end-users. The name SHOULD be the full name of the User being described, if known
          example: Babs Jensen
        nickName:
          type:
          - string
          - 'null'
          description: 'The casual way to address the user in real life, e.g., ''Bob'' or ''Bobby'' instead of ''Robert''.

            This attribute SHOULD NOT be used to represent a User''s username (e.g., ''bjensen'' or ''mpepperidge'').'
          example: Babs
        profileUrl:
          type:
          - string
          - 'null'
          description: A fully qualified URL pointing to a page representing the User's online profile.
        userType:
          type:
          - string
          - 'null'
          description: 'Used to identify the relationship between the organization and the user. <br />

            Typical values used might be "Contractor", "Employee", "Intern", "Temp", "External", and "Unknown", but any value may be used'
          example: Employee
        title:
          type:
          - string
          - 'null'
          description: The user's title
          example: Tour Guide
        preferredLanguage:
          type:
          - string
          - 'null'
          description: 'Indicates the user''s preferred written or spoken languages and is generally used for selecting a localized user interface. <br />

            The format of the value is the same as the HTTP Accept-Language header field'
          example: en-US
        locale:
          type:
          - string
          - 'null'
          description: Used to indicate the User's default location for purposes of localizing such items as currency, date time format, or numerical representations
          example: en-US
        timezone:
          type:
          - string
          - 'null'
          description: The User's time zone, in IANA Time Zone database format
          example: America/Los_Angeles
        emails:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UsersGenericMultiValuedAttributeDto'
          description: Email addresses for the User. The values SHOULD be specified according to [RFC5321]
        phoneNumbers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UsersGenericMultiValuedAttributeDto'
          description: Phone numbers for the user. The values SHOULD be specified according to the format defined in [RFC3966]
        ims:
          type:
          - array
          - 'null'
          items:
