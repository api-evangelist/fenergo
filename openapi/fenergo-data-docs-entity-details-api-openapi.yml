openapi: 3.2.0
info:
  title: Fenergo Nebula External Data Command Data & Docs Entity…
  description: '**External Data Command API**:


    External Data Command API allows to import information about clients, their associated parties, documents from external providers.'
  version: '1.0'
servers:
- url: /externaldatacommand
security:
- Bearer: []
tags:
- name: Data & Docs Entity Details
paths:
  /api/datadocs/saveDataDocsEntityDetails:
    post:
      tags:
      - Data & Docs Entity Details
      summary: Save Data&Doc entity details
      description: 'This method will save Data&Doc entity details.


        The method will return the status.


        Required permissions:

        Following permissions are required: ExternalDataAccess


        Required permissions:

        Following permissions are required: ExternalDataAccess'
      operationId: SaveDataDocsEntityDetails
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Save Data&Doc entity details
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/DataDocsEntityDetailsDtoServiceRequest'
              description: Service request data
      responses:
        '202':
          description: Success. Save Data & Docs request created
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not Found
                  type: Error
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
  /api/datadocs/importDataDocsEntityDetails:
    post:
      tags:
      - Data & Docs Entity Details
      summary: Import Data&Doc entity details
      description: 'This method will import Data&Doc entity details.


        The method will return the status.


        Required permissions:

        Following permissions are required: ExternalDataAccess


        Required permissions:

        Following permissions are required: ExternalDataAccess'
      operationId: ImportDocsDataEntityDetails
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Import Data&Doc entity details
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/DataDocsImportDtoServiceRequest'
              description: Service request data
      responses:
        '202':
          description: Success. Import Data & Docs request created
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not Found
                  type: Error
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
components:
  schemas:
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
          description: The message
          example: Success
        type:
          type:
          - string
          - 'null'
          description: 'Type of the message

            One of Info, Warning, Error, Forbidden'
          example: Info
        errorCode:
          type:
          - string
          - 'null'
          description: Error Code
          example: INTERNAL_SERVER_ERROR
      additionalProperties: false
      description: The message associated to the service response
    DataDocsEntityDetailsDto:
      required:
      - journeyId
      - taskId
      type: object
      properties:
        taskId:
          minLength: 1
          type: string
          description: ID of the journey task
          example: 300e2046-f78c-49d2-b326-afba28dc301c
        fields:
          allOf:
          - $ref: '#/components/schemas/DataDocsEntityDetailFieldsDto'
          description: List of Fields, single and datagroup fields supported
        journeyId:
          minLength: 1
          type: string
          description: ID of the journey
          format: uuid
          example: 300e2046-f78c-49d2-b326-afba28dc301c
      additionalProperties: false
      description: DTO representing Data Docs Entity Details Request
    AiSummaryDto:
      type: object
      properties:
        totalGroups:
          type: integer
          format: int32
        duplicateGroups:
          type: integer
          format: int32
        uniqueGroups:
          type: integer
          format: int32
        overview:
          type:
          - string
          - 'null'
        assistanceDateTime:
          type: string
          format: date-time
        keyIdentifier:
          type:
          - array
          - 'null'
          items:
            type: string
        reasoning:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    FieldSource:
      type: object
      properties:
        value:
          type:
          - string
          - 'null'
        provider:
          type:
          - string
          - 'null'
      additionalProperties: false
    DataDocsImportDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/DataDocsImportDto'
          description: The service request DTO
      additionalProperties: false
      description: Service request data
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
          description: The service response DTO
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
          description: List of Fenergo.Nebula.Platform.Core.Models.Response.ServiceResponseMessage associated to the service response
      additionalProperties: false
      description: Service response data
    SingleDataFieldDto:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        providers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FieldSource'
        reviewRequired:
          type: boolean
        isOverridden:
          type: boolean
        description:
          type:
          - string
          - 'null'
        propertyType:
          type:
          - string
          - 'null'
        propertyTypeId:
          type:
          - string
          - 'null'
      additionalProperties: false
    ObjectServiceResponse:
      type: object
      properties:
        data:
          description: The service response DTO
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
          description: List of Fenergo.Nebula.Platform.Core.Models.Response.ServiceResponseMessage associated to the service response
      additionalProperties: false
      description: Service response data
    DataDocsEntityDetailFieldsDto:
      type: object
      properties:
        singleDataFields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SingleDataFieldDto'
          description: List of single data fields
        dataGroupFields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DataGroupFieldDto'
          description: List of datagroups fields
      additionalProperties: false
    DataDocsEntityDetailsDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/DataDocsEntityDetailsDto'
          description: The service request DTO
      additionalProperties: false
      description: Service request data
    StringServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
          description: The service response DTO
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
          description: List of Fenergo.Nebula.Platform.Core.Models.Response.ServiceResponseMessage associated to the service response
      additionalProperties: false
      description: Service response data
    DataDocsImportDto:
      required:
      - journeyId
      - taskId
      type: object
      properties:
        taskId:
          minLength: 1
          type: string
          description: ID of the journey task
          format: uuid
          example: 300e2046-f78c-49d2-b326-afba28dc301c
        journeyId:
          minLength: 1
          type: string
          description: ID of the journey
          format: uuid
          example: 300e2046-f78c-49d2-b326-afba28dc301c
      additionalProperties: false
      description: DTO representing Data Docs Entity Details Request
    DataGroupFieldDto:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        dataGroupId:
          type:
          - string
          - 'null'
        reviewRequired:
          type: boolean
        isOverridden:
          type: boolean
        isAiAssisted:
          type: boolean
        isAiResolved:
          type: boolean
        aiSummary:
          allOf:
          - $ref: '#/components/schemas/AiSummaryDto'
        data:
          type:
          - array
          - 'null'
          items:
            type: object
            additionalProperties:
              type: string
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: Please insert JWT with Bearer into field
      name: Authorization
      in: header
