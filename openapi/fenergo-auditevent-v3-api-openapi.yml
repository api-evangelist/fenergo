components:
  schemas:
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    ScreeningAuditMatchDto:
      type: object
      properties:
        matchId:
          type:
          - string
          - 'null'
          description: Match Id
        entityName:
          type:
          - string
          - 'null'
          description: Entity name
        provider:
          type:
          - string
          - 'null'
          description: Provider name
        entityType:
          type:
          - string
          - 'null'
          description: Entity type
        dateOfBirth:
          type:
          - string
          - 'null'
          description: Entity Date of Birth
        nationality:
          type:
          - string
          - 'null'
          description: Nationality
        alias:
          type:
          - string
          - 'null'
          description: Alias
        fieldsChanges:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AuditFieldChangeDto'
          description: List of field changes history
      additionalProperties: false
      description: DTO representing screening audit match
    GetFinancialAnalysisAuditEventsResultDto:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BaseAuditEvent'
          description: Items for the current page.
        totalItems:
          type: integer
          description: Total count of items.
          format: int64
          example: 1
      additionalProperties: false
    ResourceQueryPagedDto:
      allOf:
      - $ref: '#/components/schemas/ResourceQueryDto'
      - type: object
        properties:
          pager:
            allOf:
            - $ref: '#/components/schemas/PagerDto'
            description: A pager object to specify pagination parameters
            example:
              size: 10
              from: 0
              sortBy: date
              sortOrder: Descending
          excludeEventTypes:
            type:
            - array
            - 'null'
            items:
              type: string
            description: 'Optional list of event types to exclude from results.

              When provided, audit events whose `eventType` matches any value in this list are omitted.'
        additionalProperties: false
      description: The request object that contains a list of resource IDs for which to fetch Audit Events. Includes a pager object.
    AuditMetadata:
      type: object
      properties:
        stages:
          type:
          - array
          - 'null'
          items:
            type: object
            additionalProperties: {}
        userName:
          type:
          - string
          - 'null'
        tenantName:
          type:
          - string
          - 'null'
        journeyName:
          type:
          - string
          - 'null'
        eventName:
          type:
          - string
          - 'null'
        taskReassignedUserBefore:
          type:
          - string
          - 'null'
        taskReassignedUserAfter:
          type:
          - string
          - 'null'
        taskReassignedTeamNameBefore:
          type:
          - string
          - 'null'
        taskReassignedTeamNameAfter:
          type:
          - string
          - 'null'
        reopenedByNameBefore:
          type:
          - string
          - 'null'
        reopenedByNameAfter:
          type:
          - string
          - 'null'
        completedByNameBefore:
          type:
          - string
          - 'null'
        completedByNameAfter:
          type:
          - string
          - 'null'
        taskUnpausedByNameBefore:
          type:
          - string
          - 'null'
        taskUnpausedByNameAfter:
          type:
          - string
          - 'null'
        taskPausedByNameBefore:
          type:
          - string
          - 'null'
        taskPausedByNameAfter:
          type:
          - string
          - 'null'
        dateIsoFormat:
          type:
          - string
          - 'null'
        journeyOwnerReassignedTeamNameBefore:
          type:
          - string
          - 'null'
        journeyOwnerReassignedTeamNameAfter:
          type:
          - string
          - 'null'
        journeyOwnerReassignedUserBefore:
          type:
          - string
          - 'null'
        journeyOwnerReassignedUserAfter:
          type:
          - string
          - 'null'
        originatedEventId:
          type:
          - string
          - 'null'
      additionalProperties: false
    GetGroupedEntityAuditEventsDto:
      allOf:
      - $ref: '#/components/schemas/ResourceQueryDto'
      - required:
        - aggregator
        type: object
        properties:
          pager:
            allOf:
            - $ref: '#/components/schemas/AggregatePagerDto'
            description: Pager details
            example:
              from: 0
              size: 10
              sortOrder: Descending
          aggregator:
            allOf:
            - $ref: '#/components/schemas/EntityEventAggregatorDto'
            description: Specifies how to aggregate the Entity Audit Data. (Mandatory)
          searchProperties:
            allOf:
            - $ref: '#/components/schemas/SearchFieldsDto'
            description: (Optional) Search object to filter returned fields
          excludeDrafts:
            type: boolean
            description: Exclude draft values from search results
          excludeSystemFields:
            type: boolean
            description: Exclude system fields from search results
        additionalProperties: false
      description: The request object that contains a list of entity IDs for which to fetch entity specific audit events.
    JourneyAuditFieldHistoryDto:
      type: object
      properties:
        fieldName:
          type:
          - string
          - 'null'
          description: Field name
          example: TeamId
        newValue:
          type:
          - string
          - 'null'
          description: New field value
          example: Halley
        oldValue:
          type:
          - string
          - 'null'
          description: Old field value
          example: Andromeda
        changedBy:
          type:
          - string
          - 'null'
          description: Changed by user
          example: John@example.com
        updatedOn:
          type:
          - string
          - 'null'
          description: Updated date
          example: '2012-04-23T18:25:43.511Z'
        fieldType:
          type:
          - string
          - 'null'
          description: Field type (Single, Collection, Custom)
          example: Single
        subFields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/JourneyAuditSubFieldDto'
          description: Sub-fields for Collection/Custom types
      additionalProperties: false
      description: Response DTO representing history of fields changes
    EntityEventAggregatorDto:
      required:
      - fieldName
      - sortings
      type: object
      properties:
        fieldName:
          minLength: 1
          type: string
          description: Specifies the property to Group By
          example: fieldName
        sortings:
          minItems: 1
          type: array
