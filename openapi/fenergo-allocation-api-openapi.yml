openapi: 3.2.0
info:
  title: Fenergo Allocation API
  version: '1.0'
  description: 'Operations tagged Allocation across 2 of this provider''s published API definitions: fenergo-financialanalysiscommand-v1-0-openapi.json, fenergo-financialanalysisquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /financialanalysiscommand
- url: /financialanalysisquery
security:
- Bearer: []
tags:
- name: Allocation
paths:
  /api/allocation:
    post:
      tags:
      - Allocation
      summary: Create a new Capacity to Service Set
      description: 'Creates a new Capacity to Service Set for the Journey.


        Required permissions:

        Following permissions are required: FinancialAnalysisEdit'
      operationId: CreateAllocationSet
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Create Capacity to Service Set request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationSetDtoServiceRequest'
      responses:
        '202':
          description: Success. Capacity to Service Set created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationSetDtoServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not Found
                  type: Error
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
