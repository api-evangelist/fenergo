  /api/v2/report-branding/logo:
    post:
      tags:
      - ReportBranding
      summary: Upload a tenant report branding logo
      description: 'Accepts a multipart upload of a PNG or SVG logo file (max 500 KB).


        Streams the file directly to the tenant''s S3 document-management bucket from the API

        (no browser-direct S3 PUT, so no bucket CORS dependency).


        Returns the S3 key the logo was stored under, which the caller should then submit

        to `PUT /api/v2/report-branding` to persist the branding configuration.


        Required permissions:

        Following permissions are required: ReportingEdit'
      operationId: UploadLogo
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: The logo file to upload (multipart/form-data field name `file`).
                  format: binary
            encoding:
              file:
                style: form
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: The logo file to upload (multipart/form-data field name `file`).
                  format: binary
            encoding:
              file:
                style: form
      responses:
        '200':
          description: Success. Logo uploaded and S3 key returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLogoResponseDtoServiceResponse'
        '400':
          description: Bad request. The file is missing, the wrong type, or too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /reportscommand
