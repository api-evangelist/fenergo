      - JourneySlaConfiguration
      summary: Update journey SLA configuration
      description: 'Updates the SLA configuration


        Required permissions:

        Following permissions are required: WorkingDaysEdit'
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
