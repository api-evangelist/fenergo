      operationId: postApiDocument
      x-operation-id-source: derived
    servers:
    - url: /externaldatacommand
  /api/document/saveDocumentsStatuses:
    post:
      tags:
      - Document
      summary: Reject/Reset documents status
      description: 'This endpoint is obsolete and will be terminated on 2027-01-12. Use PATCH /externaldatabff/api/processes/{contextType}/{contextId}/gets/{getId}/document instead.


        This method will reject/reset status of specific document/documents


        Required permissions:

        Following permissions are required: ExternalDataAccess


        Required permissions:

        Following permissions are required: ExternalDataAccess'
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: The document reject/reset status
        content:
