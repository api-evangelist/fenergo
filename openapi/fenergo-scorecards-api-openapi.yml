openapi: 3.2.0
info:
  title: Fenergo Scorecards API
  version: '1.0'
  description: 'Operations tagged Scorecards across 2 of this provider''s published API definitions: fenergo-digitalagentscommand-v1-0-openapi.json, fenergo-digitalagentsquery-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /digitalagentscommand
- url: /digitalagentsquery
security:
- Bearer: []
tags:
- name: Scorecards
paths:
  /api/scorecards:
    post:
      tags:
      - Scorecards
      summary: Validates and stores a scorecard JSON payload
      description: 'Required permissions:

        Following permissions are required: AgentConfigurationAccess'
      operationId: StoreScorecard
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: The scorecard JSON string to validate and persist.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/StringServiceRequest'
      responses:
        '200':
          description: Scorecard stored successfully. Returns the scorecard ID and S3 URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreScorecardResponseDtoServiceResponse'
        '400':
          description: The scorecard payload failed schema validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
        '500':
          description: An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    get:
      tags:
      - Scorecards
      summary: Returns a list of scorecards filtered by agent name, status, or both
      description: 'Required permissions:

        Following permissions are required: AgentConfigurationAccess'
      operationId: ListScorecards
      parameters:
      - name: agentName
        in: query
        description: Optional agent name filter.
        schema:
          type: string
      - name: status
        in: query
        description: Optional status filter (`Draft` or `Approved`).
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of records to return. Defaults to 50.
        schema:
          type: integer
          format: int32
          default: 50
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: The list of matching scorecard records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScorecardRecordListServiceResponse'
        '500':
          description: An exception occurred while processing the request.
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://datatracker.ietf.org/doc/html/rfc7231#section-6.5.3
                title: Access to resource is forbidden.
                detail: 'Access denied. Following permissions are required: Permission1, Permission2'
                status: 403
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://datatracker.ietf.org/doc/html/rfc7231#section-6.5.9
                title: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
                detail: This endpoint is obsolete and was terminated on yyyy-MM-dd
                status: 410
                errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /digitalagentscommand
  /api/scorecards/{id}/approve:
    post:
      tags:
      - Scorecards
      summary: Records approver sign-off on an existing scorecard
      description: 'Required permissions:

        Following permissions are required: AgentConfigurationAccess'
      operationId: ApproveScorecard
      parameters:
      - name: id
        in: path
        description: The unique identifier of the scorecard to approve.
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: The approval request containing approver notes.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ApproveScorecardRequestServiceRequest'
      responses:
        '200':
          description: Scorecard approved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveScorecardResponseDtoServiceResponse'
        '409':
          description: Conflict saving changes in expected version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: There are conflicts that cannot be resolved automatically, get latest and apply your changes
                  type: Error
                  errorCode: CONFLICT
        '500':
          description: An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /digitalagentscommand
  /api/scorecards/{id}:
    delete:
      tags:
      - Scorecards
      summary: Deletes a scorecard's S3 artefact and DynamoDB index record.
      description: 'Required permissions:

        Following permissions are required: AgentConfigurationAccess'
      operationId: DeleteScorecard
      parameters:
