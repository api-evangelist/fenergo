openapi: 3.2.0
info:
  title: Fenergo Nebula Dashboards Query (PENDING DEPRECATION)…
  description: '!!! IMPORTANT NOTICE:

    This API is pending deprecation and will be removed on 28.02.2026. For more information visit: https://docs.fenergox.com/notice-of-change/2025/07/22/legacy-dashboards-deprecation


    Dashboards Query API is part of FenX eco-system to manage Dashboards. All the operations require valid access token obtained from Identity service.'
  version: 1.0.0
servers:
- url: /dashboardsquery
security:
- Bearer: []
tags:
- name: UnassignedTasks
paths:
  /api/unassigned-task:
    post:
      tags:
      - UnassignedTasks
      summary: Get unassigned tasks assigned to the specified team
      description: 'Required permissions:

        Following permissions are required: TeamDashboardAccess'
      operationId: GetUnassignedTasksDashboard
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: List of team IDs
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StringListServiceRequest'
      responses:
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: The amount of data requested is too large. Please request smaller data set.
                  type: Error
                  errorCode: PAYLOAD_TOO_LARGE
        '200':
          description: Success. Unassigned task dashboard for specified criteria is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnassignedTasksDtoListServiceResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal server error
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
      deprecated: true
  /api/unassigned-task/preview:
    post:
      tags:
      - UnassignedTasks
      summary: Get unassigned tasks assigned to the specified team
      description: 'Required permissions:

        Following permissions are required: TeamDashboardAccess'
      operationId: GetUnassignedTasksDashboardPreview
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: List of team IDs
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StringListServiceRequest'
      responses:
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: The amount of data requested is too large. Please request smaller data set.
                  type: Error
                  errorCode: PAYLOAD_TOO_LARGE
        '200':
          description: Success. Unassigned task dashboard for specified criteria is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnassignedTasksDtoListServiceResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal server error
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
  /api/unassigned-task/tasks:
    post:
      tags:
      - UnassignedTasks
      summary: Get unassigned tasks assigned to the specified team
      description: 'Required permissions:

        Following permissions are required: TeamDashboardAccess'
      operationId: GetUserUnassignedTasks
      parameters:
      - name: status
        in: query
        description: Task status
        schema:
          $ref: '#/components/schemas/UnassignedTaskStatus'
        example: InProgress
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: List of team IDs
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StringListServiceRequest'
        required: true
      responses:
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: The amount of data requested is too large. Please request smaller data set.
                  type: Error
                  errorCode: PAYLOAD_TOO_LARGE
        '200':
          description: Success. Unassigned task dashboard for specified criteria is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnassignedTasksDtoListServiceResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '500':
          description: Internal server error
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
components:
  schemas:
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
          description: The message
          example: Success
        type:
          type:
          - string
          - 'null'
          description: 'Type of the message

            One of Info, Warning, Error, Forbidden'
          example: Info
        errorCode:
          type:
          - string
          - 'null'
          description: Error Code
          example: INTERNAL_SERVER_ERROR
      additionalProperties: false
      description: The message associated to the service response
    ServiceLevelAgreementDto:
      type: object
      properties:
        committedHours:
          type:
          - integer
          - 'null'
          format: int32
        dueDate:
          type:
          - string
          - 'null'
          format: date-time
        approachingDueHours:
          type:
          - integer
          - 'null'
          format: int32
        approachingDueDate:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type:
          - string
          - 'null'
        duePeriod:
          type:
          - string
          - 'null'
        pausedPeriodSec:
          type:
          - integer
          - 'null'
          format: int32
      additionalProperties: false
    ServiceResponse:
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
          description: The service response DTO
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
          description: List of Fenergo.Nebula.Platform.Core.Models.Response.ServiceResponseMessage associated to the service response
      additionalProperties: false
      description: Service response data
    ObjectServiceResponse:
      type: object
      properties:
        data:
          description: The service response DTO
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
          description: List of Fenergo.Nebula.Platform.Core.Models.Response.ServiceResponseMessage associated to the service response
      additionalProperties: false
      description: Service response data
    StringListServiceRequest:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The service request DTO
      additionalProperties: false
      description: Service request data
    UnassignedTasksDto:
      type: object
      properties:
        taskId:
          type:
          - string
          - 'null'
        taskName:
          type:
          - string
          - 'null'
        taskType:
          type:
          - string
          - 'null'
        taskStatus:
          type:
          - string
          - 'null'
        journeyId:
          type:
          - string
          - 'null'
        journeyName:
          type:
          - string
          - 'null'
        clientId:
          type:
          - string
          - 'null'
        clientName:
          type:
          - string
          - 'null'
        assignedTeamId:
          type:
          - string
          - 'null'
        assignedTeamName:
          type:
          - string
          - 'null'
        started:
          type:
          - string
          - 'null'
          format: date-time
        completed:
          type:
          - string
          - 'null'
          format: date-time
        paused:
          type:
          - string
          - 'null'
          format: date-time
        unpaused:
          type:
          - string
          - 'null'
          format: date-time
        entityGeographicAccessLayers:
          type:
          - array
          - 'null'
          items:
            type: string
        entityBusinessAccessLayers:
          type:
          - array
          - 'null'
          items:
            type: string
        journeyGeographicAccessLayers:
          type:
          - array
          - 'null'
          items:
            type: string
        journeyBusinessAccessLayers:
          type:
          - array
          - 'null'
          items:
            type: string
        daysOpen:
          type:
          - string
          - 'null'
        slaPeriod:
          type:
          - string
          - 'null'
        serviceLevelAgreement:
          $ref: '#/components/schemas/ServiceLevelAgreementDto'
      additionalProperties: false
    UnassignedTasksDtoListServiceResponse:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UnassignedTasksDto'
          description: The service response DTO
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
          description: List of Fenergo.Nebula.Platform.Core.Models.Response.ServiceResponseMessage associated to the service response
      additionalProperties: false
      description: Service response data
    UnassignedTaskStatus:
      enum:
      - InProgress
      - NotStarted
      - Paused
      type: string
  securitySchemes:
    Bearer:
      type: apiKey
      description: Please insert JWT with Bearer into field
      name: Authorization
      in: header
