openapi: 3.2.0
info:
  title: Fenergo Nebula Product Policy Query Product Requirements In…
  description: Product Policy Query API is part of FenX eco-system to query for Product Requirement Sets, Requirements, Data Groups and Data Group Fields Instances. All the operations require valid access token obtained from Identity service.
  version: '1.0'
servers:
- url: /productpolicyquery
security:
- Bearer: []
tags:
- name: ProductRequirementsInScope
paths:
  /api/product-requirements-in-scope/evaluate:
    post:
      tags:
      - ProductRequirementsInScope
      summary: Evaluate Product Requirements in scope
      description: 'Returns nonconditional and evaluated conditional Product Requirements that are in scope for a given search criteria and entity parameters.


        Required permissions:

        At least one of the following permissions is required: ProductConfigurationSearch, ProductConfigurationAccess'
      operationId: EvaluateProductRequirementsInScope
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Evaluate Product Requirements in scope request with a set of criteria to search Product Requirements and evaluate conditions
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/EvaluateProductRequirementsInScopeRequestDtoServiceRequest'
      responses:
        '200':
          description: Success. List of Product Requirements is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementListServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not Found
                  type: Error
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
