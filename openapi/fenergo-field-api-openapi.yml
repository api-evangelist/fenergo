openapi: 3.2.0
info:
  title: Fenergo Field API
  version: '1.0'
  description: 'Operations tagged Field across 2 of this provider''s published API definitions: fenergo-policycommand-v2-0-openapi.json, fenergo-policyquery-v4-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /policycommand
- url: /policyquery
security:
- Bearer: []
tags:
- name: Field
paths:
