  mechanism: 'Fenergo declares the deprecation contract inside the specs themselves: 2258 operations carry a 410
    response documented as "Endpoint marked as deprecated was terminated… During the deprecation period, the API
    will include additional ''sunset'' and ''deprecation'' headers." That is RFC 8594 Sunset/Deprecation signalling
    asserted in the machine-readable contract.'
  advance_notice: Behavioural changes are announced on the Notices of Change feed with a Change Notice Date and
    a Change Target Date, typically about five weeks apart, non-live tenants first.
