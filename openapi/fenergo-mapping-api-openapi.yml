              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    delete:
      tags:
      - Mapping
      summary: Delete Mappings
      description: 'This method deletes mapping for a provider.


        Required permissions:

        Following permissions are required: ExternalDataMapperEdit


        Required permissions:

        Following permissions are required: ExternalDataMapperEdit'
