openapi: 3.2.0
info:
  title: Fenergo Tag API
  version: '1.0'
  description: 'Operations tagged Tag across 2 of this provider''s published API definitions: fenergo-policyquery-v1-0-openapi.json, fenergo-policyquery-v2-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /policyquery
security:
- Bearer: []
tags:
- name: Tag
paths:
  /api/tag/requirements:
    get:
      tags:
      - Tag
      summary: Get requirements by tags list
      description: 'Returns list of requirements searched by tags


        Required permissions:

        Following permissions are required: PolicyConfigurationAccess'
      operationId: GetRequirementsByTags
      parameters:
      - name: tags
        in: query
        description: List of tags
        schema:
          type: array
          items:
            type: string
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: Success. List of requirements is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementDtoListServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
