openapi: 3.2.0
info:
  title: Fenergo Jurisdiction API
  version: '1.0'
  description: 'Operations tagged Jurisdiction across 2 of this provider''s published API definitions: fenergo-policycommand-v2-0-openapi.json, fenergo-policyquery-v4-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /policycommand
- url: /policyquery
security:
- Bearer: []
tags:
- name: Jurisdiction
paths:
  /api/v2/policies/{entityPolicyId}/jurisdictions:
    post:
      tags:
      - Jurisdiction
      summary: Create a new policy jurisdiction
      description: 'Creates a new jurisdiction within the specified policy context


        Required permissions:

        Following permissions are required: PolicyConfigurationEdit'
      operationId: CreatePolicyJurisdiction
      parameters:
      - name: entityPolicyId
        in: path
        description: Policy ID
        required: true
        schema:
          type: string
          format: uuid
      - name: workspaceId
        in: query
        description: Optional workspace ID
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Create jurisdiction request
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CreateEntityPolicyJurisdictionRequestDtoServiceRequest'
              description: Service request data
      responses:
        '202':
          description: Success. Jurisdiction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEntityPolicyJurisdictionResponseDtoServiceResponse'
        '400':
          description: One or more validation errors occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://datatracker.ietf.org/doc/html/rfc7231#section-6.5.1
                title: One or more validation errors occurred
                detail: Name is required
                status: 400
                errorCode: VALIDATION_ERROR
                validationErrors:
                - propertyName: Name
                  errorMessage: Name is required
                  attemptedValue: ''
                  validatorType: NotEmptyValidator
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc7231#section-6.5.4
                title: Resource not found
                detail: Not Found. Policy with a given ID does not exist
                status: 404
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
