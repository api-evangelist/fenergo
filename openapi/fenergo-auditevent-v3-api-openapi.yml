  /api/v3/auditevent/entityeventdetails:
    post:
      tags:
      - AuditEvent v3
      summary: Get all Audit Events specific to an Entity, for a particular field
      description: 'This method accepts a list of resource IDs specific to an Entity and a field name, and returns relevant Audit Events filtered by the specified field in a paginated format.


        To retrieve a complete list of Audit Event entries for the specified field, make sure to include both the Entity ID and all its related Entity Draft IDs in your request.


        Required permissions:

        Following permissions are required: AuditAccessAndSearch'
      operationId: GetEntityAuditEventsByFieldNameV3
      parameters:
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      requestBody:
        description: Entity Audit Events request.
        content:
          application/json:
            schema:
