openapi: 3.2.0
info:
  title: Fenergo Document API
  version: '1.0'
  description: 'Operations tagged Document across 4 of this provider''s published API definitions: fenergo-docgenquery-v1-0-openapi.json, fenergo-externaldatacommand-v1-0-openapi.json, fenergo-externaldataquery-v1-0-openapi.json, fenergo-policyagent-v1-0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /docgenquery
- url: /externaldatacommand
- url: /externaldataquery
- url: /policyagent
security:
- Bearer: []
tags:
- name: Document
paths:
  /api/document/{id}:
    get:
      tags:
      - Document
      summary: Get document by Id
      description: This method returns document for a given id.
      operationId: GetDocumentById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
      responses:
        '200':
          description: Success. Document is returned
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentModelDtoIEnumerableServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentModelDtoIEnumerableServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentModelDtoIEnumerableServiceResponse'
        '400':
          description: Bad request. The request has missing/invalid values
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorModelListServiceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: Not Found. A document with given id does not exist
                  type: Error
                  errorCode: Error Code
        '401':
          description: User is not authorized to perform this request
          content:
            application/json:
              example:
                message: Unauthorized
        '403':
          description: Access to resource is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '500':
          description: Internal server exception. Please, contact your provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: null
                messages:
                - message: Internal server exception. Please, contact your provider.
                  type: Error
                  errorCode: INTERNAL_SERVER_ERROR
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: OBSOLETE_ENDPOINT
    servers:
    - url: /docgenquery
  /api/document/{journeyId}/{taskId}:
    get:
      tags:
      - Document
      summary: Get documents by journey Id and task Id
      description: This method returns documents for a given journey id and task id.
      operationId: GetDocumentsByJourneyIdTaskId
      parameters:
      - name: journeyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: taskId
