        '403':
          description: Access to resource is forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectServiceResponse'
              example:
                data: {}
                messages:
                - message: 'Access denied. Following permissions are required: Permission1, Permission2'
                  type: Forbidden
                  errorCode: Error Code
        '410':
          description: Endpoint marked as deprecated was terminated. This response will be present only if the endpoint was marked as deprecated and has reached the sunset date. During the deprecation period, the API will include additional 'sunset' and 'deprecation' headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringServiceResponse'
              example:
                data: null
                messages:
                - message: This endpoint is obsolete and was terminated on yyyy-MM-dd
                  type: Error
                  errorCode: Error Code
    servers:
    - url: /collateralquery
  /api/asset/collateral/{collateralId}/journey/{journeyId}/task/{taskId}/snapshot:
    get:
      tags:
      - Asset
      summary: Get Collateral Assets snapshot for the given Task
      description: 'This method retrieves an object containing lists of Assets and drafts from S3 for a given taskId


        Required permissions:

        Following permissions are required: CollateralAccessAndSearch'
      operationId: GetAssetsSnapShot
      parameters:
      - name: collateralId
        in: path
        description: The id of a Collateral that the Assets belong to
        required: true
        schema:
          type: string
          format: uuid
      - name: journeyId
        in: path
        description: The id of a Journey that the Assets belong to
        required: true
        schema:
          type: string
          format: uuid
      - name: taskId
        in: path
        description: The id of a Task that the Assets belong to
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
        description: The UiD of the tenant representing organization
        required: true
        schema:
          type: string
        example: b11f8be3-f29b-4959-8964-956d4af7c468
