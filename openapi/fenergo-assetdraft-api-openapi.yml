          - string
          - 'null'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    PropertyType:
      enum:
      - Single
      - Custom
      - Collection
      type: string
    AssetDraftUpdatedDto:
      type: object
      properties:
        version:
          type: integer
          description: Version of Asset Draft after update
          format: int32
          example: 4
      additionalProperties: false
      description: Response DTO representing updated Asset Draft
    CollateralDataSource:
      type: object
      properties:
        dataSource:
          type:
          - string
          - 'null'
          readOnly: true
        collaterals:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CollateralDto'
      additionalProperties: false
    PropertyDto:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/PropertyType'
          readOnly: true
        discriminator:
          allOf:
          - $ref: '#/components/schemas/PropertyType'
          readOnly: true
        isValid:
          type:
          - boolean
          - 'null'
      additionalProperties: false
    ObjectServiceResponse:
      type: object
      properties:
        data: {}
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceResponseMessage'
      additionalProperties: false
    UpdateAssetDraftDtoServiceRequest:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/UpdateAssetDraftDto'
          description: "Class to represent the Asset uploaded. \nContains all properties needed to fill the metadata of the Asset being uploaded."
      additionalProperties: false
    VersionedJurisdictionDto:
