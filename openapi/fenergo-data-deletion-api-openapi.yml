      tags:
      - Data Deletion
      summary: Set For Deletion status product draft
      description: 'Required permissions:

        Following permissions are required: ProductEdit'
      operationId: SetForDeletionProductDraft
      parameters:
      - name: productId
        in: path
        description: Product id
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: Product draft id
        required: true
        schema:
          type: string
          format: uuid
      - name: X-TENANT-ID
        in: header
