      parameters:
      - name: journeySchemaId
        in: path
        description: Journey schema Id
        required: true
        schema:
          type: string
          format: uuid
      - name: versionNumber
        in: path
        description: Version number to clone
        required: true
        schema:
          type: integer
          format: int32
      - name: X-TENANT-ID
