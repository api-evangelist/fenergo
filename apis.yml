aid: fenergo
name: Fenergo
description: Fenergo is an Irish-headquartered financial-services SaaS vendor whose Fen-X platform delivers
  Client Lifecycle Management (CLM), Know Your Customer (KYC), AML screening, client onboarding, transaction
  monitoring and regulatory compliance to banks, asset managers and financial institutions. The platform
  is API-first and built on CQRS with event sourcing, so nearly every domain ships a separate Command
  (write) and Query (read) REST API. Fenergo publishes 145 OpenAPI 3.0/3.1 contracts covering Entity Data,
  Journey, Policy, Risk, Screening, Associations, Documents, Document Generation, Product, Deals, Collateral,
  Financial Analysis, Credit Screening, Data Migration, ETL, Bulk Load, Audit, Authorization, Identity,
  SCIM 2.0, Data Protection, Event Ingress, Event Notifications, Webhooks, Portal, Reporting, Dashboards,
  Digital IDV, Digital Agents and Transaction Monitoring. Authentication is OAuth 2.0 / OpenID Connect
  client-credentials against a Duende Identity Server, with mTLS available and 105 published granular
  fenx.* scopes.
