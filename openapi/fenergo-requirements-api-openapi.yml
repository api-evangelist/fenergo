components:
  schemas:
    ServiceResponseMessage:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
          description: The message
          example: Success
        type:
          type:
          - string
          - 'null'
          description: 'Type of the message

            One of Info, Warning, Error, Forbidden'
          example: Info
        errorCode:
          type:
          - string
          - 'null'
          description: Error Code
          example: INTERNAL_SERVER_ERROR
      additionalProperties: false
      description: The message associated to the service response
    SaveRequirementReviewResponse:
      type: object
      properties:
        comparisonId:
          type:
          - string
          - 'null'
        version:
          type: integer
          format: int32
        review:
          allOf:
          - $ref: '#/components/schemas/RequirementReviewDto'
      additionalProperties: false
    ComparisonReference:
      type: object
      properties:
        note:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
      additionalProperties: false
    ExtractedRequirementsResponse:
      type: object
      properties:
        documentId:
          type:
          - string
          - 'null'
        documentName:
          type:
          - string
          - 'null'
        version:
          type:
          - string
          - 'null'
        requirements:
          type:
          - array
          - 'null'
          items:
